async function deleteStudent(id){
  const s = studentById(id);
  const school = getActiveSchool();
  if(!confirm(`هل تريد حذف الطالب "${s?.fullName||''}" نهائيًا؟\nسيُحذف حسابها واسمها نهائيًا ولا يمكن استعادتها.`)) return;
  if(__serverEnabled()){
    const r = await __api('POST', 'admin/delete-student', { studentId: id, school });
    if(r.status === 401){ __handleAuthError(r); return; }
    if(r.status !== 200 || !r.j || !r.j.ok){ alert('تعذر الحذف النهائي: ' + (r?.j?.error || 'خطأ')); return; }
  }
  const d = loadDB();
  const st = d.students.find(x => x.id === id);
  if(st){ st.active = false; st.deleted = true; }
  // إسقاط سجلاتها (نقاط/حضور/إنجاز) من النسخة المحلية لئلا تُرفع لاحقًا
  if(Array.isArray(d.notes)) d.notes = d.notes.filter(n => n && n.studentId !== id);
  if(Array.isArray(d.attendance)) d.attendance = d.attendance.filter(a => a && a.studentId !== id);
  if(Array.isArray(d.students) && d.students.some(x => x.id === id)){
    const bs = new Set(Array.isArray(d._blockedStudents) ? d._blockedStudents.map(String) : []);
    bs.add(id); d._blockedStudents = [...bs];
  }
  saveDB(d);
  renderApp();
}
async function deleteAllStudents(){
  if(!confirm('هل أنت متأكد من حذف جميع الطلاب نهائيًا؟')) return;
  const d = loadDB();
  const ids = d.students.filter(s => s.active).map(s => s.id);
  if(ids.length && __serverEnabled()){
    const r = await __api('POST', 'admin/delete-students', { studentIds: ids, school: getActiveSchool() });
    if(r.status === 401){ __handleAuthError(r); return; }
    if(r.status !== 200 || !r.j || !r.j.ok){ alert('تعذر الحذف النهائي: ' + (r?.j?.error || 'خطأ')); return; }
  }
  const bs = new Set(Array.isArray(d._blockedStudents) ? d._blockedStudents.map(String) : []);
  d.students.forEach(s => { s.active = false; s.deleted = true; if(s.id) bs.add(String(s.id)); });
  d._blockedStudents = [...bs];
  d.notes = (d.notes || []).filter(n => n && n.studentId && !bs.has(String(n.studentId)));
  d.attendance = (d.attendance || []).filter(a => a && a.studentId && !bs.has(String(a.studentId)));
  saveDB(d);
  renderApp();
}

function importStudents(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const data = new Uint8Array(e.target.result);
    const wb = XLSX.read(data, { type:'array' });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet);
    if(rows.length === 0){ alert('الملف فارغ'); return; }
    const d = loadDB();
    // كشف أسماء الأعمدة الفعلية
    const cols = Object.keys(rows[0]);
    // دالة مساعدة للبحث عن عمود بأحد الأسماء المرشحة
    const col = (candidates) => { const c = cols.find(k => candidates.some(can => k.includes(can))); return c||''; };
    const nameCol = col(['الاسم','اسم','Name','name']);
    const gradeCol = col(['الصف','صف','Grade','grade']);
    if(!nameCol){ alert(`لم أجد عمود "الاسم" في الملف.\nالأعمدة الموجودة:\n${cols.join('، ')}`); return; }
    if(!gradeCol){ alert(`لم أجد عمود "الصف" في الملف.\nالأعمدة الموجودة:\n${cols.join('، ')}`); return; }
    let created = 0, skipped = 0; const errors = [];

    rows.forEach((row, i) => {
      const fullName = String(row[nameCol] ?? '').trim();
      const gradeName = String(row[gradeCol] ?? '').trim();
      if(!fullName || !gradeName){ skipped++; errors.push(`السطر ${i+2}: الاسم أو الصف فارغ`); return; }

      let grade = d.grades.find(g => g.name === gradeName);
      if(!grade){ grade = { id:__stageId(gradeName), name:gradeName, order: __stageOrder(gradeName, d.grades.length) }; d.grades.push(grade); }
      const campus = getActiveSchool();
      let cls = d.classes.find(c => c.gradeId===grade.id && c.name==='أ');
      if(!cls){ cls = { id:uid(), gradeId:grade.id, name:'أ', campus, capacity:null, teacherIds:[] }; d.classes.push(cls); }

      const seq = (d.students.filter(s => s.classId === cls.id && s.active).length) + 1;
      const studentNo = String(seq).padStart(4,'0');

      const existing = d.students.find(s => s.studentNo === studentNo && s.classId === cls.id);
      if(existing){
        existing.fullName = fullName; existing.active = true;
      } else {
        d.students.push({ id:uid(), fullName, studentNo, classId:cls.id, guardianName:'', guardianPhone:'', active:true, joinedAt: Date.now() });
      }
      created++;
    });

    saveDB(d);
    evt.target.value = '';
    renderApp();
    setTimeout(() => {
      const box = document.getElementById('importResult');
      if(box){
        box.innerHTML = `<div class="card mb"><p style="font-weight:600">تم استيراد ${created} طالب${skipped>0?` — تم تجاوز ${skipped} سطر`:''}</p>${errors.length?`<ul class="small" style="color:#dc2626;margin:8px 0 0;padding-inline-start:18px">${errors.slice(0,20).map(e=>`<li>${escapeHtml(e)}</li>`).join('')}</ul>`:''}</div>`;
      }
    }, 0);
  };
  reader.readAsArrayBuffer(file);
}

  <div class="card table-card">

/* نافذة نوع الغياب: تظهر بجانب زر «غائب» — مستأذن / هارب من الحصة / غياب عادي (بدون اختيار) */
let __absPopupEl = null, __absPopupSid = null;
function openAbsentPopup(ev, sid){
  ev.preventDefault();
  ev.stopPropagation();
  closeAbsentPopup();
  const rect = ev.currentTarget.getBoundingClientRect();
  const pop = document.createElement('div');
  pop.className = 'abs-popup';
  pop.innerHTML = `
    <div class="abs-pop-title">اختر نوع الغياب</div>
    <div class="abs-pop-opt abs-pop-exc" onclick="chooseAbsentType('${sid}','EXCUSED')">🔵 مستأذن</div>
    <div class="abs-pop-opt abs-pop-esc" onclick="chooseAbsentType('${sid}','ESCAPE')">🔴 هارب من الحصة</div>
    <div class="abs-pop-opt abs-pop-nor" onclick="setNormalAbsence('${sid}')">⚪ غياب عادي</div>
    <div class="abs-pop-hint">بدون اختيار = غياب عادي من بداية اليوم</div>`;
  document.body.appendChild(pop);
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  let x = rect.right - pw;
  if(x < 6) x = 6;
  if(x + pw > innerWidth - 6) x = innerWidth - pw - 6;
  let y = rect.bottom + 6;
  if(y + ph > innerHeight - 6) y = rect.top - ph - 6;
  if(y < 6) y = 6;
  pop.style.left = x + 'px';
  pop.style.top = y + 'px';
  __absPopupEl = pop;
  __absPopupSid = sid;
  setTimeout(() => document.addEventListener('mousedown', closeAbsentPopupOutside), 0);
  document.addEventListener('keydown', closeAbsentPopupEsc);
}
function closeAbsentPopupOutside(e){
  const pop = __absPopupEl;
  if(!pop) return;
  if(pop.contains(e.target)) return;
  const sid = __absPopupSid;
  const isRadio = e.target && e.target.tagName === 'INPUT' && e.target.type === 'radio';
  closeAbsentPopup();
  // إذا ضغط على زر/راديو آخر فلن نعيد الرسم هنا (يأخذ الراديو الجديد القرار)، وإلا غياب عادي تلقائي
  if(sid && !isRadio) setNormalAbsence(sid);
}
function closeAbsentPopupEsc(e){
  if(e.key === 'Escape'){
    const sid = __absPopupSid;
    closeAbsentPopup();
    if(sid) setNormalAbsence(sid);
  }
}
function setNormalAbsence(sid){
  closeAbsentPopup();
  if(attendanceState.absenceType) delete attendanceState.absenceType[sid];
  attendanceState.draft[sid] = 'ABSENT';
  rerenderAttendance();
}
function closeAbsentPopup(){
  if(__absPopupEl){
    __absPopupEl.remove();
    __absPopupEl = null;
  }
  __absPopupSid = null;
  document.removeEventListener('mousedown', closeAbsentPopupOutside);
  document.removeEventListener('keydown', closeAbsentPopupEsc);
}
function chooseAbsentType(sid, type){
  closeAbsentPopup();
  attendanceState.absenceType = attendanceState.absenceType || {};
  attendanceState.absenceType[sid] = type;
  attendanceState.draft[sid] = 'ABSENT';
  if(type === 'ESCAPE') notifyAgentEscape(sid);
  rerenderAttendance();
}
function notifyAgentEscape(sid){
  try{
    const d = loadDB();
    const s = studentById(sid);
    if(!s) return;
    const sName = s.fullName || s.name;
    const cls = s.classId ? classById(s.classId) : null;
    const clsLabelTxt = cls ? classLabel(cls) : '';
    const me = currentUser();
    const agents = d.users.filter(u => u.active && u.role === 'AGENT');
    const arr = loadAdminMsgs();
    const text = '🚨 هروب من الحصة: ' + sName + (clsLabelTxt ? ' — ' + clsLabelTxt : '') + (me ? ' (سجّله ' + me.name + ')' : '');
    agents.forEach(a => {
      arr.push({ id: uid(), teacherId: a.id, teacherName: a.name, text, createdAt: new Date().toISOString(), read:false, dismissed:false, revealed:true, views:0, senderRole:'ESCAPE', senderName: me?.name, senderId: me?.id });
    });
    saveAdminMsgs(arr);
    // تنبيه مشترك في قاعدة البيانات (متزامن عبر الخادم) ليصل الوكيل على أي جهاز
    d.escapeAlerts = Array.isArray(d.escapeAlerts) ? d.escapeAlerts : [];
    if(!d.escapeAlerts.some(e => e.date === todayStr() && e.studentId === sid && e.type === 'ESCAPE')){
      d.escapeAlerts.push({ id: uid(), studentId: sid, studentName: sName, className: clsLabelTxt, date: todayStr(), type: 'ESCAPE', teacherId: me?.id, teacherName: me?.name, createdAt: new Date().toISOString(), dismissed:false });
      saveDB(d);
    }
    // إصدار صوت الجرس فورًا مع بقاء تنبيه أحمر نابض للوكيل
    if(agents.length){
      startMsgBeepLoop();
      try { playMsgAlert(); }catch(e){}
      renderApp();
    }
  }catch(e){}
}
function markAllPresent(){
  Object.keys(attendanceState.draft).forEach(id => attendanceState.draft[id] = 'PRESENT');
  Object.keys(attendanceState.tDraft||{}).forEach(id => attendanceState.tDraft[id] = 'PRESENT');
  attendanceState.absenceType = {};
  document.querySelectorAll('#attTableBody input[type="radio"]').forEach(inp => { if(inp.dataset.status === 'PRESENT') inp.checked = true; });
  refreshAttendanceSummary();
}
function saveAttendance(){
  const d = loadDB();
  if(!isSchoolDay(attendanceState.date)){
    alert('أيام الدراسة من الاثنين إلى الجمعة فقط — لا يمكن تسجيل حضور في العطلة (الأحد/السبت)');
    return;
  }
  let lateCount = 0, latePoints = 0;
  Object.entries(attendanceState.draft).forEach(([studentId, status]) => {
    let rec = d.attendance.find(a => a.studentId === studentId && a.date === attendanceState.date);
    const realClassId = studentById(studentId)?.classId || attendanceState.classId;
    const at = (status === 'ABSENT' && attendanceState.absenceType && attendanceState.absenceType[studentId]) || undefined;
    let lateMins = 0;
    const st = d.students.find(x => x.id === studentId);
    if(st){
      st.lateMinutes = st.lateMinutes || {};
      st.lateType = st.lateType || {};
      const date = attendanceState.date;
      if(status === 'LATE'){
        const minsEl = document.getElementById('stLatMin-' + studentId);
        const mins = parseInt((minsEl && minsEl.value) || '0', 10);
        lateMins = isNaN(mins) || mins < 0 ? 0 : mins;
        st.lateMinutes[date] = lateMins;
        const typeEl = document.getElementById('stLatType-' + studentId);
        const stType = typeEl && typeEl.value ? typeEl.value : (attendanceState.sLateType && attendanceState.sLateType[studentId]);
        st.lateType[date] = (stType === 'MORNING' || stType === 'CLASS' || stType === 'EARLY_LEAVE') ? stType : 'MORNING';
        lateCount++; latePoints += attendancePoints('LATE', lateMins);
      }
      else { delete st.lateMinutes[date]; delete st.lateType[date]; }
    }
    const attObj = { id:uid(), studentId, classId:realClassId, date:attendanceState.date, status, absenceType: at, createdBy: currentUser()?.id, _t: Date.now() };
    if(status === 'LATE' && lateMins > 0) attObj.lateMinutes = lateMins;
    const me = currentUser()?.id;
    if(rec){
      // قائمة مؤكِّدي الغياب: تُجمَّع عند كل حفظ (اتحاد) — الغياب لا يُحتسب إلا إذا سجّله
      // معلّمان مختلفان في حصّتين مختلفتين (≥2 مؤكِّد فعلي)، أو سجل قديم (قبل القاعدة).
      let clerks = Array.isArray(rec.absClerks) ? rec.absClerks.slice() : [];
      if(status === 'ABSENT'){
        // سجل قديم بلا قائمة (غياب سُجّل قبل القاعدة): نضع شارة الحفظ مسبقاً ليستمر احتسابه
        if(!Array.isArray(rec.absClerks)){ clerks = rec.status === 'ABSENT' ? [__LEGACY_ABS] : []; }
        if(me && clerks.indexOf(me) === -1) clerks.push(me);
      } else {
        // حاضر/متأخر من هذا المعلم: نزيل تأكيده وشارة القديم — تصحيح صريح يلغي هذا الغياب
        clerks = clerks.filter(c => c !== me && c !== __LEGACY_ABS);
      }
      rec.status = status; rec.classId = realClassId; rec.absenceType = at; rec.absClerks = clerks; rec._t = Date.now(); rec.createdBy = me || rec.createdBy;
      if(status === 'LATE' && lateMins > 0) rec.lateMinutes = lateMins; else delete rec.lateMinutes;
    }
    else {
      if(status === 'ABSENT' && me) attObj.absClerks = [me]; else attObj.absClerks = [];
      d.attendance.push(attObj);
    }
  });
  Object.entries(attendanceState.tDraft || {}).forEach(([teacherId, status]) => {
    const u = d.users.find(x => x.id === teacherId);
    if(!u) return;
    u.absences = u.absences || [];
    u.markedLate = u.markedLate || [];
    u.lateMinutes = u.lateMinutes || {};
    u.lateType = u.lateType || {};
    const attBefore = __attSig(u);
    const date = attendanceState.date;
    if(status === 'ABSENT'){ if(!u.absences.includes(date)) u.absences.push(date); u.markedLate = u.markedLate.filter(x => x !== date); delete u.lateMinutes[date]; delete u.lateType[date]; }
    else if(status === 'LATE'){
      if(!u.markedLate.includes(date)) u.markedLate.push(date);
      u.absences = u.absences.filter(x => x !== date);
      const minsEl = document.getElementById('latMin-' + teacherId);
      const mins = parseInt((minsEl && minsEl.value) || '0', 10);
      u.lateMinutes[date] = isNaN(mins) || mins < 0 ? 0 : mins;
      const typeEl = document.getElementById('latType-' + teacherId);
      const tType = typeEl && typeEl.value ? typeEl.value : (attendanceState.tLateType && attendanceState.tLateType[teacherId]);
      u.lateType[date] = (tType === 'MORNING' || tType === 'CLASS' || tType === 'EARLY_LEAVE') ? tType : 'MORNING';
    }
    else { u.absences = u.absences.filter(x => x !== date); u.markedLate = u.markedLate.filter(x => x !== date); delete u.lateMinutes[date]; delete u.lateType[date]; }
    if(__attSig(u) !== attBefore) __attTouch(u);
  });
  d._ts = Date.now();
  saveDB(d);
  // رفع مباشر مؤكد لمحتوى الحفظ (يتضمن غياب/تأخر المعلمين) بدل الاعتماد على جدولة
  // الرفع التي قد تُهمل تعديلات كشف «المعلمون» أو يمحيها سحب لاحق — نرفع فوراً هنا.
  {
    const schoolNow = getActiveSchool();
    if(__syncEnabled() && schoolNow){
      const body = JSON.stringify({ ts: d._ts, data: d });
      try{
        fetch(SYNC_API + schoolNow, { method:'PUT', headers:{ 'Content-Type':'application/json' }, body })
          .catch(()=>{ if(typeof __syncSchedule === 'function') __syncSchedule(schoolNow, 4000); });
      }catch(e){
        if(typeof __syncSchedule === 'function') __syncSchedule(schoolNow, 4000);
      }
    }
  }
  attendanceState.draft = {};
  attendanceState.absenceType = {};
  attendanceState.sLateMin = {};
  attendanceState.sLateType = {};
  attendanceState.tDraft = {};
  attendanceState.tLateMin = {};
  attendanceState.tLateType = {};
  const msg = document.getElementById('attSaveMsg');
  if(msg){
    let txt = 'تم حفظ الحضور بنجاح';
    if(lateCount > 0) txt += ' — تأخر ' + lateCount + ' طالب (خصم ' + latePoints + ' نقطة)';
    if(lateCount > 0) msg.style.color = '#dc2626'; else { msg.style.color = '#16a34a'; }
    msg.textContent = txt;
  }
}

  if(isStudent){

/* ===== طابور مطالبات إعادة الملكية (للإدارة) =====
   طلب المعلم لا يحمل نصّ الملاحظة: المدير يميّزها من جدول الملاحظات
   أعلاه (تراه الإدارة كاملاً). لا نضع النصّ هنا حتى لا يتحوّل الطابور إلى
   قناة تسريب لو تسرّبت الجلسة يوماً ما. */
function NRC_claimsQueueHtml(){
  return `<div class="card mb" id="nrcClaimsQueue" style="display:none">
    <h2 class="section-title" style="margin:0 0 6px">طلبات إعادة ملاحظات قديمة</h2>
    <div id="nrcClaimsBody"><div class="muted small">جارٍ التحميل…</div></div>
  </div>`;
}
async function NRC_loadClaims(){
  const box = document.getElementById('nrcClaimsQueue');
  const body = document.getElementById('nrcClaimsBody');
  if(!box || !body) return;
  if(!__serverEnabled()){ box.style.display = 'none'; return; }
  try{
    const r = await __api('GET', NOTES_CLAIM_API + '/s');
    if(r.status !== 200 || !r.j || !r.j.ok){ box.style.display = 'none'; return; }
    const rows = (r.j.claims || []).map(c => {
      const by = userById(c.requestedBy);
      const when = c.requestedAt ? new Date(c.requestedAt).toLocaleDateString('ar-SA') : '—';
      return `<tr>
        <td>${escapeHtml(c.studentName || '—')}</td>
        <td>${escapeHtml(c.category || '—')}</td>
        <td>${escapeHtml((by && by.name) || c.requestedBy || '—')}</td>
        <td class="muted small">${when}</td>
        <td class="muted small">${c.hasText ? 'نصّ محفوظ' : 'بلا نصّ'}</td>
        <td>${c.expired ? '<span class="muted small">مهلة انتهت</span>' : ''}
            <button class="btn-primary" onclick="NRC_decideClaim(this,'${c.noteId}',true)" ${c.expired?'disabled':''}>اعتماد</button>
            <button class="btn-secondary" onclick="NRC_decideClaim(this,'${c.noteId}',false)">رفض</button></td>
      </tr>`;
    }).join('');
    box.style.display = 'block';
    body.innerHTML = rows ? `<table class="data-table"><thead><tr><th>الطالب</th><th>الفئة</th><th>طالب الإعادة</th><th>التاريخ</th><th>النصّ</th><th>القرار</th></tr></thead><tbody>${rows}</tbody></table>` :
      '<div class="muted small">لا توجد طلبات مفتوحة.</div>';
  }catch(e){ box.style.display = 'none'; }
}
/** قرار الإدارة: نمسح «طلبك قيد المراجعة» من هذا الجهاز. الاعتماد يجعل
    الملاحظة مرئية للمعلم، والرفض يعيد زر الطلب متاحاً. */
async function NRC_decideClaim(btn, noteId, approve){
  if(btn && btn.disabled) return;
  if(approve && !confirm('اعتماد الطلب يعني أن تصير هذه الملاحظة ملكاً للمعلم المطلوبة — لا يمكن التراجع عنه.\n\nهل تتأكد أنها ملاحظتها فعلاً؟')) return;
  if(btn) btn.disabled = true;
  try{
    const r = await __api('POST', NOTES_CLAIM_API + '/decide', { noteId: String(noteId), approve: !!approve });
    if(r.status === 200 && r.j && r.j.ok){
      // الطلب صار محلّاً بلا معلّق: إما اعتُمد (والملكية انتقلت) أو رُفض.
      NRC_clearPendingClaim(noteId);
      alert(approve ? 'اعتُمد الطلب. صارت الملاحظة ملكاً للمعلم، وستظهر لها بعد التحديث.' : 'رُفض الطلب. تبقى الملاحظة بلا مالك.');
      render();
      return;
    }
    if(btn) btn.disabled = false;
    alert(NRC_claimErrorText((r.j && r.j.error) || ('http_' + r.status)));
  }catch(e){ if(btn) btn.disabled = false; alert(NRC_claimErrorText('network')); }
}
/** زر «طلب إعادتها إلي» — يعطّل نفسه أثناء الطلب ثم يحدّث الشاشة. */
async function NRC_claimLegacy(btn, noteId){
  if(btn && btn.disabled) return;
  if(btn) btn.disabled = true;
  const r = await NRC_requestClaim(noteId);
  if(btn) btn.disabled = false;
  if(r.ok){ alert('تم تسجيل طلبك. ستصبح الملاحظة لك بعد موافقة المدير.'); render(); return; }
  if(r.error === 'cancelled') return;
  alert(NRC_claimErrorText(r.error));
  render();
}
let noteType = 'POSITIVE';
let savingNote = false;
function setNoteType(t){
  noteType = t;
  document.getElementById('nTypePos').classList.toggle('active', t==='POSITIVE');
  document.getElementById('nTypeNeg').classList.toggle('active', t==='NEGATIVE');
  const cats = t === 'POSITIVE' ? noteCategoriesPositive : noteCategoriesNegative;
  document.getElementById('nCategory').innerHTML = cats.map(c=>`<option value="${c}">${c}</option>`).join('');
  updateNoteCategoryUI();
}
function updateNoteCategoryUI(){
  const val = document.getElementById('nCategory').value;
  const other = document.getElementById('nOther');
  const hint = document.getElementById('nFreeHint');
  const ptsEl = document.getElementById('nPoints');
  if(other) other.style.display = val==='أخرى' ? '' : 'none';
  if(hint) hint.style.display = val==='تحرير' ? '' : 'none';
  const pts = notePoints(noteType, val);
  if(ptsEl){ ptsEl.textContent = (pts>0?'+':'')+pts; ptsEl.style.color = pts>=0 ? '#16a34a' : '#dc2626'; }
}
/* تأكيد بصري ثابت لا يعتمد على الـ Console: يُظهر للمعلم فورَ الحفظ كم نقطة وكم طالب
   حُفظت محلياً، ويرفق حالة الرفع للخادم. إن تعذّر الرفع يظهر تحذيراً أحمر صريحاً مع تطمين
   أن النقاط محفوظة على الجهاز وستُرفع تلقائياً — فينتهي «تختفي فوراً» كأنه أسطورة. */
let __noteBannerEl = null, __noteBannerTimer = null;
function __noteSaveBanner(msg, isErr){
  try{
    if(!__noteBannerEl){
      __noteBannerEl = document.createElement('div');
      __noteBannerEl.style.cssText = 'position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:99999;max-width:94%;width:auto;padding:13px 18px;border-radius:14px;font-size:14.5px;font-weight:700;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25);font-family:inherit;line-height:1.7;pointer-events:none;transition:opacity .25s;opacity:0;';
      document.body.appendChild(__noteBannerEl);
    }
    __noteBannerEl.style.background = isErr ? '#b91c1c' : '#065f46';
    __noteBannerEl.style.color = '#fff';
    __noteBannerEl.textContent = msg;
    __noteBannerEl.style.opacity = '1';
    clearTimeout(__noteBannerTimer);
    __noteBannerTimer = setTimeout(() => { try{ __noteBannerEl.style.opacity = '0'; }catch(e){} }, isErr ? 9000 : 5500);
  }catch(e){}
}

// عند نجاح الرفع للخادم: تُستبدل رسالة المعلم بعلامة الطمأنة النهائية
// (لا نُبقي «بانتظار الرفع» بعدما تأكد الوصول).
function __notePushOkBanner(count){
  __noteSaveBanner('✅ رُفعت نقاطك للخادم بنجاح — عدد النقاط المحفوظة: ' + (count||'') + ' ولن تختفي أبداً.', false);
}
// عند فشل رفعٍ متكرر للخادم: تحذير صريح — لكن مؤكّد المحلي محفوظ
function __notePushFailBanner(){
  __noteSaveBanner('⚠️ لم يصل خادم المدرسة الآن — لكن نقاطك محفوظة على هذا الجهاز ولن تختفي، وسأعيد الرفع تلقائياً كلما عاد الاتصال.', true);
}

function addNote(){
  const ids = getCheckedStudentIds('n');
  let category = document.getElementById('nCategory').value;
  const description = document.getElementById('nDescription').value.trim();
  if(!ids.length){ alert('اختر طالبًا واحدًا على الأقل'); return; }
  if(category === 'أخرى'){
    const otherVal = document.getElementById('nOther').value.trim();
    if(!otherVal){ alert('اكتب المخالفة أو الملاحظة في خانة "أخرى"'); return; }
    category = otherVal;
  }
  if(category === 'تحرير' && !description){ alert('اكتب تعليقك في خانة الوصف'); return; }
  if(savingNote) return;
  savingNote = true;
  try {
    const d = loadDB();
    // اشتقاق نوع الملاحظة من الفئة المختارة تلقائياً حتى لا يحدث خلل بأن تكون
    // ملاحظة سلبية بفئة موجبة (أو العكس) فتُخصم الإيجابية أو تُضاف السلبية.
    let effType = noteType;
    if(category && category !== 'أخرى' && category !== 'تحرير'){
      if(noteCategoriesPositive.includes(category)) effType = 'POSITIVE';
      else if(noteCategoriesNegative.includes(category)) effType = 'NEGATIVE';
    }
    const points = notePoints(effType, category);
    const batchId = uid();
    // ===== ملكية الملاحظة: معرّف المستخدم الثابت من الجلسة، بلا مطابقة بالاسم =====
    // كان السطر القديم يجرّب مطابقة الاسم والدور إن كان المعرّف يتيماً — وهو
    // بالضبط ما لا يجوز: الأسماء تتكرر وتتغير، ونسبة الملاحظة بالاسم تسرّب
    // ملكيتها. الآن المالك يأتي من الجلسة فقط، والخادم يفرضه عند PUT أياً كان
    // ما يرسله العميل (notes-privacy.enforceNoteOwners).
    const me0 = currentUser();
    const createdById = (me0 && me0.id) ? String(me0.id) : null;
    const savedIds = [];
    ids.forEach(sid => {
      const stRec = (d.students || []).find(s => s && s.id === sid);
      const me = currentUser();
      const ntId = uid();
      savedIds.push(ntId);
      d.notes.push({ id:ntId, studentId:sid, studentNo: stRec && stRec.studentNo != null ? String(stRec.studentNo) : '', studentName: stRec ? (stRec.fullName || stRec.name || '') : '', type:effType, category, description, points, createdBy: createdById, createdByName: me ? me.name : '', createdByRole: me ? me.role : '', createdAt: new Date().toISOString(), batchId });
    });
    saveDB(d);
    try{
      if(__serverEnabled() && __syncEnabled()){
        __markNotesUnpushed(getActiveSchool(), savedIds);
        setTimeout(__refreshUnpushedBar, 0);
      }
    }catch(e){}
    // الرصيد على الشاشة محدَّث فوراً: أرصددة الخادم لم تصل بعد، فنضيف الفرق
    // محلياً حتى لا تقرأ المعلم رقماً قديماً لثوانٍ بعد حفظها.
    ids.forEach(sid => __adjustLocalPoints(sid, points));
    __syncLogAdd({ ev:'note-saved', school:getActiveSchool(), batch:batchId, count:ids.length, type:effType, cat:category, by:createdById, byName:(currentUser()||{}).name || '?' });
    try{
      const bn = ids.slice(0,3).map(sid => {(d.students||[]).find(s=>s.id===sid)?.name || ''}).filter(Boolean);
      const more = ids.length > 3 ? '…' : '';
      const dbgSchool = getActiveSchool();
      const dbgMe = currentUser();
      const dbgSid = ids[0] || '';
      const dbgStud = (d.students||[]).find(s => s.id === dbgSid);
      const dbgNotes = (d.notes||[]).filter(n => n.studentId === dbgSid);
      const dbgTotal = dbgNotes.reduce((a,n) => a + (n.points ?? notePoints(n.type, n.category)), 0);
      const dbgExists = dbgStud ? 'موجودة في قاعدة هذا الجهاز' : '⚠️ غير موجودة في قاعدة هذا الجهاز';
      __noteSaveBanner('✅ حُفظت نقاط ' + ids.length + ' طالب (' + (effType==='EXCELLENCE'?'تميّز/تفوق':effType==='ATTENDANCE'?'انضباط/حضور':'إنجاز/سلوك') + '): ' + bn.join('، ') + more + ' — رصيد أول طالب بعد الحفظ: ' + dbgTotal + ' (' + dbgNotes.length + ' ملاحظة) — ' + dbgExists + ' | القسم: ' + dbgSchool + ' | المعلم: ' + (dbgMe?.name || '—') + ' (المرسل: ' + (dbgMe?.id || '—') + ')', false);
    }catch(e){}
  } finally {
    savingNote = false;
  }
  noteType = 'POSITIVE';
  renderApp();
}

/* حذف نقطة/ملاحظة عند الخطأ — لكل المعلمين (من أضافت النقطة) وللمدير.
   الحذف ناعم (علامة deleted كالتكليفات) لأن دمج الملاحظات عبر الأجهزة «إضافة فقط» —
   الحذف الحقيقي من المصفوفة سيعيد النقطة عند سحب أي جهازٍ آخر. */
function deleteNote(id){
  const d = loadDB();
  const me = currentUser();
  const n = (d.notes || []).find(x => x && x.id === id);
  if(!n){ alert('الملاحظة غير موجودة (ربما حُذفت بالفعل).'); return; }
  if(n.deleted){ alert('هذه النقطة محذوفة بالفعل.'); return; }
  // الصلاحية: المعلم تحذف ما أضافته هي فقط، والمدير يحذف أي نقطة.

  if(!confirm('هل تحذف هذه النقطة (' + (pts>0?'+':'') + pts + ')؟' + (d.students.find(s => s && s.id === n.studentId) ? ' من رصيد ' + d.students.find(s => s && s.id === n.studentId).fullName + '.' : '') + '\n\nسيُزال تأثيرها من رصيد الطالب على كل الأجهزة.')) return;
  n.deleted = true;
  n.deletedAt = new Date().toISOString();
  n.deletedBy = me.id;

  __adjustLocalPoints(n.studentId, -pts);
  __syncLogAdd({ ev:'note-deleted', school:getActiveSchool(), id, studentId:n.studentId, pts, by:me.id, byName:me.name || '?' });

}
/* دمج الملاحظات أثناء السحب/الرفع محترمٌ للحذف الناعم: المحذوفة تبقى (شاهد قبر disjoint)
   ولا تُعاد النسخة الحية من جهازٍ آخر فوقها — وإلا عادت النقطة المحذوفة من كل جهاز لاحق.
   نفس سياسة betterP للتكليفات: المحذوف يفوز، ثم إصدار أحدث (._v) إن وجد، ثم الأحدث زمنياً. */
function NRC_mergeNotes(base, add){
  if(!Array.isArray(base) || !Array.isArray(add)) return base || [];
  const m = new Map();
  // ===== خصوصية الملاحظات: إسقاط النسخ المحلية المملوكة لغيري فقط =====
  // يُطبَّق على الطرفين (base و add): فـ base قد يكون نسخة localStorage قديمة
  // نزلت قبل التطبيق وفيها كل الملاحظات، وإسقاطها منه هو ما يمنع بقاء نص
  // زميلة على هذا الجهاز.
  // معيار الإسقاط: «مملوكة **لشخص محدَّد** غيري» فقط. أما الملاحظة **غير
  // المملوكة** (بلا createdBy) فلا تُسقط أبداً: لا نعرف صاحبتها، وفقدان وصول
  // المعلم إلى ملاحظة قديمة كتبتها غير مقبول قبل مراجعة الأثر. تبقى محفوظة
  // على الجهاز، والعرض وحده يقرّر ما يظهر (§renderNotes).
  for(const x of base) if(x && x.id != null && !NRC_noteBelongsToOther(x)) m.set(x.id, { n:x, v:0 });
  for(const x of add){
    if(x && NRC_noteBelongsToOther(x)) continue;
    if(!x || x.id == null) continue;
    const ex = m.get(x.id);
    const nv = (typeof x._v === 'number') ? x._v : 0;
    if(!ex){ m.set(x.id, { n:x, v:nv }); continue; }
    // ===== ملكية مُكتسبة لا تُرجَع للنسخة المحلية =====
    // نسخة الخادم تحمل createdBy بعد اعتماد المطالب، والنسخة المحلية بلا
    // مالك. لو رجّحنا محلياً لاختفت الملاحظة من جديد وظهر «طلبك قيد المراجعة»
    // إلى الأبد. لا نقبل createdBy من جهة العميل أصلاً — يقرّره الخادم وحده.
    const oa = !!(x && x.createdBy != null && String(x.createdBy).trim());
    const ob = !!(ex.n && ex.n.createdBy != null && String(ex.n.createdBy).trim());
    if(oa && !ob){ m.set(x.id, { n:x, v:nv }); continue; }
    // المحذوف يفوز (لا يُعاد إحياء نقطة حُذفت عن قصد من أي جهاز)
    if(!!x.deleted || !!ex.n.deleted){ m.set(x.id, { n: (x.deleted ? x : ex.n), v: Math.max(nv, ex.v) }); continue; }
    if(nv !== ex.v){ m.set(x.id, nv > ex.v ? { n:x, v:nv } : ex); continue; }
    const ta = x.updatedAt || x.createdAt || 0, tb = ex.n.updatedAt || ex.n.createdAt || 0;
    m.set(x.id, (ta >= tb) ? { n:x, v:nv } : ex);
  }
  return Array.from(m.values()).map(o => o.n);
}

function deleteTransfer(id){
  const me = currentUser();
  if(!me || me.role !== 'ADMIN'){ alert('حذف التحويل للمدير فقط.'); return; }
  const d = loadDB();
  const t = (d.transfers || []).find(x => x && x.id === id);
  if(!t){ alert('هذا التحويل غير موجود (ربما حُذف من جهاز آخر).'); return; }
  if(t.deleted){ alert('هذا التحويل محذوف بالفعل.'); return; }
  const names = studentIdsOf(t).map(sid => (d.students || []).find(s => s && s.id === sid)).filter(Boolean).map(s => s.fullName).join('، ');
  if(!confirm('حذف التحويل' + (names ? ' للطلاب: ' + names : '') + '؟\n\nسيختفي من كل الأجهزة ولن يعود بعد التحديث. سجل التحويل يبقى محفوظاً على الخادم.' + (t.deductedPoints ? '\n\nوستعود النقاط التي خُصمت تلقائياً مع هذا التحويل.' : ''))) return;
  t.deleted = true;
  t.deletedAt = new Date().toISOString();
  t.deletedBy = me.id;
  // الخصم التلقائي للنقاط ليس في السجل نفسه بل ملاحظات سالبة مرتبطة بمعرّف
  // التحويل (addTransfer يولّد note لكل طالب مع transferId). حذف التحويل وحده
  // كان يُخفي الطلب ويبقى الخصم في الرصيد؛ فندفن ملاحظات هذا التحويل لتعود
  // النقاط. نقتصر على type NEGATIVE حتى لا تُمس ملاحظة كتبتها المعلم يدوياً.
  let restored = 0;
  (d.notes || []).forEach(n => {
    if(!n || n.deleted) return;
    if(n.type !== 'NEGATIVE' || String(n.transferId || '') !== String(id)) return;
    n.deleted = true;
    n.deletedAt = new Date().toISOString();
    n.deletedBy = me.id;
    n.deletedWithTransfer = String(id);
    restored++;
  });
  saveDB(d);
  __syncLogAdd({ ev:'transfer-deleted', school:getActiveSchool(), id, by:me.id, byName:me.name || '?', notesRestored:restored });
  try{ if(restored > 0 && typeof __pointsTotals === 'function'){ const pt = __pointsTotals(); if(pt) pt.stale = true; } }catch(e){}
  try{ if(typeof __syncSchedule === 'function') __syncSchedule(getActiveSchool(), 0); }catch(e){}
  renderApp();
}

function addTransfer(){
  const ids = getCheckedStudentIds('t');
  const target = document.getElementById('tTarget').value;
  const priority = document.getElementById('tPriority').value;
  let reason = document.getElementById('tReason').value;
  if(!ids.length){ alert('اختر طالبًا واحدًا على الأقل'); return; }
  if(reason === 'أخرى'){
    const otherVal = document.getElementById('tOther').value.trim();
    if(!otherVal){ alert('اكتب سبب التحويل في خانة "أخرى"'); return; }
    reason = otherVal;
  }
  if(reason === 'تحرير'){
    const freeVal = document.getElementById('tReasonComment').value.trim();
    if(!freeVal){ alert('اكتب سبب التحويل في خانة التحرير'); return; }
    reason = freeVal;
  }

  const ded = transferDeductionMap[reason] != null ? transferDeductionMap[reason] : -3;
  if(ded !== 0){
    tr.deductedPoints = ded;
    ids.forEach(sid => {
      const stRec = (d.students || []).find(s => s && s.id === sid);
      const me = currentUser();
      d.notes.push({ id:uid(), studentId:sid, studentNo: stRec && stRec.studentNo != null ? String(stRec.studentNo) : '', studentName: stRec ? (stRec.fullName || stRec.name || '') : '', type:'NEGATIVE', category: reason, description: 'تحويل إلى ' + targetLabel(target) + ' (خصم تلقائي)', points: ded, createdBy: currentUser().id, createdByName: me ? me.name : '', createdByRole: me ? me.role : '', createdAt: new Date().toISOString(), transferId: tr.id, batchId: tr.id });
    });
  }
  saveDB(d);
  notifyTransferReceivers(d, tr);
  NRC_notifyTransferServer(tr, ids.map(sid => { const s = studentById(sid); return s ? s.fullName : 'طالب/طالب'; }).join('، '));
  renderApp();
}
/* إشعار التحويل عبر الخادم: المستلِم يُقرأ من جدول الحسابات لا من ذاكرة الجهاز.
   نسخة المدير غير موجودة في قائمة المستخدمين على الجهاز (حساب التهيئة يعيش
   في جدول الحسابات ولا يُنسخ إلى بيانات المدرسة)، فكانت التصفية المحلية لا
   تطابق أحداً ولم يُكتب إشعار واحد. الخادم هو المرجع لوجود الحسابات، وتبقى
   النسخة المحلية أعلاه وسيلة عمل عند انقطاع الشبكة أو في الوضع التجريبي. */
async function NRC_notifyTransferServer(tr, studentName){
  if(!__serverEnabled() || !tr) return;
  try{
    const r = await __api('POST', '/api/transfer/notify', {
      school: getActiveSchool(), transferId: String(tr.id), target: tr.target,
      targetLabel: targetLabel(tr.target), reason: tr.reason, studentName: studentName || ''
    });
    if(r.status === 200 && r.j && r.j.ok) return;
    if(r.status === 409 && r.j && r.j.error === 'no_receivers')
      console.warn('[transfer-notify] لا يوجد حساب نشط للدور', tr.target);
  }catch(e){ /* الشبكة قد تكون مقطوعة: النسخة المحلية أعلاه ما زالت قائمة */ }
}
function notifyTransferReceivers(d, tr){

    if(arr.some(m => m.transferId === tr.id && m.teacherId === r.id)) return;

    });

/* من يرى التحويل؟ — كل شخص يرى تحويله فقط، والمدير يشاهد الجميع (قراءة فقط) */
/* هل يرى المدير إشعار التحويل؟ — يرى فقط ما وُجّه إليه فعليًا (إلى: المدير) أو تحويلًا أنشأه بنفسه */
function adminSeesTransferMsg(m){
  const me = currentUser();
  if(!me) return false;
  if(m.senderRole !== 'TRANSFER') return true;
  // الإشراف (المدير/الوكيل/الموجه) يرى كل إشعارات التحويل — القاعدة نفسها
  // التي اعتمدها transfers-privacy.js. كان الشرط القديم يقصرها على
  // «المستهدفة أو من أنشأتها»، فكانت إشعارات التحويل إلى الوكيل/الموجه
  // مخفية عن المدير، كما كان اختفاء التحويل من قاعدة البيانات يُخفي الإشعار
  // كله. الإشعار سجلٌّ يبقى معروضاً ويُغلق بزر «تم الاطلاع».
  return me.role === 'ADMIN' || me.role === 'AGENT' || me.role === 'COUNSELOR';
}
/* من يرى التحويل؟ — الإشراف (المدير/الوكيل/الموجه) يرى كل التحويلات،
   والمعلم ترى ما أرسلته هي فقط.
   القاعدة نفسها على الخادم (transfers-privacy.js)؛ وهذا خط ثانٍ بعده. */
function transferForMe(t){
  const u = currentUser();
  if(!u || !t) return false;
  if(u.role === 'ADMIN' || u.role === 'AGENT' || u.role === 'COUNSELOR') return true;
  const owner = t.createdBy == null ? '' : String(t.createdBy).trim();
  return !!owner && owner === String(u.id == null ? '' : u.id).trim();
}

// المعرّفات ثابتة عمداً: الخادم يدمج الأقسام بمفتاح id (server.js mergeSection)، فمعرّف
// عشوائي (uid) من جهازين ينتج صفّين بنفس الاسم بدل صف واحد. المعرّفات b_g1..b_g12 هي
// نفسها الموجودة في قواعد المدارس، فيتّفق الجهاز الجديد مع الصفوف القائمة بدل أن يfork منها.
const stages = [
  { id:'kg_g0', name:'التمهيدي', order:-1 },
  { id:'b_g1', name:'الأول الابتدائي', order:0 }, { id:'b_g2', name:'الثاني الابتدائي', order:1 }, { id:'b_g3', name:'الثالث الابتدائي', order:2 },
  { id:'b_g4', name:'الرابع الابتدائي', order:3 }, { id:'b_g5', name:'الخامس الابتدائي', order:4 }, { id:'b_g6', name:'السادس الابتدائي', order:5 },
  { id:'b_g7', name:'الأول المتوسط', order:6 }, { id:'b_g8', name:'الثاني المتوسط', order:7 }, { id:'b_g9', name:'الثالث المتوسط', order:8 },
  { id:'b_g10', name:'الأول الثانوي', order:9 }, { id:'b_g11', name:'الثاني الثانوي', order:10 }, { id:'b_g12', name:'الثالث الثانوي', order:11 },
];
function __stage(name){
  return stages.find(x => x.name === name) || null;
}
function __stageOrder(name, fallback){
  const s = __stage(name);
  return s ? s.order : fallback;
}
function __stageId(name){
  const s = __stage(name);
  return s ? s.id : uid();
}
// معرّف فصل «أ» مشتق من معرّف الصف: جهازان ينشآنه لصفٍ ناقص فيتّفقان على id واحد
// فيدمجهما الخادم في سجل واحد بدل فصلين فارغين.
function __stageClassId(gradeId){
  return gradeId + '_a';
}
function renderClasses(){
  const d = loadDB();
  const user = currentUser();
  const isAdmin = user?.role === 'ADMIN';
  const canManage = isManager(user);
  const canAssign = canManageTeachers(user);
  // إصلاح تلقائي: إكمال الصفوف الناقصة (المتوسط والثانوي) عند الحاجة
  let addedMsg = '';
  if(canManage){
    const campus = getActiveSchool();
    let added = 0;
    const addedNames = [];
    stages.forEach(stage => {
      let grade = d.grades.find(g => g.name === stage.name);
      if(!grade){ grade = { id:stage.id, name:stage.name, order:stage.order }; d.grades.push(grade); }
      const __clsId = __stageClassId(grade.id);
      // فصل محذوف عمداً يحمل id موجوداً أو مُحجوباً في _blockedClasses لا يُعاد إنتاجه:
      // الخادم يرفض أي إحياء بنفس المعرّف (mergeClasses يتجاهل ما في tomb) فتدور الحلقة
      // بلا نهاية، وكل دورة تُسقط teacherIds التي أُضيفت بينها. الشرط مكتوب هنا بلا متغيّر
      // خارجي حتى يبقى آلياً (extractAutoRepairBlock في الاختبارات ينفّذه في سياق معزول).
      const hasRecord = d.classes.some(c => c.id === __clsId);
      const isBlocked = (Array.isArray(d._blockedClasses) ? d._blockedClasses : []).includes(__clsId);
      if(!d.classes.some(c => c.gradeId===grade.id && c.name==='أ' && !c.deleted) && !hasRecord && !isBlocked){
        d.classes.push({ id:__stageClassId(grade.id), gradeId:grade.id, name:'أ', campus, capacity:null, teacherIds:[] });
        added++;
        addedNames.push(stage.name);
      }
    });
    if(added > 0){ saveDB(d); addedMsg = `<div class="card mb" style="color:#16a34a;font-weight:600">تمت إضافة ${added} صف ناقص (${addedNames.join('، ')}) بنجاح</div>`; }

      </div>
      <div style="display:flex;flex-wrap:wrap;gap:4px">
        ${currentIds.map(id => {
          const t = userById(id);
          return t ? `<span style="display:inline-flex;align-items:center;gap:4px;background:#dbeafe;border:1px solid #93c5fd;padding:2px 8px;border-radius:999px;font-size:12px">${escapeHtml(t.name)}<a href="javascript:void(0)" onclick="removeTeacherFromClass('${classId}','${id}')" style="color:#b91c1c;font-weight:700;text-decoration:none" title="إزالة">✕</a></span>` : '';
        }).join('')}

  const ptsMapClass = studentPointsMap();
  const rows = classes.length === 0 ? `<tr><td colspan="7" style="text-align:center;padding:24px;color:#9ca3af">لا توجد فصول — جرّب زر "توليد الهيكل الافتراضي"</td></tr>` :
    classes.map(c => {
      const g = gradeById(c.gradeId);
      const students = d.students.filter(s => s.active && s.classId === c.id).sort((a,b)=>a.fullName.localeCompare(b.fullName,'ar'));
      const count = students.length;
      const teachersOf = (c.teacherIds||[]).map(id => userById(id)?.name).filter(Boolean);
      const studentsHtml = students.length === 0 ? '<span class="muted">لا يوجد طلاب</span>' :
        `<div style="display:flex;flex-wrap:wrap;gap:4px;max-height:120px;overflow-y:auto">${students.map(s => `<span style="background:#f3f4f6;padding:2px 8px;border-radius:4px;font-size:12px;white-space:nowrap">${studentNameLink(s, ptsMapClass[s.id] || 0)}</span>`).join('')}</div>`;
      return `<tr>
        <td style="font-weight:600">${g?escapeHtml(g.name):'—'}</td>
        <td>${escapeHtml(c.name)}${c.capacity?`<span class="muted small"> (سعة ${c.capacity})</span>`:''}</td>
        <td>${canAssign ? teacherAssign(c.id, c.teacherIds||[]) : `<span style="font-size:12px">${teachersOf.length ? teachersOf.map(n=>escapeHtml(n)).join('، ') : '—'}</span>`}</td>
        <td><a href="javascript:void(0)" onclick="toggleEl('classStudents-${c.id}')" style="font-weight:600;color:#2563eb">${count}</a></td>
        <td>${isAdmin ? `<button class="del-btn" onclick="deleteClass('${c.id}')">🗑 حذف</button>` : ''}</td>
      </tr>
      <tr id="classStudents-${c.id}" style="display:none"><td colspan="5" style="padding:8px 16px;background:#f9fafb">${studentsHtml}</td></tr>`;
    }).join('');

  return `
  <div class="header-row">

    <input id="cName" class="input" placeholder="اسم الفصل (مثال: أ)" value="أ" data-tip="اسم الفصل داخل المرحلة — مثال: أ، ب، ج" />
    <input id="cCapacity" type="number" class="input" placeholder="السعة (اختياري)" data-tip="الحد الأقصى لعدد الطلاب في الفصل (اختياري — يُترك فارغًا إذا لم تكن هناك سعة محددة)" />
    <button class="btn-primary" onclick="addClass()">حفظ</button>

    <tbody>${rows}</tbody></table>
  </div>`;
}
function addClass(){
  const gradeId = document.getElementById('cGradeId').value;
  const name = document.getElementById('cName').value.trim();
  const capacity = document.getElementById('cCapacity').value ? Number(document.getElementById('cCapacity').value) : null;
  if(!gradeId || !name){ alert('اختر الصف واكتب اسم الفصل'); return; }
  const d = loadDB();
  const campus = getActiveSchool();
  if(d.classes.some(c => c.gradeId===gradeId && c.name===name)){ alert('هذا الفصل موجود مسبقًا لنفس الصف'); return; }
  d.classes.push({ id:uid(), gradeId, name, campus, capacity, teacherIds:[] });
  saveDB(d);
  renderApp();
}
function deleteClass(id){
  const d = loadDB();
  const count = d.students.filter(s => s.active && s.classId === id).length;
  if(count > 0){ alert('لا يمكن حذف فصل يحتوي على طلاب — انقل الطلاب أولًا'); return; }
  if(!confirm('هل تريد حذف هذا الفصل؟')) return;
  d.classes = d.classes.filter(c => c.id !== id);
  saveDB(d);
  renderApp();
}
function addTeacherToClass(classId){
  if(!canManageTeachers(currentUser())) return;
  const sel = document.getElementById('tSel-'+classId);
  const teacherId = sel ? sel.value : '';
  if(!teacherId) return;
  const d = loadDB();
  const cls = d.classes.find(c => c.id === classId);
  if(!cls) return;
  if(!Array.isArray(cls.teacherIds)) cls.teacherIds = [];
  if(!cls.teacherIds.includes(teacherId)) cls.teacherIds.push(teacherId);
  if(Array.isArray(cls.removedTeacherIds)) cls.removedTeacherIds = cls.removedTeacherIds.filter(id => id !== teacherId);
  saveDB(d);
  renderApp();
}
function removeTeacherFromClass(classId, teacherId){
  if(!canManageTeachers(currentUser())) return;
  const d = loadDB();
  const cls = d.classes.find(c => c.id === classId);
  if(!cls) return;
  if(Array.isArray(cls.teacherIds)) cls.teacherIds = cls.teacherIds.filter(t => t !== teacherId);
  if(!Array.isArray(cls.removedTeacherIds)) cls.removedTeacherIds = [];
  if(!cls.removedTeacherIds.includes(teacherId)) cls.removedTeacherIds.push(teacherId);
  saveDB(d);
  renderApp();
}
function generateDefaultStructure(){
  if(!confirm(`سيتم إنشاء الهيكل الافتراضي: ${stages.length} صف (فصل واحد لكل صف). المتابعة؟`)) return;
  const d = loadDB();
  const campus = getActiveSchool();
  let createdCount = 0;
  stages.forEach(stage => {
    let grade = d.grades.find(g => g.name === stage.name);
    if(!grade){ grade = { id:stage.id, name:stage.name, order:stage.order }; d.grades.push(grade); }

    if(!d.classes.some(c => c.gradeId===grade.id && c.name==='أ')){
      d.classes.push({ id:__stageClassId(grade.id), gradeId:grade.id, name:'أ', campus, capacity:null, teacherIds:[] });
      createdCount++;
    }
  });
  saveDB(d);
  renderApp();
  setTimeout(() => {
    const el = document.getElementById('genMsg');
    if(el) el.innerHTML = `<div class="card mb">تم إنشاء ${createdCount} فصل جديد بنجاح</div>`;
  }, 0);
}

async function renameAdminUser(id){
  const cur = currentUser();
  if(!canManageTeachers(cur)){ alert('يسمح بهذا للمدير/الوكيل فقط'); return; }
  if(!id || !__serverEnabled()){ alert('الخادم غير مفعّل'); return; }
  const d = loadDB();
  const u = (d.users || []).find(x => x.id === id);
  if(!u){ alert('المستخدم غير موجود'); return; }
  const school = getActiveSchool();
  // الاسم المعروض
  const freshName = prompt('الاسم الحالي:\n' + (u.name || '') + '\n\nأدخل الاسم الصحيح ثم اضغط موافق (أو اتركه كما هو):', u.name || '');
  if(freshName == null) return;
  const cleanName = String(freshName).trim();
  if(!cleanName){ alert('لا يمكن أن يكون الاسم فارغاً'); return; }
  // اسم المستخدم: كان هذا الزر يعدّل الاسم فقط رغم عنوانه «تعديل اسم المستخدم»،
  // فلم يكن بالإمكان تصحيح خطأ إملائي في اسم الدخول (مثل bukhaith ← bukhait).
  const freshUser = prompt('اسم المستخدم الحالي: ' + (u.username || '—') + '\n\nأدخل اسم المستخدم الصحيح بحروف لاتينية صغيرة بلا مسافات (أو اتركه كما هو):', u.username || '');
  if(freshUser == null) return;
  const cleanUser = String(freshUser).trim().toLowerCase();
  const nameChanged = cleanName !== u.name;
  const userChanged = !!cleanUser && cleanUser !== String(u.username || '').trim().toLowerCase();
  if(cleanUser && !/^[a-z0-9._-]{3,32}$/.test(cleanUser)){
    alert('اسم المستخدم يجب أن يكون من 3 إلى 32 رمزاً، بحروف لاتينية صغيرة أو أرقام أو . _ - فقط، بلا مسافات');
    return;
  }
  if(userChanged){
    const taken = (d.users || []).some(x => x.id !== id && String(x.username || '').trim().toLowerCase() === cleanUser);
    if(taken){ alert('اسم المستخدم «' + cleanUser + '» محجوز لحساب آخر. اختر اسماً آخر.'); return; }
  }
  if(!nameChanged && !userChanged){ alert('لا تغيير'); return; }
  const what = [];
  if(nameChanged) what.push('الاسم: ' + u.name + ' ← ' + cleanName);
  if(userChanged) what.push('اسم المستخدم: ' + u.username + ' ← ' + cleanUser);
  if(!confirm('تعديل الحساب؟\n' + what.join('\n') + '\n\nسيظهر التعديل لكل الأجهزة، ويحتاج المستخدم إلى الاسم الجديد عند الدخول.')) return;
  try{
    const resp = await fetch(SYNC_API + school);
    if(resp.status === 401){ __handleAuthError(resp); return; }
    if(!resp.ok){ alert('تعذر جلب بيانات الخادم'); return; }
    const j = await resp.json();
    if(!j || !j.data){ alert('بيانات الخادم غير متاحة'); return; }
    const data = JSON.parse(JSON.stringify(j.data));
    const target = (data.users || []).find(x => x.id === id);
    if(!target){ alert('المستخدم غير موجود في نسخة الخادم'); return; }
    target.name = cleanName;
    if(userChanged) target.username = cleanUser;
    const put = await fetch(SYNC_API + school, { method:'PUT', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ ts: Date.now(), data }) });
    if(put.status === 401){ __handleAuthError({ status: 401 }); return; }
    if(!put.ok){
      let msg = 'فشل الحفظ';
      try{
        const e = await put.json();
        if(e && e.error === 'username_taken') msg = 'اسم المستخدم «' + (e.username || '') + '» محجوز لحساب آخر — لم يُحفظ أي تعديل';
        else msg += ': ' + (e && e.error || '') + (e && e.reason ? ' (' + e.reason + ')' : '');
      }catch(_){}
      alert(msg); return;
    }
    // حدّث النسخة المحلية كي لا تحمل أي مزامنة لاحقة القيم القديمة
    try{
      const k = 'nibras_' + school + '_db_v1';
      const raw = localStorage.getItem(k);
      if(raw){
        const lobj = JSON.parse(raw);
        const lu = (lobj.users || []).find(x => x.id === id);
        if(lu){
          lu.name = cleanName;
          if(userChanged) lu.username = cleanUser;
        }
        localStorage.setItem(k, JSON.stringify(lobj));
      }
    }catch(_){}
    try{ __pushState(school).lastOkTs = 0; }catch(_){}
    __uiToast(userChanged ? 'تم تعديل الاسم واسم المستخدم بنجاح' : 'تم تعديل الاسم بنجاح');
    renderApp();
  }catch(e){ alert('خطأ: ' + (e && e.message || e)); }
}

function makeLocalUsername(base){  let candidate = String(base||'').toLowerCase().replace(/[^a-z0-9._-]/g,'').replace(/^[._-]+|[._-]+$/g,'') || 'user';
  let i = 1;
  const used = new Set();
  ['BOYS'].forEach(s => { try{ (loadDBFor(s).users||[]).forEach(u => { if(u.username) used.add(String(u.username).toLowerCase()); }); }catch(e){} });
  while(used.has(candidate)){ i++; candidate = String(base||'').toLowerCase().replace(/[^a-z0-9._-]/g,'').replace(/^[._-]+|[._-]+$/g,'') + i; }
  return candidate;
}

      } else if(stillPending){
        window.__teacherMsg = `طُبّق التفعيل على الخادم لكن هذه الشاشة ما زالت تُظهرها غير مفعّلة — أعد التحميل (Ctrl+Shift+R) مرتين ثم تحقق من حالتها.`;
      } else {
        window.__teacherMsg = `تم اعتبار المعلم "${escapeHtml(u.name)}" مُفعّلة — وأصبحت مفعّلة بالكامل.`;

// تفعيل جماعي: قائمة المعلمين الظاهرة في الواجهة هي الأساس — تُحلّ كل معلم بحساب دخلها
// وتُحذف بقية حالات ما قبل التفعيل، وتُعطَّل حسابات المعلمين المحذوفة التي لم تعد تظهر.
async function activateAllTeachersApi(){
  if(!confirm('تطبيق «مفعّلة» على كل المعلمين الظاهرة (وفق قائمة الواجهة)، وتعطيل أي حساب معلم حذفتَها ولم تعد تظهر؟')) return;
  if(!__serverEnabled()){
    const d = loadDB();
    let n = 0;
    (d.users || []).forEach(u => { if(u && u.role === 'TEACHER' && u.active !== false && u.firstLogin){ u.firstLogin = false; u.granted = true; n++; } });
    saveDB(d);
    window.__teacherMsg = `فُعّلت ${n} معلم في هذه النسخة المحلية.`;
    renderApp();
    return;
  }
  const r = await __api('POST', 'admin/activate-all-from-list', { school: getActiveSchool() });
  if(r.status === 200 && r.j && r.j.ok){
    await __refreshSchool(getActiveSchool());
    const j = r.j;
    // تطبيقٌ فوري على النسخة المحلية من تقرير الخادم (لا نعتمد على سحبٍ قد يفشل بصمت):
    // كل معلم رُبط حسابُها تصبح «مفعّلة» هنا والآن أمام عين المدير.
    const d = loadDB();
    let flipped = 0;
    if(Array.isArray(j.report)){
      const names = new Set();
      j.report.forEach(x => { if(x && x.accountLinked) names.add(String(x.username || '').trim().toLowerCase() + '|' + String(x.email || '').trim().toLowerCase()); });
      (d.users || []).forEach(u => {
        if(!u || u.role !== 'TEACHER' || u.firstLogin !== true) return;
        const k = String(u.username || '').trim().toLowerCase() + '|' + String(u.email || '').trim().toLowerCase();
        if(names.has(k)){ u.firstLogin = false; u.granted = true; flipped++; }
      });
      if(flipped > 0){ try{ __origSetItem(dbKey(), JSON.stringify(d)); }catch(e){} }
    }
    let m = `سُجّلت الحالة «مفعّلة» لـ ${j.listUpdated ?? 0} معلم في قائمة القسم، ورُبط ${j.accountsCleared ?? 0} حسابِ دخولٍ فأصبح مفعّلاً، وعُطّل ${j.staleDeactivated ?? 0} حسابَ معلمٍ محذوفةٍ لا تظهر في القائمة.`;
    if(flipped > 0) m += ` ظهر «مفعّلة» الآن مباشرة لـ ${flipped} معلم على هذه الشاشة.`;
    if((j.unlinked || 0) > 0) m += ` ملاحظة: ${j.unlinked} معلم بلا حساب دخول مرتبط في جدول الحسابات — اضبط بياناتها من «🔑 بيانات الدخول».`;
    if((j.stillPendingAccounts || 0) > 0) m += ` تحذير: ${j.stillPendingAccounts} حساباً ما تزال غير مفعّلة في جدول الحسابات بعد التنفيذ — اضغط الزر مرة أخرى أو راجع لوحة التفعيل.`;
    window.__teacherMsg = m;
  } else {
    const errEl = document.getElementById('userErr');
    if(errEl) errEl.innerHTML = '<div class="card mb" style="color:#dc2626">تعذر التفعيل الجماعي — أعد المحاولة</div>';
  }

/* ============ الأسبوع الدراسي: بداية قابلة للضبط، يبدأ من 1، وكل أسبوع (يوم الاثنين) يزداد الرقم: 1 ← 2 ← 3 ...
   عند أول استخدام يُحفظ "أول إثنين من الأسبوع الحالي" كبداية فيكون العرض الحالي = 1 والاثنين القادم = 2.
   يمكن للمدير إعادة ضبط البداية (زر) أو ضبطها بتاريخ محدّد. ============ */
function academicStartKey(){ return 'nibras_academic_start_' + (getActiveSchool() || ''); }

// عند عدم توفر الخادم تُستخدم القيمة المحلية كنقطة ارتكاز.
function getAcademicStart(){
  const school = getActiveSchool();
  if(__serverEnabled()){
    const s = (__schoolSettingsCache[school] || {}).academicStart;
    if(s){
      const d = new Date(String(s).slice(0,10) + 'T00:00:00');
      if(!isNaN(d.getTime())) return d;
    }
  }
  try{
    const s = localStorage.getItem(academicStartKey());
    if(s){
      const d = new Date(String(s).slice(0,10) + 'T00:00:00');
      if(!isNaN(d.getTime())) return d;
    }
  }catch(e){}

function setAcademicStart(isoOrNull){
  const school = getActiveSchool();
  try{
    if(isoOrNull) localStorage.setItem(academicStartKey(), String(isoOrNull).slice(0,10));
    else localStorage.removeItem(academicStartKey());
  }catch(e){}
  if(__serverEnabled()){

      .then(() => __getSchoolSettings(school))
      .then(cur => __putSchoolSettings(school, Object.assign({}, cur, { academicStart: isoOrNull ? String(isoOrNull).slice(0,10) : null })))
      .catch(() => {});

function thisMonday(now){
  const m = new Date(now);
  m.setDate(m.getDate() - ((now.getDay()+6)%7)); // 0 = الاثنين
  return m;
}
function schoolWeekInfo(){
  const now = new Date();
  let start = getAcademicStart();
  if(!start){
    start = thisMonday(now);
    setAcademicStart(localDateKey(start));
  }
  const mon = thisMonday(now);
  const diff = Math.floor((mon.getTime() - start.getTime()) / (7*24*3600*1000));
  const weeks = diff + 1;
  if(weeks < 1) return { label:'الأسبوع التمهيدي', kind:'break' };
  return { label:'الأسبوع ' + weeks, kind:'week' };
}
function nudgeAcademicStart(weekDelta){
  let start = getAcademicStart();
  const now = new Date();
  if(!start || isNaN(start.getTime())) start = thisMonday(now);
  const shifted = new Date(start);
  shifted.setDate(shifted.getDate() - weekDelta * 7);
  setAcademicStart(localDateKey(shifted));
  renderApp();
}

}
function schoolDaysInRange(from, to){
  if(!from || !to) return 0;
  let count = 0;
  const d = new Date(from + 'T00:00:00');
  const end = new Date(to + 'T00:00:00');
  if(isNaN(d) || isNaN(end) || d > end) return 0;
  while(d <= end){ if(isSchoolDay(localDateKey(d))) count++; d.setDate(d.getDate()+1); }
  return count;
}
/* سجل حضور المعلم يعيش على سجلها في قاعدة البيانات، لا على كائن الجلسة.
 * الخادم يُبقي حقول absences/markedLate/lateMinutes على جدول الحسابات
 * ويحذفها من حمولة الجلسة، و دالة currentUser() تعيد كائن الجلسة حين
 * يكون الخادم مفعّلاً — وهو الوضع في الإنتاج. فكان نداء الإحصاء يقرأ
 * حقولاً غير موجودة، فتظهر أيام الغياب والتأخر والدقائق كلها أصفاراً
 * لمعلم عندها تأخير موثّق في السجلات.
 * نقرأ من d.users دائماً، ونتراجع إلى كائن الجلسة عند غيابه. */
function teacherSelfRecord(d, user){
  if(user && d && Array.isArray(d.users)){
    const rec = d.users.find(u => u && u.id === user.id);
    if(rec) return rec;
  }
  return user || {};
}
function teacherStats(u){
  const now = new Date();
  const year = now.getFullYear(), month = now.getMonth();
  // السنة الدراسية: سبتمبر → يونيو
  const yearStart = month >= 8 ? new Date(year, 8, 1) : new Date(year-1, 8, 1);
  const yearEnd = month >= 8 ? new Date(year+1, 5, 30) : new Date(year, 5, 30);
  const startKey = localDateKey(yearStart);
  const todayKey = localDateKey(now);
  const absDates = (u.absences || []).filter(x => x >= startKey && x <= todayKey);
  const absent = absDates.length;
  const lateDaysSet = new Set(); let lateMin = 0, firstLoginToday = null;
  // أيام التأخر المسجلة يدويًا من المدير/الوكيل
  (u.markedLate || []).forEach(x => {
    if(x >= startKey && x <= todayKey) lateDaysSet.add(x);
  });
  // دقائق التأخر المدخلة يدويًا من شاشة الحضور
  Object.entries(u.lateMinutes || {}).forEach(([date, mins]) => {
    if(date >= startKey && date <= todayKey){ lateDaysSet.add(date); if(mins) lateMin += Number(mins); }
  });
  // أول دخول اليوم
  const logins = (u.loginHistory || []).map(iso => new Date(iso));
  logins.forEach(d => {
    if(localDateKey(d) === localDateKey(now) && !firstLoginToday) firstLoginToday = d;
  });
  return {
    loginCount: u.loginCount||0,
    lastLogin: u.lastLogin,
    firstLoginToday,
    absent, lateDays: lateDaysSet.size, lateMin,
    absDates,
  };
}

  const startKey = localDateKey(yearStart);

  if(type === 'LOGINS'){
    title = 'سجل الدخول';

    title = 'تفاصيل التأخر (هذا العام الدراسي)';

    (u.markedLate || []).filter(inYear).forEach(x => { if(!(x in map)) map[x] = null; });
    Object.entries(u.lateMinutes || {}).filter(([date]) => inYear(date)).forEach(([date, mins]) => { map[date] = Number(mins) || null; });
    const list = Object.keys(map).sort();

  }

function toggleTeacherAbsToday(teacherId, checked){
  const today = localDateKey(new Date());
  const d = loadDB();
  const u = d.users.find(x => x.id === teacherId);
  if(!u) return;
  u.absences = u.absences || [];
  const beforeCount = u.absences.length;
  if(checked && !u.absences.includes(today)) u.absences.push(today);
  if(!checked) u.absences = u.absences.filter(x => x !== today);
  if(u.absences.length !== beforeCount) __attTouch(u);
  saveDB(d);
  renderApp();
}
function addTeacherAbsence(teacherId){
  const date = document.getElementById('teacherAbsDate')?.value;
  if(!date){ alert('اختر التاريخ أولاً'); return; }
  const d = loadDB();
  const u = d.users.find(x => x.id === teacherId);

  u.absences = u.absences || [];

}

}

/* ============ التكليفات ============ */
function getTeacherSubjects(user, d){
  const tt = (d.timetable || {})[user.id] || {};
  const map = {};
  Object.values(tt).forEach(day => {
    Object.values(day).forEach(cell => {
      if(cell && cell.subject && cell.classId){
        const cls = d.classes.find(c => c.id === cell.classId);
        if(cls){
          const key = cell.classId + '|' + cell.subject;
          if(!map[key]) map[key] = { classId: cell.classId, subject: cell.subject, className: cls.name, gradeId: cls.gradeId };
        }
      }
    });
  });
  return Object.values(map);
}
// فصول المعلم في التكليفات: المسندة إليها (teacherIds) + فصول فيها تكليفاتها حتى لو لم تكن
// مسندة رسميًا + فصول جدولها. التكليف يخص الفصل: فأي تكليف في هذه الفصول يظهر لها ولتقريرها
// (سابقًا كان يظهر في التقارير ولا يظهر في خانة التكليفات عند اختلاف حساب المنشئ عن المعلم).
function getAssignmentClassIds(user, d){
  const taughtClassIds = (d.classes||[]).filter(c => Array.isArray(c.teacherIds) && c.teacherIds.includes(user.id)).map(c => c.id);
  const myAssignClassIds = (d.assignments||[]).filter(a => a.teacherId === user.id && !(a && a.deleted)).map(a => a.classId).filter(Boolean);
  const subClassIds = getTeacherSubjects(user, d).map(s => s.classId);
  return [...new Set([...taughtClassIds, ...myAssignClassIds, ...subClassIds])];
}

function toggleStudentDone(aid, sid, isDone){
  const d = loadDB();
  const a = (d.assignments||[]).find(x => x.id === aid);
  if(!a) return;
  if(!a.completedBy) a.completedBy = [];
  const idx = a.completedBy.indexOf(sid);
  if(isDone && idx < 0) a.completedBy.push(sid);
  if(!isDone && idx >= 0) a.completedBy.splice(idx, 1);
  saveDB(d);
  renderApp();
}
function deleteAssignment(aid){
  const user = currentUser();
  if(!user) return;
  const d = loadDB();
  const a = (d.assignments||[]).find(x => x.id === aid);
  if(!a) return;
  // صلاحية: المعلم هو من أنشأ التكليف (أو مدير/وكيل)
  if(user.role !== 'ADMIN' && user.role !== 'AGENT' && a.teacherId !== user.id){
    alert('لا يمكنك حذف هذا التكليف — أنشأه معلم آخر');
    return;
  }
  if(!confirm('هل تريد حذف التكليف «' + (a.title||'') + '» نهائياً؟')){
    return;
  }
  // أسفين حذف (deleted) بدل الحذف الفعلي: يتنشر عبر دمج الخادم دون أن يُعاد إحياؤه
  a.deleted = true;
  a.deletedAt = Date.now();
  a._v = (typeof a._v === 'number' ? a._v : 0) + 1;
  saveDB(d);
  const params = new URLSearchParams((location.hash.split('?')[1]||''));
  const step = params.get('step') || 'list';
  const classId = params.get('cid') || '';
  if(step === 'detail') location.hash = '#/assignments?step=list&cid=' + classId;
  renderApp();
  alert('🗑 تم حذف التكليف');
}

function saveAssignment(){
  const user = currentUser();
  if(!user) return;
  const d = loadDB();
  const params = new URLSearchParams((location.hash.split('?')[1]||''));
  const title = (document.getElementById('assTitle')||{}).value||'';
  const desc = (document.getElementById('assDesc')||{}).value||'';
  const date = (document.getElementById('assDate')||{}).value||'';
  const subject = decodeURIComponent(params.get('sub')||'');
  const classId = params.get('cid')||'';
  const type = decodeURIComponent(params.get('type')||'واجب');
  if(!title){ alert('اكتب عنوان التكليف'); return; }
  d.assignments = d.assignments || [];
  const clsStudents = (d.students||[]).filter(s => s.active && s.classId === classId).map(s => s.id);
  d.assignments.push({ id: uid(), teacherId: user.id, classId, subject, type, title, desc, date, created: Date.now(), _v: 1, completedBy: clsStudents.slice() });
  saveDB(d);
  alert('✅ تم حفظ التكليف');
  location.hash = '#/assignments?step=type&cid=' + classId + '&sub=' + encodeURIComponent(subject);
}

function actTypeChanged(){
  const sel = document.getElementById('actType');
  const val = sel.value;
  const nameInput = document.getElementById('actName');
  const hint = document.getElementById('actOtherHint');
  if(hint) hint.style.display = (val === 'OTHER' || val.startsWith('OTHER::')) ? '' : 'none';
  if(val.startsWith('OTHER::')){
    const n = val.slice('OTHER::'.length);
    sel.value = 'OTHER';
    if(nameInput){ nameInput.value = n; }
    const dt = document.getElementById('actDate');
    if(dt) dt.focus();
    return;
  }
  if(val === 'OTHER'){
    if(nameInput) nameInput.focus();
    return;
  }
  const t = activityTypes.find(x => x.value === val);
  if(t && nameInput) nameInput.value = t.label;
}

function saveActivity(){
  const type = document.getElementById('actType').value;
  const name = document.getElementById('actName').value.trim();
  const date = document.getElementById('actDate').value;

  if(!date){ alert('اختر التاريخ'); return; }

function maintAction(id, action){
  const d = loadDB();
  const r = (d.maintenance = d.maintenance || []).find(x => x.id === id);
  if(!r) return;
  const user = currentUser();
  if(action === 'forward'){ if(!maintCanFollow(user)) return; r.status = 'بانتظار اعتماد الوكيل'; r.forwardedAt = todayStr(); r.forwardedBy = user.id; }
  else if(action === 'approve'){ if(!maintCanDecide(user)) return; r.status = 'معتمد'; r.approvedAt = todayStr(); r.approvedBy = user.id; r.rejectReason = undefined; }
  else if(action === 'reject'){ if(!maintCanDecide(user)) return; const why = prompt('سبب الرفض:'); if(why === null) return; r.status = 'مرفوض'; r.rejectReason = String(why).trim(); r.rejectedAt = todayStr(); r.rejectedBy = user.id; }
  else if(action === 'start'){ if(!maintCanFollow(user)) return; r.status = 'قيد التنفيذ'; r.startedAt = todayStr(); }
  else if(action === 'complete'){ if(!maintCanFollow(user)) return; const raw = prompt('تكلفة الصيانة (بالروبية):', '0'); if(raw === null) return; r.cost = Math.max(0, Number(String(raw).replace(/,/g, '')) || 0); r.status = 'مكتمل'; r.completedAt = todayStr(); }
  else return;
  // نُحدّث updatedAt عند كل انتقال حالة: هو ما يتيح للدمج (عند تعارض النسخ) معرفة
  // أن هذه النسخة هي الأحدث، فلماذا كانت الحالة "تعود" إلى ما قبل الإجراء.
  r.updatedAt = new Date().toISOString();
  // نرفع التغيير للخادم فورًا: الحفظ في التخزين المحلي وحده يُمحى عند أول سحب دوري

  d._ts = Date.now();

  renderApp();
}

function viewMaintReport(id){
  const r = maintById(id);

  const by = userById(r.createdBy);

  const tlSteps = MAINT_STATUS_ORDER.map((s, i) => {
    const idx = MAINT_STATUS_ORDER.indexOf(r.status);
    const done = i <= idx;
    const isRejected = r.status === 'مرفوض';
    return `<span style="font-size:12px;font-weight:${done ? '800' : '400'};color:${isRejected && i === 0 ? '#dc2626' : (done ? '#047857' : '#94a3b8')}">${done ? '✔ ' : ''}${s}</span>`;
  }).join(' <span style="color:#cbd5e1">←</span> ');
  const actions = maintActionsFor(r, currentUser());
  const rows = [
    dlRow('الرقم', r.id),
    dlRow('التاريخ', r.date || ''),
    dlRow('الموقع', r.location || ''),
    dlRow('نوع الطلب', r.type + (r.device ? ' — ' + r.device : '') + (r.inkType ? ' — حبر ' + r.inkType : '')),
    dlRow('التصنيف', r.category || ''),
    dlRow('الأولوية', r.priority || ''),
    dlRow('الحالة', r.status + (r.cost ? ' — التكلفة ' + maintCost(r) + ' روبية' : '')),
    dlRow('بواسطة', by ? by.name : '—'),
    dlRow('الوصف', r.description || '')
  ].join('');
  openDetails('تفاصيل البلاغ ' + r.id,
    rows + reject + img + (r.rejectReason || r.image ? '' : '') +
    `<li class="dl-item"><div style="font-size:12px;color:#64748b;font-weight:700;margin-bottom:6px">مسار البلاغ</div><div>${tlSteps}</div></li>` +
    (actions ? `<li class="dl-item"><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">${actions}</div></li>` : '')
  );

function maintUpdateFloors(){
  const area = document.getElementById('maintArea').value;
  const floor = document.getElementById('maintFloor');
  floor.innerHTML = '<option value="">اختر الدور</option>';

  Object.keys(MAINT_LOCATIONS[area]).forEach(item => { const o = document.createElement('option'); o.value = item; o.textContent = item; floor.appendChild(o); });
  document.getElementById('maintLoc').innerHTML = '<option value="">اختر الدور أولاً</option>';
}
function maintUpdateLocations(){

function saveMaintReport(){
  const err = document.getElementById('maintFormError');
  const showErr = m => { err.textContent = m; err.style.display = 'block'; };
  const area = document.getElementById('maintArea').value;
  const floor = document.getElementById('maintFloor').value;
  const loc = document.getElementById('maintLoc').value;
  const details = document.getElementById('maintLocDetails').value.trim();
  const type = document.getElementById('maintType').value;
  const category = document.getElementById('maintCategory').value;
  const priority = document.getElementById('maintPriority').value;
  const device = document.getElementById('maintDevice').value;
  const inkType = document.getElementById('maintInk').value;
  const description = document.getElementById('maintDesc').value.trim();
  if(!area || !floor || !loc){ showErr('يجب تحديد الموقع كاملًا (المنطقة والدور والموقع).'); return; }
  if(!type){ showErr('يجب اختيار نوع الطلب.'); return; }
  if(!category){ showErr('يجب اختيار التصنيف.'); return; }
  if(!description){ showErr('يجب كتابة وصف المشكلة أو الطلب.'); return; }
  if((type === 'تغيير حبر' || type === 'تغيير قطعة') && !device){ showErr('يجب اختيار الجهاز لهذا النوع من الطلبات.'); return; }

  const parts = [area, floor, loc]; if(details) parts.push(details);
  const d = loadDB();
  const user = currentUser();
  d.maintenance = d.maintenance || [];
  if(maintEditId){
    const r = d.maintenance.find(x => x.id === maintEditId);
    if(r){
      r.area = area; r.floor = floor; r.loc = loc; r.details = details;
      r.location = parts.join(' - ');
      r.type = type; r.category = category; r.priority = priority;
      r.device = device || undefined; r.inkType = (type === 'تغيير حبر') ? inkType : undefined;
      r.description = description;
      if(maintImageData) r.image = maintImageData;
      r.updatedAt = new Date().toISOString();
      if(r.status === 'مرفوض'){ r.status = 'جديد'; r.rejectReason = undefined; r.rejectedAt = undefined; r.rejectedBy = undefined; }
    }
  } else {
    d.maintenance.unshift({
      id: maintNextId(), date: todayStr(),
      area, floor, loc, details,
      location: parts.join(' - '),
      type, category, priority,
      device: device || undefined, inkType: (type === 'تغيير حبر') ? inkType : undefined,
      description,
      image: maintImageData || undefined,
      createdBy: user ? user.id : null, createdByName: user ? user.name : '',
      createdAt: new Date().toISOString(),
      status: 'جديد', cost: 0
    });
  }
  d._ts = Date.now();
  saveDB(d);
  __syncSchedule(getActiveSchool(), 0);
  closeMaintForm();
  renderApp();
}

        <div class="small muted" style="margin-bottom:8px">اختر نوع مشاركتك المطلوبة في هذا النشاط</div>

      </div>`;
    }
  }
  // قائمة طلبات المشاركة (الوكيل يدير، والمدير يطّلع)
  let reqSection = '';
  if(isMgr && reqs.length){
    const reqRows = reqs.map(r => {
      const statusHtml = r.status === 'PENDING'
        ? (isAgent ? `<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn-primary" style="padding:4px 12px;font-size:12px" onclick="approveRequest('${a.id}','${r.id}')">✓ اعتماد</button><button class="btn-secondary danger" style="padding:4px 12px;font-size:12px" onclick="rejectRequest('${a.id}','${r.id}')">✖ رفض</button></div>` : `<span class="muted small">قيد المراجعة (يتولى الوكيل الاعتماد)</span>`)
        : `<span style="font-size:12px;font-weight:700;color:${r.status==='APPROVED' ? '#16a34a' : '#dc2626'}">${r.status==='APPROVED' ? '✅ معتمد' : '❌ مرفوض'}</span>`;
      return `<div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
        <div style="flex:1;min-width:200px">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><b style="font-size:14px">${escapeHtml(r.teacherName || '—')}</b><span class="muted small">${fmtTime(r.createdAt)}</span></div>
          <div class="small" style="color:#374151;margin-top:4px">🎯 نوع المشاركة: <b>${escapeHtml(r.kind)}</b></div>
          ${r.note ? `<div class="small muted">📝 ${escapeHtml(r.note)}</div>` : ''}
          ${r.status === 'REJECTED' && r.reason ? `<div class="small" style="color:#b91c1c">📝 سبب الرفض: ${escapeHtml(r.reason)}</div>` : ''}
        </div>

    reqSection = `
    <h2 class="section-title">📥 طلبات المشاركة (${reqs.length})</h2>
    <div class="grid grid-2">${reqRows}</div>`;
  }
  return `
  <a class="link" href="#/activities">↩ عودة للأنشطة</a>
  <div class="header-row">
    <h1 class="page-title">${t.icon} ${escapeHtml(a.name)}</h1>
    <span class="muted small">${t.label} · ${fmtDateOnly(a.date)}</span>
  </div>
  ${a.description ? `<div class="card mb"><p style="line-height:1.8;color:#374151">${escapeHtml(a.description)}</p></div>` : ''}

  <h2 class="section-title">👥 المعلمون المشاركون (${parts.length})</h2>

  <p class="muted small" style="margin-top:12px">سيظهر تقرير بأسماء المشاركين في نهاية العام من صفحة التقارير ← "تقرير الأنشطة والمشاركين".</p>
  `;
}
function requestParticipation(id, kindOverride){
  const d = loadDB();
  const a = (d.activities || []).find(x => x.id === id);
  const me = currentUser();
  if(!a || !me) return;
  const kindEl = document.getElementById('partKind');
  const selVal = kindEl ? kindEl.value : '';
  // حماية إضافية: لو اختار المعلم "أخرى" لكن لم تُدمج التفاصيل لسبب ما، نفتح النافذة بدلاً من رسالة الخطأ
  if((!kindOverride || !kindOverride.trim()) && selVal === 'أخرى'){
    openOtherKindModal(id);
    return;
  }
  // النوع: إن وُرد صراحةً (نافذة "أخرى") يُستخدم مباشرة، وإلا من القائمة المنسدلة
  const kind = (kindOverride && kindOverride.trim()) ? kindOverride.trim() : selVal.trim();
  if(!kind){ alert('اكتب نوع المشاركة المطلوبة (مثال: عمل مسابقة، لوحة جدارية)'); return; }
  a.requests = a.requests || [];
  if(a.requests.some(r => r.teacherId === me.id && r.status === 'PENDING')){ alert('لديك طلب قيد المراجعة بالفعل'); return; }
  a.requests.push({ id: uid(), teacherId: me.id, teacherName: me.name, kind, note: '', status: 'PENDING', createdAt: new Date().toISOString() });
  a._v = (typeof a._v === 'number' ? a._v : 0) + 1;
  notifyPartRequestToAgent(d, a, a.requests[a.requests.length-1]);
  d._ts = Date.now();
  saveDB(d);
  __syncSchedule(getActiveSchool(), 0);
  renderApp();
  alert('تم إرسال طلب مشاركتك إلى الوكيل ✅');
}
function notifyPartRequestToAgent(d, a, req){
  const me = currentUser();
  const arr = loadAdminMsgs();
  (d.users || []).filter(u => u.active && u.role === 'AGENT').forEach(ag => {
    if(arr.some(m => m.senderRole === 'ACTIVITY' && m.partReqId === req.id)) return;
    arr.push({
      id: uid(), teacherId: ag.id, teacherName: ag.name,
      text: `🎨 طلب مشاركة في نشاط "${a.name}": ${req.teacherName} — نوع المشاركة: ${req.kind}`,
      createdAt: new Date().toISOString(), read:false, dismissed:false, views:0,
      senderRole: 'ACTIVITY', senderName: me?.name, senderId: me?.id,
      activityId: a.id, partReqId: req.id, partTeacherId: req.teacherId
    });
  });
  saveAdminMsgs(arr);
}
/* backfill: توليد رسائل طلبات المشاركة المفقودة (للطلبات القديمة المرسلة قبل نشر هذا التحديث)
   تعمل على أي مدرسة نشطة ولأي معلم، فتضمن وصول إشعار الوكيل لكل طلب جديد وقديم */
function backfillActivityMsgs(){
  const school = getActiveSchool();
  const d = loadDB();
  const arr = loadAdminMsgs();
  let changed = false;
  (d.activities || []).forEach(a => {
    (a.requests || []).forEach(req => {
      if(req.status !== 'PENDING') return;
      if(arr.some(m => m.senderRole === 'ACTIVITY' && m.partReqId === req.id)) return;
      (d.users || []).filter(u => u.active && u.role === 'AGENT').forEach(ag => {
        if(arr.some(m => m.senderRole === 'ACTIVITY' && m.partReqId === req.id)) return;
        arr.push({
          id: uid(), teacherId: ag.id, teacherName: ag.name,
          text: '🎨 طلب مشاركة في نشاط "' + String(a.name) + '": ' + req.teacherName + ' — نوع المشاركة: ' + req.kind,
          createdAt: new Date().toISOString(), read:false, dismissed:false, views:0,
          senderRole: 'ACTIVITY', senderName: req.teacherName, senderId: req.teacherId,
          activityId: a.id, partReqId: req.id, partTeacherId: req.teacherId
        });
        changed = true;
      });
    });
  });
  if(changed){
    saveAdminMsgs(arr);
    __syncSchedule(school, 0);
    renderApp();
  }
}
function approveRequest(id, reqId){
  const d = loadDB();
  const a = (d.activities || []).find(x => x.id === id);
  const r = (a?.requests || []).find(x => x.id === reqId);
  if(!a || !r) return;
  r.status = 'APPROVED';
  a.participants = a.participants || [];
  if(!a.participants.includes(r.teacherId)) a.participants.push(r.teacherId);
  a._v = (typeof a._v === 'number' ? a._v : 0) + 1;
  d._ts = Date.now();
  saveDB(d);
  __syncSchedule(getActiveSchool(), 0);
  renderApp();
}
let rejectTarget = null;
function rejectRequest(id, reqId){
  const d = loadDB();
  const a = (d.activities || []).find(x => x.id === id);
  const r = (a?.requests || []).find(x => x.id === reqId);
  if(!a || !r || r.status !== 'PENDING') return;
  rejectTarget = { id, reqId };
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal-box" style="max-width:420px">
    <div class="modal-head"><h3>✖ رفض طلب ${escapeHtml(r.teacherName || 'المعلم')}</h3><button class="modal-close" onclick="closeRejectModal()">✕</button></div>
    <div style="display:flex;flex-direction:column;gap:12px;padding:4px 0">
      <div><label style="display:block;font-weight:600;margin-bottom:6px">سبب الرفض (إلزامي)</label>
        <textarea id="rejReason" class="input" style="width:100%;min-height:80px;resize:vertical" maxlength="300" placeholder="اكتب سبب رفض طلب المشاركة — سيظهر للمعلم"></textarea></div>
      <div style="display:flex;gap:8px;margin-top:4px">
        <button class="btn-primary" style="background:#dc2626;border-color:#dc2626" onclick="confirmReject()">✖ تأكيد الرفض</button>
        <button class="btn-secondary" onclick="closeRejectModal()">إلغاء</button>
      </div>
    </div>
  </div>`;
  overlay.onclick = e => { if(e.target === overlay) closeRejectModal(); };
  document.body.appendChild(overlay);
}
function closeRejectModal(){
  const ov = document.querySelector('.modal-overlay');
  if(ov) ov.remove();
  rejectTarget = null;
}
/* ===== نافذة "أخرى": تفاصيل إضافية لطلب المشاركة ===== */
let otherKindActId = null;
function openOtherKindModal(actId){
  otherKindActId = actId;
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal-box" style="max-width:480px">
    <div class="modal-head"><h3>📝 تفاصيل المشاركة</h3><button class="modal-close" onclick="cancelOtherKind()">✕</button></div>
    <div style="display:flex;flex-direction:column;gap:14px;padding:4px 0">
      <div>
        <label style="display:block;font-weight:600;margin-bottom:6px">اكتب تفاصيل مشاركتك في هذا النشاط</label>
        <textarea id="otherKindText" class="input" style="width:100%;min-height:100px;resize:vertical" maxlength="500" placeholder="مثال: سأقوم بإعداد عرض تقديمي عن تأسيس المملكة..."
                  data-tip="اكتب تفاصيل نوع مشاركتك التي ستقدمها في هذا النشاط"></textarea>
      </div>
      <div style="display:flex;gap:8px;margin-top:4px">
        <button class="btn-primary" onclick="confirmOtherKind()">📨 إرسال الطلب</button>
        <button class="btn-secondary" onclick="cancelOtherKind()">إلغاء</button>
      </div>
    </div>
  </div>`;
  overlay.onclick = e => { if(e.target === overlay) cancelOtherKind(); };
  document.body.appendChild(overlay);
  setTimeout(()=>{ const t = document.getElementById('otherKindText'); if(t) t.focus(); }, 100);
}
function closeOtherKindModal(){
  const ov = document.querySelector('.modal-overlay');
  if(ov) ov.remove();
  otherKindActId = null;
}
function cancelOtherKind(){
  const kindEl = document.getElementById('partKind');
  if(kindEl) kindEl.value = '';
  closeOtherKindModal();
}
function confirmOtherKind(){
  const text = document.getElementById('otherKindText').value.trim();
  if(!text){ alert('اكتب تفاصيل المشاركة أولاً'); return; }
  const actId = otherKindActId;
  closeOtherKindModal();
  requestParticipation(actId, 'أخرى: ' + text);
}
function confirmReject(){
  if(!rejectTarget) return;
  const reason = document.getElementById('rejReason').value.trim();
  if(!reason){ alert('اكتب سبب الرفض أولاً'); return; }
  const d = loadDB();
  const a = (d.activities || []).find(x => x.id === rejectTarget.id);
  const r = (a?.requests || []).find(x => x.id === rejectTarget.reqId);
  if(!a || !r) return;
  r.status = 'REJECTED';
  r.reason = reason;
  a._v = (typeof a._v === 'number' ? a._v : 0) + 1;
  d._ts = Date.now();
  saveDB(d);
  __syncSchedule(getActiveSchool(), 0);
  closeRejectModal();
  renderApp();
}
function pendingPartRequests(){
  const d = loadDB();
  return (d.activities || []).reduce((s, a) => s + (a.requests || []).filter(r => r.status === 'PENDING').length, 0);
}
function addParticipant(id){
  const d = loadDB();
  const a = (d.activities || []).find(x => x.id === id);
  const pid = document.getElementById('partTeacher').value;
  if(!a || !pid) return;
  a.participants = a.participants || [];
  if(a.participants.includes(pid)) return;
  a.participants.push(pid);
  a._v = (typeof a._v === 'number' ? a._v : 0) + 1;
  d._ts = Date.now();
  saveDB(d);
  __syncSchedule(getActiveSchool(), 0);
  renderApp();
}
function removeParticipant(id, pid){
  const d = loadDB();
  const a = (d.activities || []).find(x => x.id === id);
  if(!a) return;
  if(!confirm('إزالة هذا المعلم من قائمة المشاركين؟')) return;
  a.participants = (a.participants || []).filter(x => x !== pid);
  a._v = (typeof a._v === 'number' ? a._v : 0) + 1;
  d._ts = Date.now();
  saveDB(d);
  __syncSchedule(getActiveSchool(), 0);
  renderApp();
}
// هل المعلم مشارك فعليًا في النشاط؟ (مضاف ضمن المشاركين، أو طلبه معتمد)
function isActivityParticipant(a, id){
  if(!a) return false;
  if((a.participants || []).includes(id)) return true;
  return (a.requests || []).some(r => r.teacherId === id && r.status === 'APPROVED');
}
// قائمة المشاركين الفعليين: من أُضيف مباشرة + من اعتُمد طلبهم
function activityPartIds(a){
  const ids = new Set(a.participants || []);
  (a.requests || []).forEach(r => { if(r.status === 'APPROVED') ids.add(r.teacherId); });
  return [...ids];
}

    ${reportState.type === 'points_detail' ? `<button class="btn-secondary" style="color:#b91c1c" onclick="__cleanupOrphanPointRows()" title="مسح سجلات النقاط المعزولة: بلا طالب أو بلا معلم (بنين محذوفة/بيانات قديمة) — تبقى كل طالب مسجلة كما هي">🧹 مسح المعزول</button>` : ''}
  </div>
  <div id="reportResults">${reportState.rows ? renderReportResult(reportState.rows) : ''}</div>
