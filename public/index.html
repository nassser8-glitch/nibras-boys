        <span style="width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#e0f2f1,#eef2ff);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0">${ico}</span>
        <div style="min-width:0">
          <div style="font-weight:900;font-size:20px;color:#0f172a;line-height:1.1">${num}</div>
          <div style="font-size:12.5px;font-weight:700;color:#374151">${label}</div>
          <div class="muted" style="font-size:11px">${meta}</div>
        </div>
      </div>
    </div>`;
  }

  // حالة اليوم: طارئة أم مستقرة؟ (الغياب والتأخير أقل من 10% ولا بلاغات صيانة طارئة)
  const sAbsRate = students.length ? absent/students.length*100 : 0;
  const sLateRate = students.length ? late/students.length*100 : 0;
  const tAbsRate = teachers.length ? absentTeachers.length/teachers.length*100 : 0;
  const tLateRate = teachers.length ? lateTeachers.length/teachers.length*100 : 0;
  const urgentMaint = (d.maintenance||[]).filter(m => m.status === 'جديد' && ['عاجل','طارئ'].includes(m.priority)).length;
  const stableDay = sAbsRate <= 10 && tAbsRate <= 10 && urgentMaint === 0;

  // رسالة ترحيبية + بطاقة حالة
  const firstName = String(user.name || '').split(' ')[0] || user.name;
  const greetH = new Date().getHours();
  const greetWord = greetH < 12 ? 'صباح الخير' : (greetH < 17 ? 'طاب يومك' : 'مساء الخير');

  const hero = `
  <div class="dash-hero">
    <div class="dash-greet">
      <div class="dash-greet-icon">👋</div>
      <div>
        <p class="dash-greet-title">${greetWord} ${escapeHtml(firstName)} 🌟</p>
        <p class="dash-greet-sub">بسم الله — نبدأ يومنا بالتوفيق والنجاح</p>
        ${schoolWeekHTML(user)}
      </div>
    </div>
    ${(user.role === 'ADMIN' || user.role === 'AGENT') ? `
    <div class="dash-status ${stableDay ? '' : 'warn'}">
      <div class="dash-status-icon">${stableDay ? '✅' : '📌'}</div>
      <div>
        <p class="dash-status-title" style="margin:0">${stableDay ? 'المدرسة مستقرة اليوم' : 'هناك أمور بانتظار متابعتك'}</p>
        <p class="dash-status-sub">${stableDay
          ? 'لا توجد صيانة طارئة والغياب ضمن الحدود'
          : (urgentMaint>0 ? urgentMaint + ' بلاغ صيانة طارئ' : '') + (sAbsRate > 10 ? (urgentMaint>0 ? ' · ' : '') + 'غياب الطلاب أكثر من 10%' : '') + (tAbsRate > 10 ? ((urgentMaint>0 || sAbsRate > 10) ? ' · ' : '') + 'غياب المعلمين أكثر من 10%' : '')}</p>
      </div>
    </div>` : ''}
  </div>`;

  // شريط الإحصائيات (6 بطاقات) — أُزيل: نسبة الحضور تُعرض بيانيًا في بطاقة الحضور

  // يحتاج إلى متابعتك
  // يحتاج إلى متابعتك — الأولوية: الصيانة الطارئة ← غياب المعلمين ← الطلاب (3 عناصر فقط)
  const needs = [];
  if(urgentMaint>0) needs.push({ icon:'🛠️', color:'#fef2f2', name:'صيانة طارئة', meta:urgentMaint + ' بلاغ بانتظار المعالجة', num:urgentMaint, click:"location.hash='#/maintenance'" });
  if(absentTeachers.length>0) needs.push({ icon:'🚫', color:'#fef2f2', name:'غياب المعلمين اليوم', meta:absentTeachers.map(t => firstNameOf(t.name)).join('، '), num:absentTeachers.length, click:'showTeacherAbsenceList()' });
  if(absent>0) needs.push({ icon:'❌', color:'#fef2f2', name:'غائبون اليوم', meta:'من الطلاب', num:absent, click:"showAttendanceList('ABSENT')" });
  if(needs.length < 3 && late>0) needs.push({ icon:'⏰', color:'#fffbeb', name:'متأخرون اليوم', meta:'من الطلاب', num:late, click:"showAttendanceList('LATE')" });
  if(needs.length < 3 && lateTeachers.length>0) needs.push({ icon:'⏰', color:'#fffbeb', name:'تأخر المعلمين اليوم', meta:'وصلوا بعد موعد الدوام', num:lateTeachers.length, click:'showTeacherLateList()' });
  if(needs.length < 3 && partPending>0) needs.push({ icon:'✋', color:'#eff6ff', name:'طلبات مشاركة في أنشطة', meta:'بانتظار الموافقة', num:partPending, click:"location.hash='#/activities'" });
  if(needs.length < 3 && pendingTransfers>0) needs.push({ icon:'📨', color:'#f5f3ff', name:'تحويلات معلّقة', meta:'طلبات بانتظار الاعتماد', num:pendingTransfers, click:'showPendingTransfers()' });
  const needsHTML = needs.length ? needs.slice(0,3).map(n => `
    <div class="dash-needs-item" onclick="${n.click}">
      <div class="dash-needs-ico" style="background:${n.color}">${n.icon}</div>
      <div class="dash-needs-txt">
        <div class="dash-needs-name">${n.name}</div>
        <div class="dash-needs-meta">${n.meta}</div>
      </div>
      <div class="dash-needs-num" style="color:#ef4444">${n.num}</div>
    </div>`).join('') : '<p class="muted small" style="margin:4px 0">كل الأمور تحت السيطرة — لا شيء ينتظر متابعتك الآن ✅</p>';

  // نبراس يرى — مؤشرات ذكية للمسؤولين (ADMIN/AGENT/COUNSELOR) فقط.
  //  1) طلاب غيابهم متكرر: 5 أيام غياب فأكثر، أو 5 أيام متتالية على مدى 30 يومًا.
  //  2) طلاب تحويلاتهم متكررة: أكثر من 3 تحويلات.
  //  3) معلمون تأخّروا متكررًا: أكثر من 5 مرات خلال الشهر.
  //  4) طلاب تأخّروا متكررًا: 5 مرات فأكثر خلال الشهر.
  // منطق الحساب معزول في __insight* ليستخدمه اللوحة ونوافذ التفاصيل بلا نسختين.
  const seesInsights = (user.role === 'ADMIN' || user.role === 'AGENT' || user.role === 'COUNSELOR');
  const insightsHTML = (() => {
    if(!seesInsights) return '';
    const repeatedAbs = __insightRepeatedAbsence();
    const frequentTransfers = __insightFrequentTransfers();
    const lateTeachers = __insightLateTeachers();
    const lateStudents = __insightLateStudents();
    const A = __insightAbsOpts, L = __insightLateOpts;
    const cls = (s) => (s && s.className) ? ' (' + s.className + ')' : '';
    // البطاقة: أيقونة بلون pastel (نفس علب «يحتاج إلى متابعتك») + الرقم بلون درجته
    // من متغيّرات الثيم، فلا يُستحدث لون خاص anywhere.
    const card = (o) => `
      <div class="nbr-card" onclick="${o.click}" role="button" tabindex="0"
           onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();${o.click}}">
        <div class="nbr-ico" style="background:${o.bg}">${o.icon}</div>
        <div class="nbr-body">
          <div class="nbr-name">${escapeHtml(o.name)}</div>
          <div class="nbr-meta">${escapeHtml(o.meta)}</div>
        </div>
        <div class="nbr-num" style="color:${o.fg}">${o.num}</div>
      </div>`;
    const items = [];
    if(repeatedAbs.length){
      const meta = repeatedAbs.slice(0,3).map(r => {
        const why = [];
        if(r.total >= A.daysThreshold) why.push(r.total + ' يوم غياب');
        if(r.run >= A.runThreshold) why.push(r.run + ' يوم متتالٍ');
        return `${r.name}${cls(r)} — ${why.join(' و')}`;
      }).join(' · ');
      items.push(card({ icon:'🔁', bg:'#fef2f2', fg:'var(--red,#ef4444)',
        name:'غياب متكرر', meta, num:repeatedAbs.length, click:'showRepeatedAbsenceStudents()' }));
    }
    const absentTeachers = __insightTeacherAbsence();
    if(absentTeachers.length){
      // لون الغياب نفسه كلون غياب الطلاب، والأيقونة والعنوان هما اللذان
      // يفرّقان بين المؤشّرين — لا لونٌ مستحدث لمشكلة من نوع واحد.
      const meta = absentTeachers.slice(0,3).map(t => `${t.name} — ${t.n} يوم غياب`).join(' · ');
      items.push(card({ icon:'⚠️', bg:'#fef2f2', fg:'var(--red,#ef4444)',
        name:'غياب المعلمين', meta, num:absentTeachers.length, click:'showTeacherAbsence()' }));
    }
    if(frequentTransfers.length){
      const meta = frequentTransfers.slice(0,3).map(t => `${t.name}${cls(t)} — ${t.n} تحويلات`).join(' · ');
      items.push(card({ icon:'🔄', bg:'#f5f3ff', fg:'var(--purple,#8b5cf6)',
        name:'تحويلات متكررة', meta, num:frequentTransfers.length, click:'showFrequentTransfers()' }));
    }
    if(lateTeachers.length){
      const meta = lateTeachers.slice(0,3).map(t => `${t.name} — ${t.n} مرة`).join(' · ');
      items.push(card({ icon:'⏰', bg:'#fffbeb', fg:'var(--orange,#f59e0b)',
        name:'تأخّر المعلمين', meta, num:lateTeachers.length, click:'showLateTeachers()' }));
    }
    if(lateStudents.length){
      const meta = lateStudents.slice(0,3).map(t => `${t.name}${cls(t)} — ${t.n} مرة`).join(' · ');
      // صندوق بنفسجي للتأخّر مثل صندوق المعلم: مشكلة من نوع واحد = لون واحد،
      // ويفرّق بينهما الأيقونة والعنوان لا لونًا مستحدثًا.
      items.push(card({ icon:'⌛', bg:'#fffbeb', fg:'var(--orange,#f59e0b)',
        name:'تأخّر الطلاب', meta, num:lateStudents.length, click:'showLateStudents()' }));
    }
    // شريط ملخّص: كم مؤشرًا تتراكم اليوم (5 كحد أقصى)، فيرى القارئ صورة واحدة لا أرقامًا متفرقة
    const TOTAL_IND = 5;
    const bar = items.length ? `<div class="nbr-bar" title="${items.length} من ${TOTAL_IND}"><span style="width:${Math.round(items.length/TOTAL_IND*100)}%"></span></div>` : '';
    const foot = items.length
      ? `🔎 ${items.length} من ${TOTAL_IND} مؤشرات تحتاج متابعة · العتبات: غياب طالب ${A.daysThreshold} يومًا أو ${A.runThreshold} متتالية · غياب معلم ${ABSENT_WARN_DAYS + 1}+ · تحويلات ${__insightTransfersThreshold + 1}+ · تأخّر معلم ${L.teacherThreshold + 1}+ · تأخّر طالب ${L.studentThreshold}+`
      : `✅ لا شيء يحتاج متابعة الآن — الغياب والتحويلات والتأخّر ضمن الحدود`;
    return `
    <div class="nbr-wrap">
      <div class="nbr-panel">
        <div class="nbr-head">
          <div class="nbr-head-l">
            <div class="nbr-logo">🔎</div>
            <div>
              <p class="nbr-title">نبراس يرى</p>
              <p class="nbr-sub">${fmtDateOnly(todayStr())} · قراءة ذكية لبيانات مدرستك</p>
            </div>
          </div>
          <a class="nbr-link" href="#/attendance">عرض التحليلات التفصيلية ←</a>
        </div>
        ${items.length ? `<div class="nbr-grid">${items.join('')}</div>${bar}` : ''}
        <div class="nbr-foot">${foot}</div>
      </div>
    </div>`;
  })();


  // الأنشطة القادمة
  const typeIcon = t => { const x = activityTypes.find(v => v.value === t); return x ? x.icon : '🎉'; };
  const upcoming = (d.activities||[]).filter(a => String(a.date||'') >= today).sort((a,b) => String(a.date).localeCompare(String(b.date))).slice(0,4);
  const upcomingHTML = upcoming.length ? upcoming.map(a => `
    <a class="dash-activity-item" href="#/activity/${a.id}" style="text-decoration:none">
      <div class="dash-activity-ico">${typeIcon(a.type)}</div>
      <div style="min-width:0;flex:1">
        <div class="dash-activity-name" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(a.name)}</div>
        <div class="dash-activity-meta">${fmtDateOnly(a.date)} · 👥 ${(a.participants||[]).length} مشارك</div>
      </div>
    </a>`).join('') : '<p class="muted small" style="margin:4px 0">لا توجد أنشطة قادمة</p>';

  // الحضور اليوم — بطاقة الطلاب والمعلمين (تصميم الكود المرفق)
  const attGroup = (title, present, absent, late, pct, click, flip, subLate) => {
    // المتأخرون محسوبون ضمن الحاضرين (subLate): لا يضافون فوقهم حتى لا يُضاعف العدد
    const total = subLate ? (present + absent) : (present + absent + late);
    const dispAbsent = Math.max(0, Math.min(absent, total));
    const dispLate = Math.max(0, Math.min(late, total - dispAbsent));
    const dispPresent = Math.max(0, total - dispAbsent - dispLate);
    const pPct = total ? Math.round(dispPresent/total*100) : 0;
    const aPct = total ? Math.round(dispAbsent/total*100) : 0;
    const donutBg = total ? `conic-gradient(#22c55e 0 ${pPct}%, #ef4444 ${pPct}% ${pPct+aPct}%, #f59e0b ${pPct+aPct}% 100%)` : 'conic-gradient(#e4edf5 0 100%)';
    const donutLabelColor = (absent > present && absent >= late) ? '#dc2626' : (present >= absent && present >= late ? '#16a34a' : '#d97706');
    const donut = `<div class="dash-donut" style="background:${donutBg}">
          <div class="dash-donut-center"><b style="color:${donutLabelColor}">${total}</b><span>مسجّل اليوم</span></div>
        </div>`;
    // نسبة الحضور تُلوَّن بالأخضر دائمًا لأنها نسبة الحضور نفسها (يُرجَع اللون للغياب/التأخر في الدائرة والأرقام)
    const pctBlock = `<div class="att-pct" onclick="${click}" title="عرض التفاصيل"><b>${pct}</b><span>حضور</span></div>`;
    const maxCount = Math.max(present, absent, late);
    const attNum = (n, color) => {
      const top = (n === maxCount && n > 0) ? 'font-size:14px;font-weight:900;' : 'font-size:12px;font-weight:800;';
      return `<b style="color:${color};${top}">${n}</b>`;
    };
    const legend = `<div class="att-legend">
          <div class="row"><span class="swatch" style="background:#22c55e"></span>حضور ${attNum(present, '#16a34a')}</div>
          <div class="row"><span class="swatch" style="background:#ef4444"></span>غياب ${attNum(absent, '#dc2626')}</div>
          <div class="row"><span class="swatch" style="background:#f59e0b"></span>تأخر ${attNum(late, '#d97706')}</div>
        </div>`;
    return `
    <div class="att-group${flip ? ' flip' : ''}">
      <p class="att-group-title">${title}</p>
      <div class="att-flex">
        ${flip ? pctBlock + legend + donut : donut + pctBlock + legend}
      </div>
    </div>`;
  };
  const tPresent = teachers.length - absentTeachers.length;
  const sPct = fmtRate(rate);
  const tRateAll = teachers.length ? Math.round(tPresent/teachers.length*100*10)/10 : null;
  const tPct = fmtRate(tRateAll);
  const donutHTML = `
    <div class="att-card">
      ${attGroup('👨‍🎓 حضور الطلاب', present, absent, late, sPct, 'showTodayAttendance()')}
      ${attGroup('👨‍🏫 حضور المعلمين والإداريين', tPresent, absentTeachers.length, lateTeachers.length, tPct, canMgrT ? 'showTeacherAbsenceList()' : 'showTodayAttendance()', true, true)}
      <button class="att-report-btn colA" onclick="showTodayAttendance()"><span>عرض تقرير الحضور</span><span>←</span></button>
      <button class="att-report-btn colB" onclick="showTeacherTodayAttendance()"><span>عرض تقرير الحضور</span><span>←</span></button>
    </div>`;
  const attPanel = `
    <div class="dash-panel">
      <div class="dash-panel-head">
        <p class="dash-panel-title">✅ الحضور اليوم</p>
        <span class="dash-panel-more" onclick="showTodayAttendance()" style="cursor:pointer">التفاصيل</span>
      </div>
      ${donutHTML}
    </div>`;

  // ====== نسبة تفعيل الحسابات — عدد من دخل حسابه (المدير يشرف على قسم البنين) ======
  const activationPanel = (() => {
    if(!isAdmin) return '';
    const isStaffRole = r => r !== 'STUDENT' && r !== 'ADMIN';
    // "فعّل حسابه" = من دخل حسابَه فعلاً (سجّل دخولاً — لديه سجل/تاريخ آخر دخول)
    const hasLoggedIn = u => !!(u && (u.lastLogin || (u.loginCount || 0) > 0));
    const acc = () => ({ activated: 0, total: 0, actNames: [], pendNames: [] });
    const schoolActs = ['BOYS'].map(school => {
      const sd = loadSchoolDB(school);
      const userMap = new Map((sd.users||[]).map(u => [u.id, u]));
      const st = acc();
      for(const s of (sd.students||[])){
        if(!s.active) continue;
        const u = userMap.get(s.id);
        if(!u || u.role !== 'STUDENT') continue;
        const nm = (s.fullName || s.name) + ' (بنين)';
        st.total++;
        if(hasLoggedIn(u)){ st.activated++; st.actNames.push(nm); } else { st.pendNames.push(nm); }
      }
      // المعلمون (role=TEACHER) وحدهم
      const teachers = acc();
      for(const u of (sd.users||[])){
        if(u.active === false) continue;
        if(u.role !== 'TEACHER') continue;
        const nm = (u.name || u.username) + ' (بنين)';
        teachers.total++;
        if(hasLoggedIn(u)){ teachers.activated++; teachers.actNames.push(nm); } else { teachers.pendNames.push(nm); }
      }
      // الإداريون والوكلاء والموجهون (بقية الأدوار عدا الطالب والمعلم والأدمن)
      const admins = acc();
      for(const u of (sd.users||[])){
        if(u.active === false) continue;
        if(!isStaffRole(u.role) || u.role === 'TEACHER') continue;
        const nm = (u.name || u.username) + ' (بنين)';
        admins.total++;
        if(hasLoggedIn(u)){ admins.activated++; admins.actNames.push(nm); } else { admins.pendNames.push(nm); }
      }
      return {
        key: school, school: 'بنين',
        students: st, teachers, admins
      };
    });
    const mergeAcc = (arr, f) => {
      const r = acc();
      arr.forEach(x => { r.activated += x[f].activated; r.total += x[f].total; r.actNames.push(...x[f].actNames); r.pendNames.push(...x[f].pendNames); });
      return r;
    };
    const comb = key => ({
      key,
      school: key === 'ALL' ? 'الكل' : 'بنين',
      students: mergeAcc(schoolActs, 'students'),
      teachers: mergeAcc(schoolActs, 'teachers'),
      admins: mergeAcc(schoolActs, 'admins')
    });
    const all = comb('ALL');
    const groups = [all, ...schoolActs.map(x => ({ key: x.key, school: x.school, students: x.students, teachers: x.teachers, admins: x.admins }))];
    // عند قسم واحد فقط (بنين — كما هو الحال الآن) تُعرض البيانات مباشرة دون تبويبات
    // "الكل/بنين" لأن الفلترة والإجمالي شيء واحد ولا داعي لتكرار التبويب.
    const singleSchool = schoolActs.length === 1 && groups.length === 2;
    const miniDonut = (label, g, gkey, grp) => {
      const pct = g.total ? Math.round((g.activated / g.total) * 100) : 0;
      const pend = g.total - g.activated;
      const donutBg = g.total ? `conic-gradient(#22c55e 0 ${pct}%, #eef2f7 ${pct}% 100%)` : 'conic-gradient(#e4edf5 0 100%)';
      return `
        <div class="act-block">
          <div style="font-weight:800;font-size:14px;color:#0f172a;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:5px" onclick="showActNames('${gkey}','${grp}')" title="اضغط لعرض أسماء من دخلوا ومن لم يدخلوا">${label}: ${g.activated}/${g.total} <span style="font-size:11px;color:#2563eb">📋</span></div>
          <div class="act-flex">
            <div class="dash-donut" style="width:116px;height:116px;background:${donutBg};cursor:pointer" onclick="showActNames('${gkey}','${grp}')" title="اضغط لعرض الأسماء">
              <div class="dash-donut-center"><b>${pct}%</b><span>فعّلوا</span></div>
            </div>
            <div class="att-legend">
              <div class="row" style="cursor:pointer" onclick="showActNames('${gkey}','${grp}')"><span class="swatch" style="background:#22c55e"></span>دخلوا الحساب <b>${g.activated}</b></div>
              <div class="row" style="cursor:pointer" onclick="showActNames('${gkey}','${grp}')"><span class="swatch" style="background:#eef2f7"></span>لم يدخلوا بعد <b>${pend}</b></div>
            </div>
          </div>
        </div>`;
    };
    const actTab = (g) => `
      <div class="act-grid">
        ${miniDonut('👨‍🎓 الطلاب', g.students, g.key, 'students')}
        ${miniDonut('👨‍🏫 المعلمون', g.teachers, g.key, 'teachers')}
        ${miniDonut('🛡 الإداريون والوكلاء والموجهون', g.admins, g.key, 'admins')}
      </div>`;
    return `
    <div class="dash-panel" style="margin-bottom:14px">
      <div class="dash-panel-head">
        <p class="dash-panel-title">🔑 نسبة تفعيل الحسابات</p>
        <span class="dash-panel-more" style="cursor:default">آخر تحديث عند فتح اللوحة</span>
      </div>
      ${singleSchool ? `<div class="act-pane">${actTab(groups[1])}</div>`

        ${groups.map((g,i) => `<button class="dash-tab ${i===0?'active':''}" data-act="${g.key}" onclick="switchActTab('${g.key}')">${g.school}</button>`).join('')}
      </div>
      ${groups.map(g => `<div class="act-pane" data-act="${g.key}" style="${g.key==='ALL'?'':'display:none'}">${actTab(g)}</div>`).join('')}`}

    </div>`;
  })();

  // لوحة الأوائل — المراحل (ابتدائي/متوسط/ثانوي)
  const ptsMap = studentPointsMap();
  const medals = ['🥇','🥈','🥉'];
  const classLabelOf = s => { const c = s.classId ? classById(s.classId) : null; return c ? classLabel(c) : '—'; };
  const stageGroups = [
    { tab:'pri', label:'ابتدائي', min:-1, max:5 },
    { tab:'mid', label:'متوسط', min:6, max:8 },
    { tab:'sec', label:'ثانوي', min:9, max:11 },
  ];
  const stageLeaders = g => {
    const gradeIds = new Set(d.grades.filter(x => x.order >= g.min && x.order <= g.max).map(x => x.id));
    const classIds = new Set(d.classes.filter(c => gradeIds.has(c.gradeId)).map(c => c.id));
    const studs = students.filter(s => s.classId && classIds.has(s.classId));
    // نعرض طلاب المرحلة (فصول المعلم) بترتيب النقاط تنازلياً — حتى من له 0 نقاط يظهر،
    // فلا تبقى مرحلة «فارغة» لدى المعلم ما دام يدرّس طلاباً فيها.
    const withPts = studs.map(s => ({ s, pts: ptsMap[s.id] || 0 })).sort((a,b) => b.pts - a.pts || String(a.s.fullName).localeCompare(String(b.s.fullName),'ar'));
    if(withPts.length === 0) return '<p class="muted small" style="margin:4px 0">لا توجد طلاب مسندون إليك في هذه المرحلة</p>';
    return withPts.slice(0,3).map((x,i) => `
    <div class="dash-leader-row">
      <span class="dash-leader-medal">${medals[i] || '•'}</span>
      <div style="min-width:0">
        <div class="dash-leader-name">${studentNameLink(x.s)}</div>
        <div class="dash-leader-meta">${escapeHtml(classLabelOf(x.s))}</div>
      </div>
      <span class="dash-leader-pts" style="color:#16a34a">+${x.pts}</span>
    </div>`).join('');
  };

  const leadersHTML = `
    <div class="dash-panel" style="padding:0">
      <div class="dash-panel-head" style="padding:14px 16px 10px">
        <p class="dash-panel-title" style="margin:0">🏆 لوحة الأوائل</p>
        <span class="dash-panel-more" onclick="location.hash='#/students'" style="cursor:pointer">عرض الكل</span>
      </div>
      <div style="padding:0 12px 12px">
        <div class="dash-tabs">
          ${stageGroups.map((g,i) => `<button class="dash-tab ${i===0?'active':''}" data-tab="${g.tab}" onclick="switchLeadersTab('${g.tab}')">${g.label}</button>`).join('')}
        </div>
        ${stageGroups.map((g,i) => `<div class="dash-leader-pane" data-tab="${g.tab}" style="margin-top:10px;${i===0?'':'display:none'}">${stageLeaders(g)}</div>`).join('')}
      </div>
    </div>`;

  const bottom = `
  ${insightsHTML}
  <div class="dash-bottom">
    <div class="dash-panel">
      <div class="dash-panel-head">
        <p class="dash-panel-title">🎉 الأنشطة القادمة</p>
        <span class="dash-panel-more" onclick="location.hash='#/activities'" style="cursor:pointer">عرض الكل</span>
      </div>
      ${upcomingHTML}
    </div>
    <div class="dash-mid">
      ${leadersHTML}
      ${isTeacher ? renderTeacherWeekTT(d, true) : `
      <div class="dash-panel">
        <div class="dash-panel-head">
          <p class="dash-panel-title">📌 يحتاج إلى متابعتك</p>
          <span class="dash-panel-more" onclick="showPendingTransfers()" style="cursor:pointer">عرض التفاصيل</span>
        </div>
        ${needsHTML}
      </div>`}
    </div>
  </div>`;

  return `
  ${renderEscapeAlerts()}
  ${renderAdminMsgAlerts()}
  ${hero}
  ${isTeacher ? teacherQuickCards : ''}
  ${attPanel}
  ${activationPanel}
  <div style="border-radius:18px;overflow:hidden;border:1px solid #bfdbfe;margin-bottom:14px;background:#fff;box-shadow:0 4px 18px rgba(37,99,235,.12)">
    <div style="background:linear-gradient(135deg,#38bdf8,#2563eb);color:#fff;padding:11px 18px;display:flex;align-items:center;justify-content:space-between">
      <div style="font-weight:800;font-size:15px">🏆 رواد نبراس — الأكثر تفاعلاً هذا الأسبوع</div>
      <span style="font-size:11px;font-weight:700;opacity:.95">تسجيل الدخول</span>
    </div>
    <div style="padding:10px 18px 12px">${renderNibrasPioneers(true)}</div>
  </div>
  ${isTeacher ? (() => {
    const tst = teacherStats(teacherSelfRecord(d, user));
    // عدد أيام الدراسة المنقضية (الاثنين–الجمعة) منذ بداية السنة الدراسية
    const nowd = new Date();
    const y = nowd.getFullYear(), mo = nowd.getMonth();
    const yearStart = (mo>=8 ? new Date(y,8,1) : new Date(y-1,8,1));
    yearStart.setHours(0,0,0,0);
    const today0 = new Date(); today0.setHours(0,0,0,0);
    let worked = 0;
    const walk = new Date(yearStart);
    while(walk <= today0){ const dow = walk.getDay(); if(dow>=1 && dow<=5) worked++; walk.setDate(walk.getDate()+1); }
    const attPct = worked>0 ? Math.max(0, Math.round((Math.max(0, worked - tst.absent))/worked*100)) : 100;
    // نفصل الأيام الثلاثة حتى يظهر تأخر المعلم كما يظهر تأخر الطلاب.
    // انتبه: lateDays تحسب أياماً تقويمية كلّها، و worked تحسب الاثنين-الجمعة
    // فقط، فقد يتجاوز التأخر أيام العمل فيوم سبت أو أحد مسجّل تأخّر.
    // لذلك نُقصّ ونُوزّع على مجموع حقيقي، فلا تنقص الشريحة الحمراء عن الصفر
    // ولا يتجاوز مجموع الشرائح 100% فيصير نصف الدائرة ملفوفاً.
    const lateDays = Math.max(0, tst.lateDays || 0);
    const absentDays = Math.max(0, tst.absent || 0);
    const presentDays = Math.max(0, worked - absentDays - lateDays);
    let segP = 100, segL = 0, segA = 0;
    if(worked > 0){
      const rawP = Math.max(0, worked - absentDays - lateDays);
      const rawL = Math.min(lateDays, worked);
      const rawA = Math.min(absentDays, Math.max(0, worked - rawL));
      const sum2 = rawP + rawL + rawA || 1;
      segP = Math.round(rawP / sum2 * 100);
      segL = Math.round(rawL / sum2 * 100);
      segA = Math.max(0, 100 - segP - segL);
    }
    const grade = attPct>=95 ? {t:'ممتاز',c:'#16a34a'} : attPct>=85 ? {t:'جيد جدًا',c:'#1d7fd6'} : attPct>=75 ? {t:'جيد',c:'#0f766e'} : attPct>=50 ? {t:'مقبول',c:'#d97706'} : {t:'يحتاج تحسين',c:'#dc2626'};
    return `
    <div style="margin:0 0 14px;border-radius:18px;padding:0;background:#fff;border:1px solid #e6edf5;box-shadow:0 6px 20px rgba(15,79,136,.08);overflow:hidden">
      <div style="background:linear-gradient(135deg,#0f766e,#1d4ed8);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px">
        <div style="width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0">⏱</div>
        <div style="flex:1">
          <div style="font-weight:800;font-size:16px">الالتزام بالدوام (${y})</div>
          <div style="font-size:12px;opacity:.92">بطاقة تقييم حضورك في السنة الدراسية الحالية</div>
        </div>
        <span style="background:${grade.c};color:#fff;border-radius:999px;padding:5px 14px;font-weight:800;font-size:12.5px;white-space:nowrap">${grade.t}</span>
      </div>
      ${absentWarningHtml(tst.absent, user.id, true)}
      <div style="display:flex;gap:18px;padding:20px 18px;align-items:center;flex-wrap:wrap">
        <div style="display:flex;flex-direction:column;align-items:center;gap:8px;flex-shrink:0">
          <div style="width:132px;height:132px;border-radius:50%;background:conic-gradient(${grade.c} 0 ${segP}%, #f59e0b ${segP}% ${segP+segL}%, #ef4444 ${segP+segL}% ${segP+segL+segA}%, #eef2f7 ${segP+segL+segA}% 100%);display:flex;align-items:center;justify-content:center;position:relative">
            <div style="position:absolute;inset:9px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center">
              <div style="font-size:30px;font-weight:900;color:${grade.c};line-height:1">${attPct}%</div>
              <div style="font-size:10px;color:#9ca3af;margin-top:2px">نسبة الحضور</div>
            </div>
          </div>
          <div style="font-size:12px;color:#6b7280">من ${worked} ${worked===1?'يوم عمل':'أيام عمل'}</div>
        </div>
        <div style="flex:1;min-width:200px;display:flex;flex-direction:column;gap:12px">
          ${kpiPill('❌','أيام الغياب', tst.absent, '#ef4444', "openTeacherDetail('ABSENT','"+user.id+"')")}
          ${kpiPill('🟡','أيام التأخر', lateDays, '#b45309', "openTeacherDetail('LATE','"+user.id+"')")}
          ${kpiPill('🕐','دقائق التأخر', tst.lateMin, '#b45309', "openTeacherDetail('LATE','"+user.id+"')")}
        </div>
      </div>
      <div style="padding:0 18px 18px">
        <div style="height:10px;border-radius:999px;background:#eef2f7;overflow:hidden"><div style="height:100%;width:${attPct}%;background:${grade.c};border-radius:999px;transition:width .4s"></div></div>
        <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-top:6px;font-size:11.5px;color:#6b7280">
          <span>✅ الحضور: ${presentDays}</span>
          <span>🟡 التأخر: ${lateDays}</span>
          <span>❌ الغياب: ${tst.absent}</span>
          <span>${tst.absent===0 && lateDays===0 ? '🎉 مداوم مثالي' : ''}</span>
        </div>
      </div>
    </div>`;
    function kpiPill(ico, lbl, val, color, click){
      return `<div style="display:flex;align-items:center;gap:12px;background:${color}12;border:1px solid ${color}33;border-radius:14px;padding:10px 14px;cursor:${click?'pointer':'default'};transition:transform .15s" ${click?`onclick="${click}"`:'title="ظهر عند أول دخول لك اليوم"'} data-tip="اضغط للتفاصيل">
        <span style="width:38px;height:38px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0">${ico}</span>
        <div style="flex:1">
          <div style="font-size:12.5px;color:#374151;font-weight:700">${lbl}</div>
          <div style="font-size:18px;font-weight:900;color:${color};line-height:1.1">${val}</div>
        </div>
      </div>`;
    }
  })() : ''}
  ${bottom}
  ${isTeacher && myClasses.length ? `
  <h2 class="section-title">📊 ${tl('إحصائيات فصولي')}</h2>
  <div class="grid grid-6">${myClassCards}</div>
  ` : ''}
  ${isMgr ? renderCharts(d) : ''}
  ${todayAtt.length===0 ? `<div class="card mt"><p class="muted">لم يُسجَّل حضور اليوم بعد — انتقل إلى صفحة <a href="#/attendance" class="link">الحضور</a> لتسجيله.</p></div>` : ''}
  `;
}

/* ============ النقاط الإيجابية والسلبية ============ */
function renderPointsSection(){
  const students = getVisibleStudents();
  const visibleIds = new Set(students.map(s => s.id));
  const d = loadDB();
  const items = pointItems(d).filter(it => visibleIds.has(it.studentId));
  let posTotal = 0, negTotal = 0;
  const per = {};
  items.forEach(it => {
    if(it.points >= 0) posTotal += it.points; else negTotal += it.points;
    per[it.studentId] = (per[it.studentId]||0) + it.points;
  });
  const leaderboard = Object.entries(per)
    .filter(([,p]) => p !== 0)
    .sort((a,b) => b[1]-a[1])
    .slice(0,5)
    .map(([sid, pts], i) => {
      const s = students.find(x => x.id === sid);
      const medals = ['🥇','🥈','🥉',''];
      return `<div style="display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px">
        <span style="width:24px;text-align:center">${medals[i]||'•'}</span>
        <span style="font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${studentNameLink(s)}</span>
        <span style="font-weight:800;color:${pts>=0?'#16a34a':'#dc2626'}">${pts>0?'+':''}${pts}</span>
      </div>`;
    }).join('');
  return `
  <h2 class="section-title">🏆 النقاط (الإيجابية والسلبية)</h2>
  <div class="grid grid-3">
    <div class="card"><p class="muted">🟢 النقاط الإيجابية</p><p class="stat-value green">+${posTotal}</p></div>
    <div class="card"><p class="muted">🔴 النقاط السلبية</p><p class="stat-value red">${negTotal}</p></div>
    <div class="card"><p class="muted">⭐ صافي النقاط</p><p class="stat-value" style="color:${(posTotal+negTotal)>=0?'#16a34a':'#dc2626'}">${(posTotal+negTotal)>0?'+':''}${posTotal+negTotal}</p></div>
  </div>
  <div class="card mt">
    <p class="card-label">🏅 أعلى 5 طلاب نقاطًا</p>
    ${leaderboard ? leaderboard : '<p class="muted small">لا توجد نقاط بعد — سجّل ملاحظات إيجابية أو سلبية</p>'}
  </div>`;
}

/* ============ لوحة الأوائل: أعلى المعلمين + أعلى طالب في كل مرحلة (للمدير) ============ */
function renderStageLeaders(d){
  const stageGroups = [
    { label:'🎓 الابتدائي', min:-1, max:5 },
    { label:'🎓 المتوسط', min:6, max:8 },
    { label:'🎓 الثانوي', min:9, max:11 },
  ];
  const ptsMap = studentPointsMap();
  const studentCol = g => {
    const gradeIds = new Set(d.grades.filter(x => x.order >= g.min && x.order <= g.max).map(x => x.id));
    const classIds = new Set(d.classes.filter(c => gradeIds.has(c.gradeId)).map(c => c.id));
    const studs = d.students.filter(s => s.classId && classIds.has(s.classId));
    const withPts = studs.map(s => ({ s, pts: ptsMap[s.id] || 0 })).filter(x => x.pts !== 0)
      .sort((a,b) => b.pts - a.pts || String(a.s.fullName).localeCompare(String(b.s.fullName),'ar'));
    const clsOf = s => { const c = classById(s.classId); return c ? classLabel(c) : '—'; };
    if(withPts.length === 0) return `<div style="min-width:0"><div style="font-size:12px;font-weight:700;margin-bottom:6px">${g.label}</div><p class="muted small">لا توجد نقاط</p></div>`;
    const medals = ['🥇','🥈','🥉'];
    return `<div style="min-width:0">
      <div style="font-size:12px;font-weight:700;margin-bottom:6px">${g.label}</div>
      ${withPts.slice(0,3).map((x,i) => `
      <div style="display:flex;align-items:center;gap:6px;padding:3px 0;border-bottom:1px dashed var(--border-color,#eef2f7)">
        <span style="font-size:12px">${medals[i]}</span>
        <span style="font-weight:600;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${studentNameLink(x.s)}</span>
        <span class="muted small" style="flex-shrink:0">${escapeHtml(clsOf(x.s))}</span>
        <span style="margin-inline-start:auto;font-weight:800;font-size:13px;color:#16a34a">${x.pts>0?'+':''}${x.pts}</span>
      </div>`).join('')}
    </div>`;
  };
  const teachers = d.users.filter(u => u.role === 'TEACHER' && u.active);
  const actionsOf = id => {
    const att = d.attendance.filter(a => a.createdBy === id).length;
    const notes = d.notes.filter(n => n.createdBy === id && !n.deleted).length;
    const trans = d.transfers.filter(t => t.createdBy === id).length;
    return { att, notes, trans, total: att + notes + trans };
  };
  const ranked = teachers.map(t => ({ t, a: actionsOf(t.id) }))
    .sort((x,y) => y.a.total - x.a.total || String(x.t.lastLogin||'').localeCompare(String(y.t.lastLogin||'')));
  const medals = ['🥇','🥈','🥉'];
  const teacherCol = ranked.length===0
    ? '<p class="muted small">لا يوجد معلمون</p>'
    : ranked.slice(0,3).map((r,i) => `
      <a href="#/teacher/${r.t.id}" style="display:flex;align-items:center;gap:6px;padding:3px 0;text-decoration:none;border-bottom:1px dashed var(--border-color,#eef2f7)" title="متابعة المعلم ورسائله">
        <span style="font-size:12px">${medals[i]}</span>
        <span style="font-weight:600;font-size:12px;color:#2563eb;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(r.t.name)}</span>
        <span style="font-weight:800;font-size:13px;color:#16a34a;margin-inline-start:auto">${r.a.total}</span>
      </a>`).join('');
  return `
  <h2 class="section-title">🏆 ${tl('لوحة الأوائل')}</h2>
  <div class="card" style="padding:12px">
    <div class="grid grid-4" style="gap:10px">
      <div style="min-width:0">
        <div style="font-size:12px;font-weight:700;margin-bottom:4px">👨‍🏫 ${tl('الأعلى تفاعلًا — المعلمون')}</div>
        ${teacherCol}
      </div>
      ${stageGroups.map(studentCol).join('')}
    </div>
  </div>`;
}

/* ============ قائمة حضور اليوم (عند الضغط على نسبة الحضور) ============ */
function showTodayAttendance(){
  const d = loadDB();
  const students = getVisibleStudents();
  const visibleIds = new Set(students.map(s => s.id));
  const today = todayStr();
  const recsInit = d.attendance.filter(a => a.date === today && visibleIds.has(a.studentId));
  const uniq = new Map();
  recsInit.forEach(a => uniq.set(a.studentId, __attWinner(uniq.get(a.studentId), a)));
  const recs = Array.from(uniq.values());
  const order = { PRESENT:0, LATE:1, ABSENT:2 };
  recs.sort((a,b) => (order[__attEffStatus(a)]||0) - (order[__attEffStatus(b)]||0));
  const ptsMapAttList = studentPointsMap();
  const statusBadge = { PRESENT:['حاضر','#16a34a'], LATE:['متأخر','#d97706'], ABSENT:['غائب','#dc2626'] };
  const absTypeLabel = t => t === 'EXCUSED' ? 'مستأذن' : (t === 'ESCAPE' ? 'هارب من الحصة' : 'غائب');
  const absTypeColor = t => t === 'EXCUSED' ? '#1d4ed8' : (t === 'ESCAPE' ? '#b91c1c' : '#dc2626');

/* ============ «نبراس يرى»: تفاصيل الغياب المتكرر والتحويلات المتكررة والتأخر المتكرر ============ */
/* معطيات المؤشرات:
   - غياب متكرر = 5 أيام غياب فأكثر، أو 5 أيام متتالية على مدى آخر 30 يومًا (سجل الحضور).
   - تحويلات متكررة = أكثر من 3 تحويلات لنفس الطالب.
   - تأخر المعلمين المتكرر = أكثر من 5 مرات تأخّر خلال الشهر (teacher.markedLate).
   - تأخر طلاب متكرر = 5 مرات تأخّر فأكثر خلال الشهر (سجل الحضور status LATE).
   - غياب المعلمين = أكثر من 3 أيام غياب في السنة الدراسية (teacher.absences).
     ولم يكن موجودًا في الأصل، فلم يرَ أحدُ متابعَي لوحة التحليلات غياب
     معلمٍ تجاوز 3 أيام مع بقاء كل مؤشرات الطلاب سليمة — وعتبة المؤشر
     غير عتبة الطلاب (3 لا 5)، وأفقه امتداد السنة لا آخر 30 يومًا.
   الأسس كلها سجلات الحضور/الحضور الفعلية، فتبقى الأرقام مطابقة لما في باقي اللوحة. */
const __insightAbsOpts = { windowDays:30, daysThreshold:5, runThreshold:5 };
const __insightTransfersThreshold = 3;
/* حدّ غياب المعلم: يتجاوز غيابها 3 أيام فتظهر. رقم واحد للتطبيق كلّه —
   تنبيهُها في لوحتها (absentWarningHtml) ومؤشرُها في التحليلات يستدعيانه،
   فلا يجوز أن يرى المدير شرطًا وتراه المعلم شرطًا آخر. فالشرط تجاوز، لا
   مساواة: 3 أيام لا تظهر، 4 تظهر. */
const ABSENT_WARN_DAYS = 3;
const __insightTeacherAbsThreshold = ABSENT_WARN_DAYS;
// studentThreshold حدّ أدنى مُغلق: 5 مرات فأكثر تكفي للظهور (وليس «أكثر من 5»).
// يُقرأ بـ n < lim في __insightLateStudents، بخلاف teacherThreshold الذي يبقى
// «أكثر من 5» (n <= lim) لأن عتبته لم تتغيّر.
const __insightLateOpts = { teacherThreshold:5, studentThreshold:5 };
/* بداية الشهر بالتقويم المحلي للمتصفح، وهي التقويم نفسه الذي كُتبت به مفاتيح
   التواريخ في البيانات: todayStr() في أعلى الملف هي التي تولّد attendance.date
   وتواريخ teacher.markedLate. فلو حسبنا الشهر بتوقيت المدرسة (Asia/Karachi) لاختلف
   الشهر عند حدّ الفجر على جهاز لا يوافق توقيت المدرسة، وحُسب يومٌ خطأً. القاعدة:
   نرشّح بتلك المفاتيح كما هي، فنحدّد الشهر بمنهج كاتبها لا بمنهج مستقل.
   المعامل d اختياري (يصلح للحساب على تاريخ معيّن) وهو ما يجعل السلوك قابلًا للاختبار. */
function __insightMonthStart(d0){
  try{
    const d = d0 || new Date();
    if(!(d instanceof Date) || isNaN(d.getTime())) return null;
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-01';
  }catch(e){ return null; }
}
function __insightRepeatedAbsence(opts){
  const o = Object.assign({}, __insightAbsOpts, opts || {});
  const d = loadDB();
  const DAY = 86400000;
  const startMs = Date.now() - o.windowDays * DAY;
  const absDays = new Map();
  for(const a of (d.attendance || [])){
    if(!a || a.deleted || !a.studentId) continue;
    const t = Date.parse(a.date || '');
    if(!Number.isFinite(t) || t < startMs) continue;
    if(__attEffStatus(a) !== 'ABSENT') continue;
    if(!absDays.has(a.studentId)) absDays.set(a.studentId, new Set());
    absDays.get(a.studentId).add(a.date);
  }
  const longestRun = (dates) => {
    const sorted = Array.from(dates).slice().sort();
    let best = 0, run = 0, prev = null;
    for(const ds of sorted){
      const t = Date.parse(ds);
      if(!Number.isFinite(t)) continue;
      run = (prev !== null && t - prev === DAY) ? run + 1 : 1;
      if(run > best) best = run;
      prev = t;
    }
    return best;
  };
  const students = new Map((d.students || []).filter(s => s && s.active !== false).map(s => [s.id, s]));
  const out = [];
  for(const [sid, dates] of absDays){
    const total = dates.size, run = longestRun(dates);
    if(total < o.daysThreshold && run < o.runThreshold) continue;
    const s = students.get(sid);
    if(!s) continue; // طالب غير نشطة: لا تظهر
    const cls = s.classId ? (d.classes || []).find(c => c && c.id === s.classId) : null;
    out.push({ id:sid, name:s.fullName || s.name || sid, className: cls ? classLabel(cls) : '', total, run,
               dates: Array.from(dates).sort().reverse() });
  }
  out.sort((a,b) => (b.run - a.run) || (b.total - a.total));
  return out;
}
function __insightFrequentTransfers(threshold){
  const d = loadDB();
  const lim = Number(threshold) || __insightTransfersThreshold;
  const count = new Map();
  for(const t of (d.transfers || [])){
    if(!t || t.deleted) continue;
    if(!transferForMe(t)) continue;   // لا إحصاء تحويلات زميلات: لا اسم ولا عدّاد
    const ids = Array.isArray(t.studentIds) ? t.studentIds : (t.studentId ? [t.studentId] : []);
    for(const sid of ids) count.set(sid, (count.get(sid) || 0) + 1);
  }
  const students = new Map((d.students || []).filter(s => s && s.active !== false).map(s => [s.id, s]));
  const out = [];
  for(const [sid, n] of count){
    if(n <= lim) continue;
    const s = students.get(sid);
    if(!s) continue;
    const cls = s.classId ? (d.classes || []).find(c => c && c.id === s.classId) : null;
    out.push({ id:sid, name:s.fullName || s.name || sid, className: cls ? classLabel(cls) : '', n });
  }
  out.sort((a,b) => b.n - a.n);
  return out;
}
/* تأخر المعلمين المتكرر خلال الشهر: المصدر teacher.markedLate (مصفوفة مفاتيح تواريخ)،
   لا سجل الحضور — لأن حضور المعلّمات يُسجَّل على كائن المعلم لا في attendance.
   الكادر التعليمي = TEACHER وCOUNSELOR (كما في قوائمهن في بقية التطبيق)، لا الإدارة. */
function __insightLateTeachers(threshold){
  const lim = Number(threshold) || __insightLateOpts.teacherThreshold;
  const d = loadDB();
  const start = __insightMonthStart();
  if(!start) return [];
  const out = [];
  for(const u of (d.users || [])){
    if(!u || u.active === false) continue;
    if(u.role !== 'TEACHER' && u.role !== 'COUNSELOR') continue;
    const dates = Array.isArray(u.markedLate) ? u.markedLate.filter(x => typeof x === 'string' && x >= start) : [];
    const n = new Set(dates).size; // اليوم المتكرر يُحسب مرة واحدة
    if(n <= lim) continue;
    out.push({ id:u.id, name:u.name || u.id, role:u.role, n, dates:Array.from(new Set(dates)).sort().reverse() });
  }
  out.sort((a,b) => b.n - a.n);
  return out;
}
/* غياب المعلمين: أكثر من 3 أيام غياب هذا العام الدراسي.
   مصدره teacher.absences نفسه الذي يقرؤه teacherStats في لوحة المعلم
   وتنبيهها، فالأرقام لا تتعارض بيتَين. ونؤطّره بِسنة الدراسية لا بآخر
   30 يومًا لأن هذا السجلّ سنويّ: معلم غابت في أكتوبر لزم أن تُرى في مايو
   بعدما يهبط دورها، وإلا كان الناقد أعمى بعد شهر. ونقتصر على TEACHER
   لأن متابعة الغياب عندهم مربوطة بتلك البطاقة. */
function __insightTeacherAbsence(threshold){
  const lim = Number(threshold) || ABSENT_WARN_DAYS;
  const d = loadDB();
  const now = new Date();
  const yearStart = now.getMonth() >= 8 ? new Date(now.getFullYear(), 8, 1) : new Date(now.getFullYear()-1, 8, 1);
  const startKey = localDateKey(yearStart);
  const todayKey = localDateKey(now);
  const out = [];
  for(const u of (d.users || [])){
    if(!u || u.active === false) continue;
    if(u.role !== 'TEACHER') continue;
    const dates = Array.isArray(u.absences)
      ? u.absences.filter(x => typeof x === 'string' && x >= startKey && x <= todayKey)
      : [];
    const n = new Set(dates).size;   // اليوم المكرر يُحسب مرة واحدة
    if(n <= lim) continue;           // تجاوز لا مساواة: 3 لا تظهر، 4 تظهر
    out.push({ id:u.id, name:u.name || u.id, n, dates:Array.from(new Set(dates)).sort().reverse() });
  }
  out.sort((a,b) => b.n - a.n);
  return out;
}
/* تأخر الطلاب المتكرر خلال الشهر: من سجل الحضور، يوم واحد يُحسب مرة واحدة،
   ويُستبعد اليوم الذي صار فيه الطالب غائبًا (الغائب يفوز على المتأخر في القاعدة
   الواحدة __attEffStatus، فلا يُحتسب اليوم تأخرًا وحضورًا في آن). */
function __insightLateStudents(threshold){
  const lim = Number(threshold) || __insightLateOpts.studentThreshold;
  const d = loadDB();
  const start = __insightMonthStart();
  if(!start) return [];
  const days = new Map();
  for(const a of (d.attendance || [])){
    if(!a || a.deleted || !a.studentId) continue;
    const date = String(a.date || '');
    if(!date || date < start) continue;
    if(__attEffStatus(a) !== 'LATE') continue;
    if(!days.has(a.studentId)) days.set(a.studentId, new Set());
    days.get(a.studentId).add(date);
  }
  const students = new Map((d.students || []).filter(s => s && s.active !== false).map(s => [s.id, s]));
  const out = [];
  for(const [sid, set] of days){
    const n = set.size;
    // حدّ أدنى مُغلق: lim فأكثر تظهر (5 مرات = 5 تظهر). n < lim لا n <= lim،
    // فلا تظهر إلا من lim+1 فيغيب الحدّ المطلوب عند حدّه بالضبط.
    if(n < lim) continue;
    const s = students.get(sid);
    if(!s) continue; // طالب غير نشطة: لا تُتابع
    const cls = s.classId ? (d.classes || []).find(c => c && c.id === s.classId) : null;
    out.push({ id:sid, name:s.fullName || s.name || sid, className: cls ? classLabel(cls) : '', n, dates:Array.from(set).sort().reverse() });
  }
  out.sort((a,b) => b.n - a.n);
  return out;
}

  });
  if(!u) return;
  const sources = ['BOYS'].map(s => ({ school: s, d: loadSchoolDB(s) }));
  const pending = [];

    loadAdminMsgsFor(school).filter(m => !m.deleted && m.senderRole === 'TRANSFER' && m.teacherId === uid && !m.dismissed).forEach(m => msgs.push({ m, school }));

/* ============ تفاصيل نقاط الطالب (نافذة منبثقة) ============ */
function studentNameLink(s, pts){
  if(!s) return '—';
  let badge = '';
  if(pts !== undefined){
    badge = ` <span style="display:inline-block;min-width:26px;text-align:center;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:800;background:${pts>=0?'#dcfce7':'#fee2e2'};color:${pts>=0?'#16a34a':'#dc2626'}" title="نقاط الطالب (ثواب/عقاب)">${pts>0?'+':''}${pts}</span>`;
  }
  return `<a href="javascript:void(0)" onclick="showStudentPoints('${s.id}')" style="color:inherit;text-decoration:none;border-bottom:1px dashed #cbd5e1;cursor:pointer" title="عرض تفاصيل النقاط">${escapeHtml(s.fullName)}</a>${badge}${nibrasBadgeHTML(s.id)}`;
}
/* زر «تحديث الآن» في نافذة النقاط: يسحب أحدث نسخة من الخادم ثم يعيد فتح
   النافذة نفسها بالبيانات الحقيقية — فيتبدّد صفُّ «سجلات خاصة» الوهمي أمام
   المدير/الوكيل، وتظهر السطور الفعلية بعد أن تصل إلى جهازه. */
async function __refreshPointsView(studentId){
  try{
    const school = getActiveSchool();
    if(!school || !__serverEnabled() || !__syncEnabled()) return;
    try{ await __syncPull(school); }catch(e){}
    try{ await __syncPush(school); }catch(e){}
    try{ __refreshUnpushedBar(); }catch(e){}
    showStudentPoints(studentId);
  }catch(e){}
}
function showStudentPoints(studentId){
  const d = loadDB();
  const s = studentById(studentId);
  if(!s) return;
  const cls = classById(s.classId);
  const items = pointItems(d).filter(it => it.studentId === studentId);
  items.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
  let pos = 0, neg = 0;
  // ===== مبالغ لا تُعرض، فيبقى الصافي مطابقاً لرصيد الخادم =====
  // بعد إخفاء نصوص الزميلات لا تصل ملاحظاته أصلاً إلى هذا الجهاز، فلا يستطيع
  // pointItems أن يبني صفّاً «مخفياً» يقابل ما لو كان النص موجوداً. فبدل تخمين
  // ذلك الصف، نأخذ الفارق بين رصيد الخادم (pointsTotals المرسَل من المخزون
  // الكامل) ومجموع ما هو معروض هنا، ونعرضه سطراً واحداً بلا أي محتوى.
  // وهذا يغطّي ما لم نره لا الملاحظات الأخرى فحسب، بل أيضاً خصم التكليف الذي
  // كُفِف على الخادم لأن ملاحظة زميلة غطّته.
  let hiddenCount = 0, hiddenNet = 0;
  const visible = [];
  for(const it of items){
    if(it.hiddenNote){ hiddenCount++; hiddenNet += it.points; continue; }
    visible.push(it);
  }
  const shownNet = items.reduce((sum, it) => sum + (it.points || 0), 0);
  const srvRow = __pointsTotals();
  const srvTotal = (srvRow && srvRow[studentId]) ? srvRow[studentId].total : null;
  let diff = 0;
  if(srvTotal != null) {
    diff = srvTotal - shownNet;
    if(diff !== 0){ hiddenNet += diff; hiddenCount++; }
  }
  const meN = currentUser();
  const privileged = NRC_isAdminNotesRole(meN);
  // الفارق أمام مدير/وكيل (يريان كل الملاحظات) ليس خصوصيةَ زميلات أبداً:
  // هو خللُ محليةٍ قديمة مقابل لقطةٍ أشملَ للخادم، فتوصَف بصدق مع زر «تحديث
  // الآن» يحمل أحدث نسخة وتتبدّد الأسطر المبهمة. غيرُ المتميز يبقى له خصوصية
  // حقيقية (نصوص زميلاته لا تصل أصلاً) فيُقالما هو عليه بوضوح.
  const gapLabel = privileged
    ? 'سجلات أحدث على الخادم لم تبلغ هذا الجهاز بعد'
    : (hiddenCount ? 'سجلات خاصة — للمعلّمات الأخريات' : 'سجلات محسوبة على الخادم');
  const needRefresh = !!privileged && diff !== 0 && __serverEnabled() && __syncEnabled();
  const hiddenRow = (hiddenCount || hiddenNet) ? `<tr style="background:#f8fafc">
        <td style="color:#94a3b8">🔒</td>
        <td colspan="2" style="color:#64748b">${gapLabel}${needRefresh ? ` — <a href="javascript:void(0)" onclick="__refreshPointsView('${studentId}')" style="color:#0f766e;font-weight:700;border-bottom:1px dashed">تحديث الآن</a>` : ''}</td>
        <td class="muted small">—</td>
        <td class="muted small">—</td>
        <td style="font-weight:700;color:${hiddenNet>=0?'#16a34a':'#dc2626'}">${hiddenNet>0?'+':''}${hiddenNet}</td>
      </tr>` : '';
  // تشخيص مقتضب للوضع الشارد فقط: ظهور «فارق» أمام مدير/وكيل على نسخة
  // مطابقة غريبٌ، فتُعرض الأرقام الحاسمة بدل الغموض.
  const diagBox = (needRefresh && hiddenRow) ? `<div style="margin-top:10px;padding:9px 12px;background:#f1f5f9;border-radius:8px;font-size:11.5px;color:#475569;line-height:1.9;text-align:right">🔍 دورك: ${escapeHtml(meN?.role || '—')} (${escapeHtml(meN?.id || '—')}) — مجموع ما على هذا الجهاز: ${shownNet>0?'+':''}${shownNet} | رصيد الخادم الحقيقي: ${srvTotal>0?'+':''}${srvTotal} | الفارق: ${diff>0?'+':''}${diff} | ملاحظات مخفية محلياً: ${hiddenCount} (${hiddenNet>0?'+':''}${hiddenNet})<br>غالباً جهازك لم يسحب أحدث البيانات بعد — اضغط «تحديث الآن» بالأسفل إن لم يتحدّث تلقائياً.</div>` : '';
  const rows = visible.map(n => {
    const pts = n.points;
    if(pts >= 0) pos += pts; else neg += pts;
    const by = userById(n.createdBy);
    return `<tr>
      <td style="color:${n.type==='POSITIVE'?'#16a34a':'#dc2626'}">${n.type==='POSITIVE'?'🟢 إيجابية':'🔴 سلبية'}${n.kind==='att'?' ⏱':''}</td>
      <td>${escapeHtml(n.category)}</td>
      <td style="max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${n.description ? escapeHtml(n.description) : '—'}</td>
      <td>${escapeHtml(by?.name || '—')}</td>
      <td class="muted small">${new Date(n.createdAt).toLocaleDateString('ar-SA')}</td>
      <td style="font-weight:700;color:${pts>=0?'#16a34a':'#dc2626'}">${pts>0?'+':''}${pts}</td>
    </tr>`;
  }).join('') + hiddenRow;
  // الصافي يشمل مجموع المخفي، فيطابق رصيد الخادم رغم عدم عرض محتواه.
  if(hiddenNet > 0) pos += hiddenNet; else if(hiddenNet < 0) neg += hiddenNet;
  const net = pos + neg;
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px';
  overlay.onclick = (e) => { if(e.target === overlay) overlay.remove(); };
  overlay.innerHTML = `
    <div class="card" style="width:min(720px,100%);max-height:86vh;overflow:auto;padding:20px">
      <div class="header-row">
        <h3 style="margin:0">${escapeHtml(s.fullName)} <span class="muted small">${cls ? escapeHtml(classLabel(cls)) : ''}${s.studentNo ? ' · ر. '+escapeHtml(s.studentNo) : ''}</span></h3>
        <button class="btn-secondary" onclick="this.closest('.card').parentElement.remove()">✕ إغلاق</button>
      </div>
      <div class="grid grid-3" style="margin-top:12px">
        <div class="card" style="padding:10px;text-align:center"><p class="muted small">النقاط الإيجابية</p><p class="stat-value green" style="font-size:20px">+${pos}</p></div>
        <div class="card" style="padding:10px;text-align:center"><p class="muted small">النقاط السلبية</p><p class="stat-value red" style="font-size:20px">${neg}</p></div>
        <div class="card" style="padding:10px;text-align:center"><p class="muted small">الصافي</p><p class="stat-value" style="font-size:20px;color:${net>=0?'#16a34a':'#dc2626'}">${net>0?'+':''}${net}</p></div>
      </div>
      <table class="data-table" style="margin-top:12px">
        <thead><tr><th>النوع</th><th>الفئة</th><th>الوصف</th><th>المعلم المانح</th><th>التاريخ</th><th>النقاط</th></tr></thead>
        <tbody>${rows || `<tr><td colspan="6" style="text-align:center;padding:20px;color:#9ca3af">لا توجد سجلات نقاط لهذا الطالب</td></tr>`}</tbody>
      </table>
      ${diagBox}
    </div>`;
  document.body.appendChild(overlay);
}

/* ============ المفكرة والتذكير (لجميع المستخدمين) ============ */
const MEMO_PHRASE = 'حان وقت تذكيرك — نسأل الله لك التوفيق 🌟';
function memoKey(){ return 'nibras_memo_' + (currentUser()?.id || 'guest') + '_v1'; }
function loadMemo(){
  let arr = [];
  try { arr = JSON.parse(localStorage.getItem(memoKey()) || '[]'); } catch(e){ arr = []; }
  return Array.isArray(arr) ? arr : [];
}
function saveMemo(arr){ try { localStorage.setItem(memoKey(), JSON.stringify(arr)); } catch(e){} }
/* ============ مفكرتي الشخصية ============ */
function notebookKey(){ return 'nibras_notebook_' + (currentUser()?.id || 'guest') + '_v1'; }
function loadNotebook(){
  let arr = [];
  try { arr = JSON.parse(localStorage.getItem(notebookKey()) || '[]'); } catch(e){ arr = []; }
  return Array.isArray(arr) ? arr : [];
}
function saveNotebook(arr){ try { localStorage.setItem(notebookKey(), JSON.stringify(arr)); } catch(e){} }
let notebookEditingId = null;
function notebookSaveBtnLabel(){ return notebookEditingId ? '💾 تحديث الملاحظة' : '💾 حفظ في المفكرة'; }
function notebookCancelBtnDisplay(){ return notebookEditingId ? '' : 'none'; }
function addNotebook(){
  const ta = document.getElementById('nbText');
  const text = (ta?.value || '').trim();
  if(!text){ alert('اكتب نص الملاحظة أولاً'); return; }
  const dateInp = document.getElementById('nbDate');
  const date = (dateInp?.value || todayStr());
  const arr = loadNotebook();
  if(notebookEditingId){
    const n = arr.find(x => x.id === notebookEditingId);
    if(n){ n.text = text; n.date = date; n.updatedAt = new Date().toISOString(); }
    notebookEditingId = null;
  } else {
    arr.push({ id: uid(), text, date, createdAt: new Date().toISOString(), updatedAt: null });
  }
  saveNotebook(arr);
  renderApp();
}
function startNotebookEdit(id){
  const arr = loadNotebook();
  const n = arr.find(x => x.id === id);
  if(!n) return;
  notebookEditingId = id;
  const ta = document.getElementById('nbText');
  if(ta){ ta.value = n.text; ta.focus(); }
  const dt = document.getElementById('nbDate');
  if(dt){ dt.value = n.date || (n.createdAt || '').slice(0,10) || todayStr(); }
  const btn = document.getElementById('nbSaveBtn');
  if(btn) btn.textContent = notebookSaveBtnLabel();
  const c = document.getElementById('nbCancelBtn');
  if(c) c.style.display = notebookCancelBtnDisplay();
}
function cancelNotebookEdit(){
  notebookEditingId = null;
  const ta = document.getElementById('nbText');
  if(ta) ta.value = '';
  const dt = document.getElementById('nbDate');
  if(dt) dt.value = todayStr();
  const btn = document.getElementById('nbSaveBtn');
  if(btn) btn.textContent = notebookSaveBtnLabel();
  const c = document.getElementById('nbCancelBtn');
  if(c) c.style.display = notebookCancelBtnDisplay();
}
function deleteNotebook(id){
  if(!confirm('حذف هذه الملاحظة؟')) return;
  saveNotebook(loadNotebook().filter(n => n.id !== id));
  renderApp();
}
function renderNotebookSection(){
  const arr = loadNotebook().sort((a,b) => (b.date || b.createdAt || '').localeCompare(a.date || a.createdAt || ''));

function addMemo(){

function deleteMemo(id){

  saveMemo(loadMemo().filter(n => n.id !== id));

}
function toggleMemoDone(id){

/* فحص التذكيرات المستحقة: تُعرض في نافذة منبثقة مع صوت تنبيه */
function checkMemoReminders(){
  const user = currentUser();
  if(!user) return;
  const arr = loadMemo();
  const now = Date.now();
  const due = arr.filter(n => n.remindAt && !n.reminded && !n.done && new Date(n.remindAt).getTime() <= now);
  if(!due.length) return;
  due.forEach(n => { n.reminded = true; n.firstRemindAt = n.firstRemindAt || new Date().toISOString(); });
  saveMemo(arr);
  try { playMsgAlert(); } catch(e){}
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const html = due.map(n => `<li style="background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:10px;margin:6px 0"><strong>🔔</strong> ${escapeHtml(n.text)}</li>`).join('');

  overlay.onclick = e => { if(e.target === overlay) closeDetails(); };
  document.body.appendChild(overlay);
  setTimeout(() => { try { playMsgAlert(); } catch(e){} }, 700);
}

/* ============ الطقس في إسلام آباد ============ */
const AR_DAYS = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const AR_MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const HIJRI_MONTHS = ['محرم','صفر','ربيع الأول','ربيع الآخر','جمادى الأولى','جمادى الآخرة','رجب','شعبان','رمضان','شوال','ذو القعدة','ذو الحجة'];
function hijriDateStr(){
  try{
    const now = new Date();
    for(const cal of ['islamic-umalqura', 'islamic', 'islamic-civil']){
      try{
        const fmt = new Intl.DateTimeFormat('en-u-ca-' + cal, { year:'numeric', month:'numeric', day:'numeric' });
        const parts = fmt.formatToParts(now);
        let y = 0, m = 0, d = 0;
        parts.forEach(p => { if(p.type === 'year') y = +p.value; else if(p.type === 'month') m = +p.value; else if(p.type === 'day') d = +p.value; });
        if(y && m >= 1 && m <= 12 && d) return `${d} ${HIJRI_MONTHS[m - 1]} ${y} هـ`;
      }catch(e){}
    }
  }catch(e){}
  return '';
}
function weatherCodeInfo(code){
  if(code === 0) return ['☀️', 'سماء صافية'];
  if(code <= 3) return ['⛅', 'غائم جزئيًا'];
  if(code <= 48) return ['🌫️', 'ضباب'];
  if(code <= 57) return ['🌦️', 'رذاذ خفيف'];
  if(code <= 67) return ['🌧️', 'مطر'];
  if(code <= 77) return ['🌨️', 'ثلوج'];
  if(code <= 82) return ['🌦️', 'زخات مطر'];
  if(code <= 99) return ['⛈️', 'عواصف رعدية'];
  return ['🌤️', 'طقس متغير'];
}
function clockTick(){
  const el = document.getElementById('clockLine');
  if(!el) return;
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,'0');
  const mm = String(now.getMinutes()).padStart(2,'0');
  const ss = String(now.getSeconds()).padStart(2,'0');
  el.innerHTML = `
    <div style="font-weight:800;color:var(--accent,#1d7fd6);font-size:16px;letter-spacing:1px;direction:ltr">🕐 ${hh}:${mm}:${ss}</div>
    <div style="font-size:10.5px;margin-top:1px">${AR_DAYS[now.getDay()]} ${now.getDate()} ${AR_MONTHS[now.getMonth()]} ${now.getFullYear()} — ${hijriDateStr()}</div>`;
}
function renderWeather(){
  const el = document.getElementById('weatherBox');
  if(!el) return;
  if(!window.__weatherClock){ window.__weatherClock = setInterval(clockTick, 1000); }
  const frame = inner => `
    <div class="info-card">
      <div class="muted small" id="clockLine" style="font-size:10.5px;line-height:1.4"></div>
      <div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-top:2px;flex-wrap:wrap">${inner}</div>
    </div>`;
  clockTick();
  fetch('https://api.open-meteo.com/v1/forecast?latitude=33.6844&longitude=73.0479&current_weather=true')
    .then(r => r.json())
    .then(d => {
      const cw = d && d.current_weather;
      if(!cw) throw new Error('no data');
      const [icon, label] = weatherCodeInfo(cw.weathercode);
      const t = Math.round(cw.temperature);
      el.innerHTML = frame(`
        <span style="font-size:26px">${icon}</span>
        <div>
          <div style="font-weight:800;font-size:19px;color:#eaf2fb">${t}°C</div>
          <div style="font-size:11px;color:rgba(255,255,255,.80)">${label} — إسلام آباد</div>
        </div>
        <span style="font-size:10.5px;color:rgba(255,255,255,.80)">💨 ${Math.round(cw.windspeed)} كم/س</span>`);
      clockTick();
    })
    .catch(() => { el.innerHTML = frame('<p class="muted small" style="margin:0">🌤 تعذر تحميل الطقس — تحقق من الاتصال بالإنترنت</p>'); });
}

/* ============ المتواجدون الآن من المعلمين/المعلمين (للمدير والوكلاء) ============ */
// قائمة الحضور اللحظية من الخادم (كل أجهزة القسم) — الاحتياط: نسخة المتصفح المحلية
let __presenceLive = null; // { at, users: [{id,name,role,active,lastSeenAt}, ...] }
function presenceUsersFor(school){
  if(__presenceLive && Date.now() - __presenceLive.at < 70000 && Array.isArray(__presenceLive.users)){
    const head = JSON.parse(localStorage.getItem('nibras_' + school + '_db_v1') || 'null');
    if(head && Array.isArray(head.users)){
      const byId = new Map(head.users.map(u => [u.id, u.active !== false]));
      return __presenceLive.users.map(su => Object.assign({}, su, { active: byId.has(su.id) ? byId.get(su.id) : su.active !== false }));
    }
    return __presenceLive.users;
  }
  const db = JSON.parse(localStorage.getItem('nibras_' + school + '_db_v1') || 'null');
  return (db && Array.isArray(db.users)) ? db.users : [];
}
function presentNowInfo(school){
  const cutoff = Date.now() - 3 * 60 * 1000;
  const teachers = presenceUsersFor(school).filter(u => u.role === 'TEACHER' && u.active);
  const present = teachers.filter(u => u.lastSeenAt && new Date(u.lastSeenAt).getTime() >= cutoff);
  const names = present.map(u => ({ name: u.name, online: true }));
  const absentNames = teachers.filter(u => !u.lastSeenAt || new Date(u.lastSeenAt).getTime() < cutoff).map(u => u.name);
  return { n: names.length, names, absentNames };
}
function touchUserPresence(){
  const user = currentUser();
  if(!user || (user.role !== 'TEACHER' && user.role !== 'STUDENT')) return;
  const school = getUserSchool();
  if(!school) return;
  const key = 'nibras_' + school + '_db_v1';
  const d = JSON.parse(localStorage.getItem(key) || 'null');
  if(!d) return;
  const t = d.users.find(u => u.id === user.id);
  if(t){
    t.lastSeenAt = new Date().toISOString();
    localStorage.setItem(key, JSON.stringify(d));
  }
  // إبلاغ الخادم بالتواجد ليراه المدير من كل الأجهزة (كان محلياً فقط فكانت البطاقة صفراً)
  if(__serverEnabled()){
    fetch(AUTH_API + 'presence', { method: 'POST', keepalive: true, headers: {} }).catch(() => {});
  }
}
// جلب قائمة الحضور اللحظية من الخادم ثم إعادة رسم البطاقة
async function refreshPresence(school){
  if(!__serverEnabled() || !school) return;
  // حارس ضد الحلقة: بعد نجاح حديث (أقل من 5 ثوانٍ) لا نعيد الاستدعاء
  if(__presenceLive && Date.now() - __presenceLive.at < 5000) return;
  try{
    const r = await fetch(AUTH_API + 'presence?school=' + encodeURIComponent(school), { headers: {} });
    if(!r.ok) return;
    const j = await r.json();
    if(j && j.ok && Array.isArray(j.users)){ __presenceLive = { at: Date.now(), users: j.users }; }
    updatePresentNow();
  }catch(e){}
}
function updatePresentNow(){
  const el = document.getElementById('presentNowBox');
  const user = currentUser();
  if(!el || !user || (user.role !== 'ADMIN' && user.role !== 'AGENT')) return;
  const school = getActiveSchool();
  const info = presentNowInfo(school);
  const schoolLabel = 'البنين';
  const teacherWord = 'معلم';
  const sinfo = presentStudentsOnlineInfo(school);
  const studentWord = school === 'BOYS' ? 'طالب' : 'طالب';
  el.innerHTML = `
    <div class="info-card" onclick="showPresentNow()" style="cursor:pointer" title="اضغط لعرض أسماء المتواجدين الآن">
      <div class="muted small" style="font-size:10.5px">🧑‍🏫 المتواجدون الآن — ${schoolLabel}</div>
      <div style="font-size:22px;font-weight:900;color:#4ade80;line-height:1.1">${info.n}</div>
      <div style="font-size:11px;color:#86efac">${teacherWord}</div>

// بناء عمود اليوم الواحد + الرسم الأسبوعي (الإثنين → الجمعة) من أي نسخة قاعدة بيانات
function buildWeekChart(db, idsArr){
  const now = new Date();
  const fmt = dt => dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
  const dayNames = {0:'الأحد',1:'الإثنين',2:'الثلاثاء',3:'الأربعاء',4:'الخميس',5:'الجمعة',6:'السبت'};
  const todayDow = now.getDay();
  const lastMon = new Date(now); lastMon.setDate(now.getDate() - ((todayDow + 6) % 7));
  const ids = Array.from(idsArr || []);
  const weekDays = [];
  for(let i=0; i<5; i++){
    const dt = new Date(lastMon); dt.setDate(lastMon.getDate() + i);
    const ds = fmt(dt);
    const cc = attCountsByDate(db, ds, ids);
    // الأصل الحضور: من لم يُسجَّل له غياب يُعتبر حاضرًا افتراضيًا
    const a = cc.absent;
    const l = cc.late;
    const p = cc.present;
    const total = p + a + l;
    const rate = total>0 ? Math.round((p + l) / total * 100) : 0;
    weekDays.push({ label:dayNames[dt.getDay()], present:p, absent:a, late:l, total, rate });
  }
  const maxDay = Math.max(...weekDays.map(w=>w.total||1));
  const html = weekDays.map(w => {
    const pw = w.total>0 ? w.present/w.total : 0;
    const aw = w.total>0 ? w.absent/w.total : 0;
    const lw = w.total>0 ? w.late/w.total : 0;
    const barH = Math.max(18, w.total/maxDay*60);
    return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px">
      <div style="width:100%;max-width:26px;height:68px;display:flex;flex-direction:column;justify-content:flex-end;background:#f3f4f6;border-radius:4px 4px 0 0;overflow:hidden">
        <div style="height:${pw*barH}px;background:#16a34a;transition:height .3s"></div>
        <div style="height:${aw*barH}px;background:#dc2626;transition:height .3s"></div>
        <div style="height:${lw*barH}px;background:#d97706;transition:height .3s"></div>
      </div>
      <div style="font-size:10px;color:#6b7280">${w.label}</div>
      <div style="font-size:11px;color:#0f766e;font-weight:800" title="نسبة الحضور">${w.rate}%</div>
      <div style="font-size:9px;color:#374151" title="حاضر/غائب/متأخر">${w.present}/${w.absent}/${w.late}</div>
    </div>`;
  }).join('');
  const sig = weekDays.map(w => w.label+':'+w.present+':'+w.absent+':'+w.late+':'+w.rate).join('|');
  return { html, sig };
}
// رسم شهري (مقارنة أسابيع الشهر) من أي نسخة قاعدة بيانات
function buildMonthChart(db, idsArr){
  const now = new Date();
  const fmt = dt => dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
  const ids = Array.from(idsArr || []);
  const year = now.getFullYear(), month = now.getMonth();
  const monthStart = new Date(year, month, 1);
  const monthEnd = new Date(year, month+1, 0);
  const weeks = [];
  let wkStart = new Date(monthStart);
  while(wkStart <= monthEnd){
    const wkEnd = new Date(wkStart); wkEnd.setDate(wkStart.getDate() + 6);
    if(wkEnd > monthEnd) wkEnd.setTime(monthEnd.getTime());
    let presentSum = 0, daysWithRecs = 0;
    const dIter = new Date(wkStart);
    while(dIter <= wkEnd){
      const ds = fmt(dIter);
      const cc = attCountsByDate(db, ds, ids);
      if(cc.records > 0){ presentSum += cc.present + cc.late; daysWithRecs++; }
      dIter.setDate(dIter.getDate() + 1);
    }
    const expected = daysWithRecs * ids.length;
    weeks.push({ label:`${wkStart.getDate()}-${wkEnd.getDate()}`, rate:expected>0?Math.round(presentSum/expected*100):0, total:daysWithRecs });
    wkStart.setDate(wkStart.getDate() + 7);
  }
  const html = weeks.length ? weeks.map(w => {
    const pct = w.rate;
    return `<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
      <span style="width:42px;font-size:11px;color:#6b7280;text-align:left">${w.label}</span>
      <div style="flex:1;height:14px;background:#f3f4f6;border-radius:999px;overflow:hidden">
        <div style="width:${pct}%;height:100%;background:${pct>=75?'#16a34a':pct>=50?'#d97706':'#dc2626'};border-radius:999px;transition:width .3s"></div>
      </div>
      <span style="width:34px;font-size:11px;font-weight:600;color:#374151;text-align:center">${pct}%</span>
    </div>`;
  }).join('') : '';
  const sig = weeks.map(w => w.label+':'+w.rate+':'+w.total).join('|');
  return { html, sig };
}
// رسم فصلي (مقارنة أشهر الفصل الدراسي) من أي نسخة قاعدة بيانات
function buildQuarterChart(db, idsArr){
  const now = new Date();
  const fmt = dt => dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
  const ids = Array.from(idsArr || []);
  const year = now.getFullYear(), month = now.getMonth();
  const quarter = Math.floor(month / 3);
  const mNames = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  const qMonths = [];
  for(let i=0; i<3; i++){
    const m = quarter*3 + i;
    const mStart = new Date(year, m, 1);
    const mEnd = new Date(year, m+1, 0);
    let presentSum = 0, daysWithRecs = 0;
    const dIter = new Date(mStart);
    while(dIter <= mEnd){
      const ds = fmt(dIter);
      const cc = attCountsByDate(db, ds, ids);
      if(cc.records > 0){ presentSum += cc.present + cc.late; daysWithRecs++; }
      dIter.setDate(dIter.getDate() + 1);
    }
    const expected = daysWithRecs * ids.length;
    qMonths.push({ label:mNames[m], rate:expected>0?Math.round(presentSum/expected*100):0, total:daysWithRecs });
  }
  const html = qMonths.length ? qMonths.map(m => {
    const pct = m.rate;
    return `<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
      <span style="width:48px;font-size:11px;color:#6b7280;text-align:left">${m.label}</span>
      <div style="flex:1;height:14px;background:#f3f4f6;border-radius:999px;overflow:hidden">
        <div style="width:${pct}%;height:100%;background:${pct>=75?'#16a34a':pct>=50?'#d97706':'#dc2626'};border-radius:999px;transition:width .3s"></div>
      </div>
      <span style="width:34px;font-size:11px;font-weight:600;color:#374151;text-align:center">${pct}%</span>
    </div>`;
  }).join('') : '';
  const sig = qMonths.map(m => m.label+':'+m.rate+':'+m.total).join('|');
  return { html, sig };
}

/* ============ الطلاب ============ */
// مصدر موحد لعناصر النقاط (ملاحظات + حضور) مع منع الازدواج:
// إذا سُجّل غياب/تأخر في الحضور فتُهمل الملاحظة اليدوية لنفس اليوم حتى لا تُخصم مرتين
const UNDONE_DEDUCTION = -4;
function pointItems(d){
  const items = [];
  const today = todayStr();
  // ===== خصوصية الملاحظات داخل قوائم النقاط =====
  // هذه القائمة تُعرض في تفاصيل نقاط الطالب (showStudentPoints) وفي لوحات
  // أخرى، وكانت تكشف description واسم كاتبة ملاحظات زميلات المعلم.
  // نُسقط ما لا تملكه، ثم نجمعه في سطر واحد بلا نصّ ولا اسم ولا تاريخ — رقم
  // فقط — حتى يبقى «الصافي» المعروض مطابقاً للرصيد الحقيقي للمدير دون كشف
  // أي محتوى. العَلَم hiddenNote يجعل العنصر يُحسَب في الرقم ويُخفى في العرض.
  d.notes.forEach(n => {
    if(n && n.deleted) return;
    const pts = (n.points ?? notePoints(n.type, n.category));
    items.push({ studentId:n.studentId, type:n.type, category:n.category,
      description:NRC_canSeeNote(n) ? n.description : null,
      points:pts, createdBy:n.createdBy, createdAt:n.createdAt, kind:'note',
      hiddenNote: !NRC_canSeeNote(n) });
  });
  d.attendance.forEach(a => {
    const eff = __attEffStatus(a);
    const pts = attendancePoints(eff, a.lateMinutes);
    if(pts !== 0) items.push({ studentId:a.studentId, type:'NEGATIVE', category:eff==='ABSENT'?'الغياب':'التأخر', description:'حسب سجل الحضور ('+a.date+')' + (a.lateMinutes ? ' — ' + a.lateMinutes + ' دقيقة' : ''), points:pts, createdBy:a.createdBy, createdAt:a.date+'T00:00:00.000Z', kind:'att' });
  });
  (d.assignments||[]).forEach(a => {
    if(a && a.deleted) return;
    if(!a.date || a.date > today) return;
    (d.students||[]).forEach(s => {
      if(!s.active || s.classId !== a.classId) return;
      if(s.joinedAt && a.created && a.created < s.joinedAt) return;
      const completed = (a.completedBy||[]).includes(s.id);
      if(completed) return;
      const existingNote = d.notes.find(n => !n.deleted && n.studentId === s.id && n.category === 'عدم إنجاز الواجب' && n.assignmentId === a.id);
      if(!existingNote) items.push({ studentId:s.id, type:'NEGATIVE', category:'عدم إنجاز الواجب', description:'تكليف: ' + (a.title||'بدون عنوان') + ' (' + (a.date||'') + ')', points: UNDONE_DEDUCTION, createdBy:a.teacherId, createdAt:a.date+'T23:59:59.000Z', kind:'assign' });
    });
  });
  const attKeys = new Set(d.attendance.map(a => a.studentId + '|' + a.date + '|' + a.status));
  const doneAssignKeys = new Set((d.assignments||[]).filter(a => !(a && a.deleted)).flatMap(a => (a.completedBy||[]).map(sid => sid + '|' + a.id)));
  const cut = pointsCutoffDate();
  return items.filter(it => {
    if(it.type === 'NEGATIVE' && cut){
      const dt = it.createdAt ? String(it.createdAt).slice(0,10) : '';
      if(dt && dt < cut) return false;
    }
    if(it.kind === 'note' && (it.category === 'الغياب' || it.category === 'التأخر')){
      const date = it.createdAt ? String(it.createdAt).slice(0,10) : '';
      const status = it.category === 'الغياب' ? 'ABSENT' : 'LATE';
      if(date && attKeys.has(it.studentId + '|' + date + '|' + status)) return false;
    }
    if(it.kind === 'assign' && doneAssignKeys.has(it.studentId + '|' + (it.assignmentId||''))) return false;
    // ملاحظة: لا نسقط نقاطًا بسبب اختفاء/تغيّر معرّف المُنشئ من users (تكرار الأسماء أو
    // إعادة التوجيه المركزية للنسخ) — النقطة مسجّلة بمصحفها وتُحتسب مهما تغيّر المُنشئ.
    return true;
  });
}
/* ===== أرصدة النقاط: مصدرها الخادم بعد فلترة الخصوصية =====
   نقاط الطالب تُحسب من كل الملاحظات، والخادم لم يعد يرسل نصّ ملاحظات غير
   المالك. فلو حُسبت محلياً من النسخة المُصفّاة، ناقص مجموع كل معلم بقدر ما
   كتبت زميلاتها وتغيّر ترتيب الطلاب. لذلك نقرأ pointsTotals الذي يحسبه
   الخادم من المخزون الكامل، ونعود للحساب المحلي فقط إذا غاب (وضع بلا خادم). */
function __pointsTotals(){
  try{
    const t = loadDB().pointsTotals;
    return (t && typeof t === 'object' && !Array.isArray(t)) ? t : null;
  }catch(e){ return null; }
}
function studentPointsMap(){
  const srv = __pointsTotals();
  if(srv){
    const m = {};
    for(const sid in srv){ const r = srv[sid]; if(r) m[sid] = r.total; }
    return m;
  }
  const m = {};
  pointItems(loadDB()).forEach(it => {
    m[it.studentId] = (m[it.studentId]||0) + it.points;
  });
  return m;
}
/* تعديل رصيد محلي بعد إضافة/حذف ملاحظة، بلا انتظار السحب التالي.
   لقطة pointsTotals القادمة من الخادم لا تعرف شيئاً عمّا كتبناه توّاً، فالرقم
   على الشاشة يبقى الرصيد القديم حتى يصل الرد التالي. نصحّح الفرق محلياً على
   المدخل الموجود فقط: إن لم تكن للطالب خانة أصلاً فلا نخمّن أساسها، وتركها
   للناسخ التالية (تبدأ من صفر كما كانت). */
function __adjustLocalPoints(sid, delta){
  try{
    if(!sid || !delta) return;
    const d = loadDB();
    const t = d.pointsTotals;
    if(!t || typeof t !== 'object' || Array.isArray(t)) return;
    const r = t[sid];
    if(!r) return;
    const total = (typeof r.total === 'number' ? r.total : 0) + delta;
    const pos = (typeof r.pos === 'number' ? r.pos : 0) + (delta > 0 ? delta : 0);
    const neg = (typeof r.neg === 'number' ? r.neg : 0) + (delta < 0 ? delta : 0);
    // adjustedAt بُصمة أن هذا الرقم تصحيحٌ محلي (إضافة/حذف نقطة قبل رفع الخادم) —
    // يحملها الدمج/السحب إلى لقطة الخادم حتى لا يرتدّ الرقم المعروض لسبق الحفظ.
    t[sid] = { total, pos, neg, adjustedAt: Date.now() };
    saveDB(d);
  }catch(e){}
}
/* حامل أرصدة النقاط المحلية غير المرفوعة بعد:
   1) __pointsUnsyncedStudents(srvNotes, localNotes) — الطلاب اللواتي لهن على هذا
      الجهاز ملاحظة (أو حذفُ ملاحظة) لم يبلغ الخادمَ بعد؛ فرسمُهنّ في الأرصدة المشتقّة
      (pointsTotals) لم يُحتَسب لدى الخادم بعد.
   2) __carryLocalAdjustedPoints(targetPT, localPT, unsynced) — يُدخل قيمة الطلاب
      المحدثات محلياً (ذات adjustedAt) مكان لقطة الخادم في النسخة المدمجة قبل كتابتها.
   السبب: لقطة pointsTotals القادمة من الخادم أقدم من تصحيحات هذا الجهاز المتزامنة مع
   حفظٍ لم يصل بعد. دون هذا الناقل، يعود رقم النقطة الجديدة إلى السابق «فوراً» بعد
   الحفظ (merge النص الصلب obj=sd في __syncPush يحلّ محل pointsTotals بلقطة الخادم)
   فيظهر للحظة أن الملاحظة لم تُسجَّل، حتى يردّ الخادم باحتسابها فعلياً بعد سحبٍ لاحق. */
function __pointsUnsyncedStudents(srvNotes, localNotes){
  const srv = new Map((Array.isArray(srvNotes) ? srvNotes : []).map(n => [n && n.id, n]));
  const out = new Set();
  for(const n of (Array.isArray(localNotes) ? localNotes : [])){
    if(!n || n.id == null) continue;
    const srvN = srv.get(n.id);
    if(srvN){
      // الحذف الناعم لم يبلغ الخادم بعد: الخادم ما زال يحتسب النقطة
      if(n.deleted && !srvN.deleted) out.add(n.studentId);
      continue; // الموجودة عند الخادم يُحتسبها هو — لا نصوّب فوق حسابه
    }
    if(n.studentId) out.add(n.studentId);
  }
  return out;
}
function __carryLocalAdjustedPoints(targetPT, localPT, unsynced){
  try{
    if(!targetPT || !localPT || typeof targetPT !== 'object' || typeof localPT !== 'object') return;
    for(const sid of unsynced){
      if(sid == null) continue;
      const lr = localPT[sid];
      if(!lr || typeof lr !== 'object' || typeof lr.adjustedAt !== 'number') continue;
      targetPT[sid] = JSON.parse(JSON.stringify(lr));
    }
  }catch(e){}
}
function studentPointsSplit(){
  const srv = __pointsTotals();
  if(srv){
    const m = {};
    for(const sid in srv){ const r = srv[sid]; if(r) m[sid] = { pos:r.pos, neg:r.neg }; }
    return m;
  }
  const m = {};
  pointItems(loadDB()).forEach(it => {
    if(!m[it.studentId]) m[it.studentId] = {pos:0, neg:0};
    if(it.points > 0) m[it.studentId].pos += it.points;
    else m[it.studentId].neg += it.points;
  });
  return m;
}
/* ============ 🏆 رائد نبراس — تكريم الطلاب الأكثر تفاعلاً أسبوعيًا ============ */
// عدد المكرمين أسبوعياً — قابلة للتعديل من هنا
const NIBRAS_TOP = 10;
// يوم بداية الأسبوع المدرسي (0=الأحد … 6=السبت) — الاثنين افتراضياً
const NIBRAS_WEEK_START_DOW = 1;
// الحد الأقصى للدخولات المحسوبة للمستخدم في اليوم الواحد (منع التحايل بخروج/دخول متكرر) — للطلاب والمعلمين
const MAX_LOGINS_PER_DAY = 2;
function cappedLoginCount(isoList){
  const perDay = {};
  (isoList || []).forEach(iso => {
    const day = String(iso).slice(0,10);
    perDay[day] = (perDay[day] || 0) + 1;
  });
  return Object.values(perDay).reduce((a,c) => a + Math.min(c, MAX_LOGINS_PER_DAY), 0);
}
let nibrasCache = { key:'', ids:null, list:null };
function nibrasWeekStart(){
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  start.setDate(start.getDate() - ((now.getDay() - NIBRAS_WEEK_START_DOW + 7) % 7));
  return start;
}
function nibrasPioneerData(){
  const d = loadDB();
  const wkStart = nibrasWeekStart();
  const startISO = wkStart.toISOString();
  const loginSig = (d.users||[]).reduce((a,u) => a + (u.loginCount||0), 0);
  const key = localDateKey(wkStart) + '|' + loginSig;
  if(nibrasCache.key === key && nibrasCache.ids) return nibrasCache;
  const activeStudIds = new Set((d.students||[]).filter(s => s.active === undefined || s.active).map(s => s.id));
  const countMap = {};
  (d.users||[]).forEach(u => {
    if(!activeStudIds.has(u.id)) return;
    countMap[u.id] = cappedLoginCount((u.loginHistory||[]).filter(iso => String(iso) >= startISO));
  });
  const studById = sid => (d.students||[]).find(s => s.id === sid);
  const list = Object.keys(countMap).map(id => ({ id, score: countMap[id], s: studById(id) }))
    .filter(x => x.s)
    .sort((a,b) => b.score - a.score || String(a.s.fullName||'').localeCompare(String(b.s.fullName||''),'ar'))
    .slice(0, NIBRAS_TOP);
  nibrasCache = { key, ids: new Set(list.map(x => x.id)), list, _d: d };
  return nibrasCache;
}
