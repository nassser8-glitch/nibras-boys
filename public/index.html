}
function computeReportRows(){
  const d = loadDB();
  const { type, classId, from, to } = reportState;
  const inRange = (dateStr) => (!from || dateStr >= from) && (!to || dateStr <= to);
  let rows = [];
  // المعلم يرى بيانات فصوله فقط (المدير والوكيل يرون الكل)
  const user = currentUser();
  const isAdmin = isManager(user);
  // تقرير الغياب والتأخر خاص بالمدير والوكيل — ويشمل «وكيل الشؤون المدرسية» لأنه يراها كلها
  if((type === 'absence' || type === 'late') && !isAdmin && user?.role !== 'SCHOOL_AGENT') return [];
  const visibleClassIds = new Set(getClassesSorted().map(c => c.id));
  const visibleStudentIds = new Set(getVisibleStudents().map(s => s.id));
  const canSeeClass = cid => isAdmin || visibleClassIds.has(cid);
  const canSeeStudent = sid => isAdmin || visibleStudentIds.has(sid);

  if(type === 'absence' || type === 'late'){
    const statusFilter = type==='absence' ? 'ABSENT' : 'LATE';
    // خانة «المعلمون والإداريون»: تُظهر سجلات غياب/تأخر الكادر (محفوظة على صفة المستخدم
    // لا في d.attendance) بدل الطلاب — تعمل للتقريرين (الغياب يعرض الغياب، والتأخر ظهر التأخر).
    if(classId === 'STAFF'){
      const tTypeLbl = { MORNING:'تأخر صباحي', CLASS:'تأخر عن الحصة', EARLY_LEAVE:'خروج مبكر' };
      const showAbs = statusFilter !== 'LATE';
      const showLate = statusFilter !== 'ABSENT';
      d.users.filter(u => (u.role === 'TEACHER' || isAdminRole(u.role) || u.role === 'ADMIN') && u.active).forEach(t => {
        if(showAbs) (t.absences || []).filter(inRange).sort().reverse().forEach(date => {
          rows.push({ 'التاريخ': date, 'الطالب': (t.name || '—'), 'الرقم': '—', 'الصف': 'المعلمون والإداريون', 'الفصل': '—', 'الحالة': 'غائب' });
        });
        if(showLate) (t.markedLate || []).filter(inRange).sort().reverse().forEach(date => {
          const mins = t.lateMinutes ? t.lateMinutes[date] : null;
          const typeLbl = t.lateType && t.lateType[date] ? (tTypeLbl[t.lateType[date]] || '') : '';
          rows.push({ 'التاريخ': date, 'الطالب': (t.name || '—'), 'الرقم': '—', 'الصف': 'المعلمون والإداريون', 'الفصل': '—', 'الحالة': 'متأخر' + (typeLbl ? ' — ' + typeLbl : '') + (mins != null && mins > 0 ? ' (' + mins + ' دقيقة)' : '') });
        });
      });
      rows.sort((a,b) => String(b['التاريخ']||'').localeCompare(String(a['التاريخ']||'')));
    } else {
      rows = d.attendance
        .filter(a => canSeeClass(a.classId) && (!classId || a.classId===classId) && (!statusFilter || __attEffStatus(a)===statusFilter) && inRange(a.date))
        .sort((a,b) => b.date.localeCompare(a.date))
        .map(a => { const s = studentById(a.studentId); const c = classById(a.classId); const g = c?gradeById(c.gradeId):null;
          return { 'التاريخ':a.date, 'الطالب':s?.fullName||'—', 'الرقم':s?.studentNo||'—', 'الصف':g?.name||'—', 'الفصل':c?.name||'—', 'الحالة':statusLabels[__attEffStatus(a)] }; });
      // غياب/تأخر المعلمين والإداريات: في تقريري الغياب والتأخر يُضاف سجلُّ الكادر
      // (محفوظ على صفة المستخدم لا في d.attendance) — يظهر ضمن «كل الفصول» لأنهم لا يتبعون فصلًا.
      if(statusFilter === 'ABSENT' || statusFilter === 'LATE'){
        const tTypeLbl = { MORNING:'تأخر صباحي', CLASS:'تأخر عن الحصة', EARLY_LEAVE:'خروج مبكر' };
        d.users.filter(u => (u.role === 'TEACHER' || isAdminRole(u.role) || u.role === 'ADMIN') && u.active).forEach(t => {
          const dates = (statusFilter === 'ABSENT' ? (t.absences || []) : (t.markedLate || [])).filter(inRange);
          dates.sort().reverse().forEach(date => {
            const mins = statusFilter === 'LATE' && t.lateMinutes ? t.lateMinutes[date] : null;
            const typeLbl = statusFilter === 'LATE' && t.lateType && t.lateType[date] ? (tTypeLbl[t.lateType[date]] || '') : '';
            rows.push({ 'التاريخ': date, 'الطالب': (t.name || '—'), 'الرقم': '—', 'الصف': tl('المعلمون'), 'الفصل': '—', 'الحالة': statusFilter === 'ABSENT' ? 'غائب' : ('متأخر' + (typeLbl ? ' — ' + typeLbl : '') + (mins != null && mins > 0 ? ' (' + mins + ' دقيقة)' : '')) });
          });
        });
        rows.sort((a,b) => String(b['التاريخ']||'').localeCompare(String(a['التاريخ']||'')));
      }
    }
  } else if(type === 'notes'){
    rows = d.notes
      .filter(n => { const s = studentById(n.studentId); return !n.deleted && NRC_canSeeNote(n) && canSeeStudent(n.studentId) && (!classId || s?.classId===classId) && (!from && !to || inRange(n.createdAt.slice(0,10))); })
      .sort((a,b) => b.createdAt.localeCompare(a.createdAt))
      .map(n => { const s = studentById(n.studentId); const by = userById(n.createdBy);
        const pts = n.points ?? notePoints(n.type, n.category);
        return { 'التاريخ':n.createdAt.slice(0,10), 'الطالب':s?.fullName||'—', 'النوع':noteTypeLabels[n.type], 'الفئة':n.category, 'الوصف':n.description, 'بواسطة':by?.name||'—', 'النقاط':(pts>0?'+':'')+pts }; });
  } else if(type === 'transfers'){
    rows = d.transfers
      .filter(t => { const ss = studentIdsOf(t).map(id => studentById(id)).filter(Boolean); return ss.some(s => canSeeStudent(s.id) && (!classId || s?.classId===classId)) && (!from && !to || inRange(t.createdAt.slice(0,10))); })
      .sort((a,b) => b.createdAt.localeCompare(a.createdAt))
      .map(t => { const ss = studentIdsOf(t).map(id => studentById(id)).filter(Boolean); const by = userById(t.createdBy);
        return { 'التاريخ':t.createdAt.slice(0,10), 'الطالب': ss.map(s=>s?.fullName||'—').join('، ') || '—', 'إلى':targetLabel(t.target), 'الأولوية':priorityLabels[t.priority], 'السبب':t.reason, 'الحالة': t.status==='PENDING'?'قيد المتابعة':'تم الحل', 'بواسطة':by?.name||'—' }; });
  } else if(type === 'assignments'){
    const user = currentUser();
    // نفس فصول «خانة التكليفات» للمعلم (التكليف يخص الفصل لا مالك الحساب)؛
    // المدير/الوكيل/الشموليون يرون كل الفصول.
    const myClassIds = new Set((user && !seesAllClasses(user)) ? getAssignmentClassIds(user, d) : getClassesSorted().map(c => c.id));
    const clsAss = (d.assignments||[]).filter(a => myClassIds.has(a.classId) && !(a && a.deleted) && (!classId || a.classId===classId) && (!from && !to || (a.date && inRange(a.date))));
    const rowsAll = clsAss.sort((a,b) => (b.created||0) - (a.created||0)).map(a => {
      const cls = classById(a.classId);
      const g = cls ? gradeById(cls.gradeId) : null;
      const clsStudents = d.students.filter(s => s.active && s.classId === a.classId);
      const doneCount = clsStudents.filter(s => (a.completedBy||[]).includes(s.id)).length;
      const notDone = clsStudents.length - doneCount;
      const pct = clsStudents.length ? Math.round(doneCount/clsStudents.length*100) : 0;
      const notDoneNames = clsStudents.filter(s => !(a.completedBy||[]).includes(s.id)).map(s => s.fullName||'—').join('، ');
      return { 'التكليف': a.title||'—', 'المادة': a.subject||'—', 'النوع': a.type||'واجب', 'التاريخ': a.date||'—', 'الصف': g?.name||'—', 'الفصل': cls?.name||'—', 'العدد': clsStudents.length, 'نفّذوا': doneCount, 'لم ينفّذوا': notDone, 'النسبة': pct+'%', 'من لم ينفّذوا': notDoneNames || '—' };
    });
    return rowsAll;
  } else if(type === 'messages'){
    rows = aliveMsgs(loadAdminMsgs())
      .filter(m => inRange(m.createdAt.slice(0,10)))
      .sort((a,b) => b.createdAt.localeCompare(a.createdAt))
      .map(m => {
        const st = m.dismissed ? 'أُخفيت' : (m.revealed ? 'اطّلع على المحتوى' : 'لم يُفتح');
        return { 'التاريخ': m.createdAt.slice(0,10), 'الوقت': fmtTime(m.createdAt), 'المرسل': m.senderName || tl(roleLabels[m.senderRole] || m.senderRole || '—'), 'المرسل إليه': m.teacherName || (m.teacherId==='ALL' ? tl('جميع المعلمين') : '—'), 'الرسالة': m.text, 'الاطلاع': Object.keys(m.seenBy||{}).length||0, 'الحالة': st, 'أخفاها': m.dismissedBy || '—' };
      });
  } else if(type === 'activities'){
    const inActs = (d.activities || []).filter(a => inRange(a.date));
    const total = inActs.length;
    const teachers = d.users.filter(u => (u.role === 'TEACHER' || u.role === 'COUNSELOR') && u.active).sort((a,b) => String(a.name).localeCompare(String(b.name)));
    rows = teachers.map(tc => {
      const mine = inActs.filter(a => isActivityParticipant(a, tc.id));
      const pct = total ? Math.round(mine.length / total * 100) : 0;
      return { 'المشارك': tc.name, 'عدد الأنشطة المشارك فيها': mine.length, 'الأنشطة المشارك فيها': mine.length ? mine.map(a => a.name).join('، ') : '—', 'إجمالي الأنشطة': total, 'نسبة المشاركة': pct + '%' };
    }).sort((a,b) => (parseInt(b['عدد الأنشطة المشارك فيها'])||0) - (parseInt(a['عدد الأنشطة المشارك فيها'])||0));
  } else if(type === 'maintenance'){
    rows = (d.maintenance || [])
      .filter(m => inRange(m.date))
      .sort((a,b) => String(b.date).localeCompare(String(a.date)))
      .map(m => ({
        'الرقم': m.id || '—',
        'التاريخ': m.date || (m.createdAt || '').slice(0,10),
        'الموقع': m.location || '—',
        'النوع': m.type || '—',
        'التصنيف': m.category || '—',
        'الأولوية': m.priority || '—',
        'الحالة': m.status || '—',
        'التكلفة': Number(m.cost || 0).toLocaleString('ar-SA') + ' روبية',
        'المبلِّغ': m.createdByName || '—',
        'الوصف': m.description || '—'
      }));
  } else if(type === 'teacher_logins'){
    // تقرير دخول المعلمين: آخر دخول لكل معلم + عدد الدخولات في الفترة المختارة
    const pr = engagementPeriodRange(reportState.period);
    const eIn = ds => (!pr.from || ds >= pr.from) && (!pr.to || ds <= pr.to);
    const now = new Date();
    const todayKey = localDateKey(now);
    const teachers = d.users.filter(u => u.role === 'TEACHER' && u.active).sort((a,b) => String(a.name).localeCompare(String(b.name),'ar'));
    rows = teachers.map(tc => {
      const logins = (tc.loginHistory || []).slice();
      const periodLogins = logins.filter(iso => eIn(String(iso).slice(0,10)));
      const inPeriod = cappedLoginCount(periodLogins);
      const inToday = logins.some(iso => String(iso).slice(0,10) === todayKey);
      let lastLogin = null, lastTime = '—';
      if(tc.lastLogin){
        lastLogin = tc.lastLogin;
        lastTime = fmtTime(lastLogin);
      } else if(logins.length){
        lastLogin = logins[logins.length-1];
        lastTime = fmtTime(lastLogin);
      }
      return {
        'المعلم': tc.name,
        'الحساب': 'مفعّل',
        'آخر دخول': lastTime,
        'دخلت اليوم': inToday ? 'نعم' : 'لا',
        'دخولات الفترة': inPeriod,
        'إجمالي الدخولات (المحدود)': cappedLoginCount(logins),
        '__lastISO': lastLogin || '',
      };
    }).sort((a,b) => String(a['__lastISO']).localeCompare(String(b['__lastISO'])))
    .reverse()
    .map(({ __lastISO, ...r }) => r);
  } else if(type === 'points_detail'){
    // تشخيص: تفاصيل سجلات النقاط (الملاحظات) لكل طالب — بدون Console. يساعد في معرفة إن كانت
    // النقاط محفوظة فعلاً ومصدرها، أو أن شيئاً من حسابها يسقطها.
    const studById = sid => (d.students || []).find(s => s.id === sid);
    const userById = uid2 => (d.users || []).find(u => u.id === uid2);
    const classById = cid => (d.classes || []).find(c => c.id === cid);
    const all = (d.notes || []).filter(n => !n.deleted).slice().sort((a,b) => String(b.createdAt||'').localeCompare(String(a.createdAt||''))).slice(0, 400);
    rows = all.map(n => {
      const s = studById(n.studentId);
      const owner = userById(n.createdBy);
      const isOrphan = !s || !owner;
      return {
        'التاريخ': n.createdAt ? String(n.createdAt).slice(0,10) : '—',
        'الطالب': s ? (s.fullName || s.name) : (n.studentId || '—'),
        'الفصل': (s && classById(s.classId)) ? classLabel(classById(s.classId)) : '—',
        'الحالة': s ? (owner ? '✅ مرتبطة' : '⚠️ بلا معلم') : (owner ? '⚠️ بلا طالب' : '⚠️ معرف بائد'),
        'الفئة': n.category || '—',
        'النوع': n.type === 'POSITIVE' ? '🟢 إيجابي' : (n.type === 'NEGATIVE' ? '🔴 سلبي' : (n.type||'—')),
        'النقاط': n.points,
        'المصدر': owner ? owner.name : (n.createdBy ? ('⚠️ ' + n.createdBy) : '—'),
        'وصف': escapeHtml(String(n.description||'').slice(0, 60)),
        '_orphan': isOrphan,
        '_noteId': n.id,
        '__stuId': n.studentId,
        '__ts': n.createdAt || '',
      };
    }).sort((a,b) => String(b['__ts']).localeCompare(String(a['__ts'])))
    .map(({ __stuId, __ts, ...r }) => r);
  } else if(type === 'sync_log'){
    // تشخيص: سجل الحفظ والرفع من هذا المتصفح — يبيّن هل وصلت النقطة للخادم أم رُفضت/فشلت،
    // ومتى أعاد سحبٌ الكتابة فوقها. يُدوَّن عبر __syncLogAdd أثناء addNote/__syncPush/__syncPull.
    const evLabel = {
      'note-saved': '💾 حفظ نقطة محلياً',
      'push-ok': '☁️ رُفعت للخادم',
      'push-fail': '❌ فشل رفع للخادم',
      'pull-replace-fresh': '🔄 سحب استبدل النسخة المحلية',
      'pull-merged': '🔀 سحب دمج مع الخادم',
    };
    rows = __syncLogRead().slice().reverse().slice(0, 300).map(e => {
      const teacherName = (eByCurrentUsers(e)) || '';
      const notePayload = e.ev === 'note-saved'
        ? ('عدد النقاط: ' + (e.count || 0) + (e.cat ? ' — ' + e.cat : '') + (e.type ? ' (' + (e.type === 'NEGATIVE' ? 'سلبية' : 'إيجابية') + ')' : ''))
        : (e.ev === 'push-ok' || e.ev === 'push-fail')
          ? ('ملاحظات: ' + (e.notes ?? '?') + ' | حضور: ' + (e.att ?? '?'))
          : (e.ev === 'pull-merged')
            ? ('كان محلياً: ' + e.notesLocal + ' | في الخادم: ' + e.notesServer + ' | الناتج: ' + e.notesOut)
            : (e.ev === 'pull-replace-fresh' ? ('ملاحظات الخادم: ' + (e.notes ?? '?')) : '');
      return {
        'الوقت': fmtTime(e.at),
        'الحدث': evLabel[e.ev] || e.ev,
        'التفاصيل': notePayload,
        'المدرسة': e.school || '',
        'بواسطة': (e.byName || teacherName || '—'),
        '__at': e.at,
      };
    }).sort((a,b) => String(b['__at']).localeCompare(String(a['__at'])))
    .map(({ __at, ...r }) => r);
  } else if(type === 'teacher_engagement'){
    const pr = engagementPeriodRange(reportState.period);
    const eIn = ds => (!pr.from || ds >= pr.from) && (!pr.to || ds <= pr.to);
    const teachers = d.users.filter(u => u.role === 'TEACHER' && u.active).sort((a,b) => String(a.name).localeCompare(String(b.name),'ar'));
    rows = teachers.map(tc => {
      const id = tc.id;
      const att = d.attendance.filter(a => a.createdBy === id && eIn(a.date)).length;
      const notes = d.notes.filter(n => n.createdBy === id && !n.deleted && eIn(n.createdAt.slice(0,10))).length;
      const trans = d.transfers.filter(t => t.createdBy === id && eIn(t.createdAt.slice(0,10))).length;
      const actsCreated = (d.activities || []).filter(a => a.createdBy === id && eIn((a.createdAt || '').slice(0,10))).length;
      const actsJoined = (d.activities || []).filter(a => isActivityParticipant(a, id) && eIn((a.createdAt || '').slice(0,10))).length;
      const vids = (d.videos || []).filter(v => v.createdBy === id && eIn((v.createdAt || '').slice(0,10))).length;
      const esc = (d.escapeAlerts || []).filter(e => e.teacherId === id && eIn((e.createdAt || '').slice(0,10))).length;
      const total = att + notes*2 + trans*2 + actsCreated*3 + actsJoined*2 + vids + esc*2;
      return { 'المعلم': tc.name, 'الحضور المسجل': att, 'الملاحظات': notes, 'التحويلات': trans, 'أنشطة منشأة': actsCreated, 'مشاركة أنشطة': actsJoined, 'فيديوهات': vids, 'تنبيهات هروب': esc, 'إجمالي التفاعل': total };
    }).sort((a,b) => b['إجمالي التفاعل'] - a['إجمالي التفاعل'] || String(a['المعلم']).localeCompare(String(b['المعلم']),'ar'));
  }
  return rows;
}
function __cleanupOrphanPointRows(){
  const d = loadDB();
  const studIds = new Set((d.students||[]).map(s => s.id));
  const userIds = new Set((d.users||[]).map(u => u.id));
  const orphan = (d.notes||[]).filter(n => !n.deleted && (!studIds.has(n.studentId) || !userIds.has(n.createdBy)));
  const noteIds = new Set(orphan.map(n => n.id));
  if(!orphan.length){ window.__teacherMsg = 'لا توجد سجلات معزولة — كل النقاط مرتبطة بطالب ومعلم مسجلتين بالبنين.'; renderApp(); return; }
  if(!confirm(`🔄 أولاً آمن: عُزلت ${orphan.length} سجلَّات نقاط (بلا طالب مسجلة أو بلا معلم مسجلة في قسم البنين). مسحها يزيلها من الخادم نهائياً — ولا يمسّ أي طالب مسجلة في قائمة البنين. متابعة؟`)) return;
  if(!confirm(`تأكيد نهائي: حذف ${orphan.length} سجلّ صحيح؟ (عادة = بيانات قديمة بلا طالب مسجلة)`)) return;
  const me = currentUser();
  (d.notes||[]).forEach(n => { if(noteIds.has(n.id)){ n.deleted = true; n.deletedAt = new Date().toISOString(); n.deletedBy = me ? me.id : ''; } });
  saveDB(d);
  const msg = `تم مسح ${orphan.length} سجلّاً معزولاً — الباقي كله أسماء طلاب مسجلين ومعلمين مسجلين.`;
  if(__serverEnabled()){
    __syncSchedule(getActiveSchool(), 0);
    setTimeout(() => { window.__teacherMsg = msg + ' (جارٍ رفع الخادم)'; renderApp(); }, 350);
  } else {
    window.__teacherMsg = msg;
    renderApp();
  }
}
function engagementPeriodRange(period){
  const now = new Date();
  const today = localDateKey(now);
  const y = now.getFullYear(), m = now.getMonth();
  if(period === 'day') return { from: today, to: today };
  if(period === 'week'){
    const mon = new Date(now);
    mon.setDate(now.getDate() - ((now.getDay() + 6) % 7));
    return { from: localDateKey(mon), to: today };
  }
  if(period === 'month') return { from: y + '-' + String(m+1).padStart(2,'0') + '-01', to: today };
  if(period === 'term'){
    let from;
    if(m >= 8) from = y + '-09-01';                 // الفصل الأول: سبتمبر–نوفمبر
    else if(m === 11) from = y + '-12-01';          // الفصل الثاني: ديسمبر–فبراير
    else if(m <= 1) from = (y-1) + '-12-01';        // يناير–فبراير: بداية الفصل الثاني
    else from = y + '-03-01';                       // الفصل الثالث: مارس–يونيو
    return { from, to: today };
  }
  return { from: (m >= 8 ? y : y-1) + '-09-01', to: today }; // من بداية العام الدراسي (سبتمبر)
}
function renderReportTable(rows){
  if(rows.length === 0) return `<div class="card" style="text-align:center;padding:32px;color:#9ca3af">لا توجد بيانات مطابقة</div>`;

  return `<div class="card table-card"><table class="data-table"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r => `<tr>${cols.map(c=>`<td>${escapeHtml(r[c])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;

// أي عمود يُجمَّع عليه الرسم البياني حسب نوع التقرير
const reportChartCol = { absence:'الصف', late:'الصف', notes:'الطالب', transfers:'إلى', messages:'الحالة', activities:null, maintenance:'الحالة' };
function buildChartData(type, rows){
  if(type === 'activities'){
    return rows.map(r => ({ label: r['المشارك'], value: parseInt(r['عدد الأنشطة المشارك فيها']) || 0 }));
  }
  if(type === 'teacher_engagement'){
    return rows.map(r => ({ label: r['المعلم'], value: parseInt(r['إجمالي التفاعل']) || 0, unit:'' }));
  }
  if(type === 'notes'){
    const sums = {};
    rows.forEach(r => { const k = r['الطالب'] || '—'; const v = parseInt(r['النقاط']) || 0; sums[k] = (sums[k]||0) + v; });
    return Object.entries(sums).map(([label, value]) => ({ label, value, color: value >= 0 ? '#16a34a' : '#dc2626' }));
  }
  const col = reportChartCol[type];
  const counts = {};
  rows.forEach(r => { const k = r[col] || '—'; counts[k] = (counts[k]||0) + 1; });
  return Object.entries(counts).map(([label, value]) => ({ label, value }));
}
function renderBars(data){
  if(data.length === 0) return '<p class="muted small">لا توجد بيانات</p>';
  const vals = data.map(d => d.value);
  const max = Math.max(...vals, 1);
  const min = Math.min(...vals, 0);
  const span = (max - min) || 1;
  const barColor = (d,i) => d.color || chartColors[i%chartColors.length];
  const valColor = v => v >= 0 ? '#16a34a' : '#dc2626';
  return `<div class="card"><div style="padding:6px">` + data.map((d,i)=> {
    const w = Math.max(2, (d.value - min)/span*100);
    return `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
      <span style="width:150px;font-size:13px;color:#374151;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(d.label)}</span>
      <div style="flex:1;height:26px;background:#f3f4f6;border-radius:6px;overflow:hidden;position:relative">
        ${min < 0 ? `<div style="position:absolute;left:${(0-min)/span*100}%;top:0;bottom:0;width:2px;background:#d1d5db;z-index:2"></div>` : ''}
        <div style="width:${w}%;height:100%;background:${barColor(d,i)};border-radius:6px;transition:width .4s"></div>
      </div>
      <span style="width:64px;font-size:13px;font-weight:700;color:${valColor(d.value)};text-align:center">${d.value>0?'+':''}${d.value}${d.unit||''}</span>
    </div>`;
  }).join('') + `</div></div>`;
}
function renderPie(data){
  if(data.length === 0) return '<p class="muted small">لا توجد بيانات</p>';
  const total = data.reduce((s,d)=>s+Math.abs(d.value),0) || 1;
  let acc = 0;
  const stops = data.map((d,i)=>{
    const from = acc/total*100; acc += Math.abs(d.value);
    const to = acc/total*100;
    return `${d.color || chartColors[i%chartColors.length]} ${from}% ${to}%`;
  }).join(',');
  const legend = data.map((d,i)=>`
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
      <span style="width:14px;height:14px;border-radius:4px;background:${d.color || chartColors[i%chartColors.length]}"></span>
      <span style="font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(d.label)}</span>
      <span style="font-size:13px;font-weight:700;color:${d.value>=0?'#16a34a':'#dc2626'}">${d.value>0?'+':''}${d.value} (${Math.round(Math.abs(d.value)/total*100)}%)</span>
    </div>`).join('');
  return `<div class="card"><div style="display:flex;align-items:center;gap:28px;flex-wrap:wrap;padding:12px">
    <div style="width:180px;height:180px;border-radius:50%;background:conic-gradient(${stops});position:relative;flex-shrink:0">
      <div style="position:absolute;inset:40px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;color:#374151;font-size:20px">${total}</div>
    </div>
    <div style="flex:1;min-width:220px">${legend}</div>
  </div></div>`;
}
function renderReportResult(rows){
  if(reportState.type === 'teacher_engagement') return renderColumns(buildChartData(reportState.type, rows));
  if(reportState.view === 'bars') return renderBars(buildChartData(reportState.type, rows));
  if(reportState.view === 'pie') return renderPie(buildChartData(reportState.type, rows));
  return renderReportTable(rows);
}
function renderColumns(data){
  if(data.length === 0) return '<p class="muted small">لا توجد بيانات</p>';
  const max = Math.max(...data.map(d => d.value), 1);
  return `<div class="card"><div style="display:flex;align-items:flex-end;gap:8px;height:260px;padding:16px 12px 0;overflow-x:auto;direction:rtl">

      const h = Math.round(d.value / max * 100);
      const color = d.color || chartColors[i % chartColors.length];
      return `
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:52px;flex:1">
        <div style="font-size:12px;font-weight:800;color:#16a34a;margin-bottom:4px">${d.value}</div>
        <div title="${escapeHtml(d.label)} — ${d.value}" style="width:80%;height:${h}%;min-height:2px;background:${color};border-radius:6px 6px 0 0"></div>
        <div style="font-size:11px;color:#374151;margin-top:6px;text-align:center;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${escapeHtml(d.label)}">${escapeHtml(d.label)}</div>
      </div>`;
    }).join('')}
  </div></div>`;
}

async function backupLoadList(){
  const el = document.getElementById('backupList');
  if(!el) return;
  try{
    const r = await fetch('/api/backups');
    const j = await r.json();
    if(!j || !j.recent){ el.innerHTML = 'تعذر تحميل القائمة'; return; }
    const block = school => {
      const rows = j.recent[school] || [];
      if(!rows.length) return `<div class="muted">لا توجد نسخ بعد — تُنشأ تلقائياً كل 30 دقيقة.</div>`;
      const campus = 'بنين';
      return rows.map(b => `
        <div style="display:flex;align-items:center;gap:10px;justify-content:space-between;padding:7px 0;border-bottom:1px dashed #e2e8f0">
          <span>${campus} — ${(() => { try { return new Date(b.taken_at).toLocaleString('ar'); } catch(e){ return b.taken_at; } })()}</span>
          <button class="del-btn" style="color:#b91c1c" onclick="backupRestore(${b.id}, '${school}')">↩️ استرجاع</button>
        </div>`).join('');
    };
    el.innerHTML = `<div style="font-weight:700;color:#8b5cf6">البنين</div>` + block('BOYS');
  }catch(e){
    el.innerHTML = 'تعذر الاتصال بالخادم';
  }
}
async function backupDownloadAll(){
  const pack = { meta:{ app:'nibras', takenAt:new Date().toISOString(), device:true, description:'نسخة كاملة (بنين)' }, BOYS:null };
  for(const s of ['BOYS']){
    try{
      const r = await fetch(SYNC_API + s);
      const j = await r.json();
      if(j && j.data) pack[s] = { ts: j.ts, data: j.data };
    }catch(e){}
  }
  if(!pack.BOYS){ alert('تعذر جلب البيانات'); return; }
  const blob = new Blob([JSON.stringify(pack, null, 1)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'nibras-backup-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  try{ localStorage.setItem('nibras_lastBackup', new Date().toISOString()); }catch(e){}
}
async function backupRestore(id, school){
  if(!confirm('إعادة بيانات قسم البنين إلى هذه النسخة؟ ستُكتب فوق البيانات الحالية. هل تريد المتابعة؟')) return;
  if(!confirm('تأكيد أخير: أُعدت بيانات القسم فعلاً وستحل مكان الحالية نهائياً؟')) return;
  try{
    const r = await fetch('/api/backups/restore', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ id })
    });
    const j = await r.json();
    if(j.ok){
      alert('تم الاسترجاع — سيتحدّث الجميع تلقائياً بمجرد فتح التطبيق.');
      try{ if(window.__syncPull) __syncPull(school); }catch(e){}
      backupLoadList();
    }else{
      alert('فشل الاسترجاع: ' + (j.error || 'خطأ'));
    }
  }catch(e){
    alert('خطأ في الاتصال بالخادم');
  }
}
async function backupRestoreFromFile(input){
  const el = document.getElementById('backupFileMsg');
  const file = input && input.files && input.files[0];
  if(!file){ return; }
  try{
    const text = await file.text();
    const obj = JSON.parse(text);
    const schools = [];
    if(obj && obj.BOYS && obj.BOYS.data && Array.isArray(obj.BOYS.data.users)) schools.push('BOYS');
    if(!schools.length){ el.textContent = '⚠️ الملف ليس نسخة احتياطية صحيحة (لا يحوي بيانات المستخدمين).'; return; }
    const names = 'البنين';
    if(!confirm('سيُعاد كل شيء (بما فيه الفصول والطلاب والجدول والغياب) لقسم ' + names + ' من هذا الملف، وتُستبدل البيانات الحالية. متابعة؟')){ input.value=''; return; }
    if(!confirm('تأكيد أخير قبل الكتابة فوق البيانات الحالية — متابعة؟')){ input.value=''; return; }
    const done = [];
    for(const s of schools){
      const r = await fetch('/api/backups/import', {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ school: s, data: obj[s].data })
      });
      const j = await r.json();
      done.push('البنين' + (j.ok ? ' ✓' : ' ✗ ' + (j.error || 'خطأ')));
      if(j.ok){ try{ if(window.__syncPull) __syncPull(s); }catch(e){} }
    }
    el.textContent = 'النتيجة: ' + done.join(' — ') + '. أكمل على الأجهزة الأخرى تلقائياً بعد فتح التطبيق.';
    input.value = '';
  }catch(e){
    el.textContent = '⚠️ تعذّر قراءة الملف — تأكد أنه «nibras-backup-… .json» ولم يعدّل.';
  }
}

    ${historySugs.map(s => `
      <div style="font-size:12px;color:#6b7280;padding:4px 0;border-bottom:1px dashed #e5e7eb">${s.status === 'APPROVED' ? '✅' : '❌'} <b>${escapeHtml(s.authorName)}</b> <span class="school-badge ${(s._school||getActiveSchool()).toLowerCase()}">${campusLabels[s._school||getActiveSchool()]}</span> — ${escapeHtml(String(s.text).slice(0,60))}${String(s.text).length>60?'…':''}</div>`).join('')}` : ''}
  </div>` : '';

  const directMsgCard = '';

  return `
  <div class="header-row"><h1 class="page-title">رسالة اليوم — ${schoolNames[school]||''}</h1></div>
  ${currentCard}
  ${editorCard}
  ${suggestCard}
  ${adminInboxCard}
  ${directMsgCard}`;
}
function renderSettings(){
  const school = getActiveSchool();

  const passCard = `
  <div class="card" style="max-width:600px">
    <div style="font-size:14px;font-weight:700;margin-bottom:6px">🔒 تغيير الرقم السري</div>
    <div style="font-size:12.5px;color:#6b7280;margin-bottom:12px">غيّر رقمك السري في أي وقت — يبقى صالحاً للدخول من جميع أجهزتك.</div>
    <div id="passErr" class="error-box" style="display:none"></div>
    <div id="passOk" class="success-box" style="display:none"></div>
    <label>الرقم السري الجديد (8 أحرف على الأقل — حروف وأرقام أو رموز)</label>
    <input id="passNew" class="input" type="password" placeholder="••••••••" autocomplete="new-password" />
    <label>تأكيد الرقم السري الجديد</label>
    <input id="passConfirm" class="input" type="password" placeholder="••••••••" autocomplete="new-password" />
    <button class="btn-primary" style="margin-top:14px" onclick="saveMyPassword()">💾 حفظ الرقم السري</button>
  </div>`;

  const installCard = `
  <div class="card" style="max-width:600px">
    <div style="font-size:14px;font-weight:700;margin-bottom:6px">📲 إضافة التطبيق إلى الشاشة الرئيسية</div>
    <div style="font-size:12.5px;color:#6b7280;margin-bottom:12px">ثبّت نظام نبراس على جهازك لتفتحه كتطبيق مستقل بأيقونة خاصة — يعمل بسرعة حتى دون اتصال.</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px">
      <button class="btn-primary" onclick="doInstallApp()">⬇ تثبيت التطبيق الآن</button>
      <button class="btn-secondary" onclick="openInstallGuide()">📖 دليل التثبيت خطوة بخطوة</button>
    </div>
  </div>`;

  return `
  <div class="header-row"><h1 class="page-title">الإعدادات</h1></div>
  ${passCard}
  ${installCard}`;
}
let __pwdBusy = false;
async function saveMyPassword(){
  if(__pwdBusy) return;
  const s1 = document.getElementById('passNew')?.value || '';
  const s2 = document.getElementById('passConfirm')?.value || '';
  const errEl = document.getElementById('passErr');
  const okEl = document.getElementById('passOk');
  if(errEl) errEl.style.display = 'none';
  if(okEl) okEl.style.display = 'none';
  if(s1.length < 8){ if(errEl){ errEl.style.display = 'block'; errEl.textContent = 'الرقم السري يجب أن يكون 8 أحرف على الأقل'; } return; }
  if(/[^A-Za-z0-9@#$%^&*!._\-+=]/.test(s1)){ if(errEl){ errEl.style.display = 'block'; errEl.textContent = 'الرقم السري يحتوي رموزاً غير مسموحة (حروف إنجليزية وأرقام فقط مع @ # $ % ^ & * ! . _ - + =)'; } return; }
  if(!/[A-Za-z]/.test(s1)){ if(errEl){ errEl.style.display = 'block'; errEl.textContent = 'الرقم السري يجب أن يحتوي حرفاً إنجليزياً واحداً على الأقل'; } return; }
  if(s1 !== s2){ if(errEl){ errEl.style.display = 'block'; errEl.textContent = 'الرقمان غير متطابقين'; } return; }
  __pwdBusy = true;
  try{
    if(__serverEnabled()){
      const r = await __api('POST', 'change-password', { newPassword: s1 });
      if(r.status === 200 && r.j && r.j.ok){
        if(r.j.user){ __sessionUser = r.j.user; __mirrorSet(r.j.user); }
        if(document.getElementById('passNew')) document.getElementById('passNew').value = '';
        if(document.getElementById('passConfirm')) document.getElementById('passConfirm').value = '';
        if(okEl){ okEl.style.display = 'block'; okEl.textContent = '✅ تم تغيير الرقم السري بنجاح — ستدخل به من الآن.'; }
        setTimeout(() => { if(okEl) okEl.style.display = 'none'; }, 6000);
        return;
      }
      if(errEl){ errEl.style.display = 'block'; errEl.textContent = r.j && r.j.error === 'weak_password' ? 'الرقم السري ضعيف — 8 أحرف على الأقل مع حروف إنجليزية وأرقام أو رموز' : 'تعذر التغيير — أعد المحاولة'; }
      return;
    }
    if(errEl){ errEl.style.display = 'block'; errEl.textContent = 'عذراً — هذه النسخة المحلية لا تدعم تغيير الرقم السري.'; }
  }catch(e){
    if(errEl){ errEl.style.display = 'block'; errEl.textContent = 'خطأ في الاتصال — أعد المحاولة'; }
  }finally{
    __pwdBusy = false;
  }
}
/* اقتراحات رسالة اليوم: المعلم/الوكيل يقترحون → المدير يوافق → تظهر للجميع */
function suggestionsKey(school){ return 'nibras_' + (school || getActiveSchool()) + '_suggestions_v1'; }
function loadSuggestions(school){
  const sc = school || getActiveSchool();
  try{ const d = loadSchoolDB(sc); if(Array.isArray(d.suggestions)) return d.suggestions; }catch(e){}
  let arr = [];
  try { arr = JSON.parse(localStorage.getItem(suggestionsKey(sc)) || '[]'); } catch(e){ arr = []; }
  return Array.isArray(arr) ? arr : [];
}
// المدير يرى اقتراحات القسم (بنين)، وغيره يرى اقتراحات قسمه فقط
function loadSuggestionsAll(){
  const u = currentUser();
  if(u && u.role === 'ADMIN'){
    return [
      ...loadSuggestions('BOYS').map(s => ({ ...s, _school:'BOYS' })),
    ];
  }
  return loadSuggestions().map(s => ({ ...s, _school: getActiveSchool() }));
}
function saveSuggestions(arr, school){
  const sc = school || getActiveSchool();
  try{ const d = loadSchoolDB(sc); d.suggestions = JSON.parse(JSON.stringify(arr)); d._ts = Date.now(); saveDB(d); }catch(e){}
  try{ localStorage.setItem(suggestionsKey(sc), JSON.stringify(arr)); }catch(e){}
  __syncSchedule(sc, 0);
}
function getAnnouncementFor(school){
  const sc = school || getActiveSchool();
  let mir = null;
  try{
    const d = loadSchoolDB(sc);
    const arr = Array.isArray(d.announcements) ? d.announcements : [];
    if(arr.length){
      const last = arr.slice().sort((a,b) => String(b.updatedAt||'').localeCompare(String(a.updatedAt||'')))[0];
      if(last && last.text) mir = { text: last.text, sender: last.senderName || '' };
    }
  }catch(e){}
  if(mir) return mir;
  const legacy = localStorage.getItem(ANNOUNCEMENT_KEY(sc)) || '';
  return { text: legacy || 'الصلاة على النبي', sender: localStorage.getItem(ANNOUNCEMENT_SENDER_KEY(sc)) || '' };
}
function setAnnouncementFor(school, obj){
  try{ const d = loadSchoolDB(school); d.announcements = obj && obj.text ? [obj] : []; d._ts = Date.now(); saveDB(d); }catch(e){}
  if(obj && obj.text){
    try{ localStorage.setItem(ANNOUNCEMENT_KEY(school), obj.text); }catch(e){}
    if(obj.senderName){ try{ localStorage.setItem(ANNOUNCEMENT_SENDER_KEY(school), obj.senderName); }catch(e){} }
    else { try{ localStorage.removeItem(ANNOUNCEMENT_SENDER_KEY(school)); }catch(e){} }
  } else {
    try{ localStorage.removeItem(ANNOUNCEMENT_KEY(school)); localStorage.removeItem(ANNOUNCEMENT_SENDER_KEY(school)); }catch(e){}
  }
  __syncSchedule(school, 0);
}
function wordCount(text){ return String(text||'').trim().split(/\s+/).filter(Boolean).length; }
function updateSugCount(){
  const el = document.getElementById('sugText');
  const cEl = document.getElementById('sugCount');
  if(!el || !cEl) return;
  const n = wordCount(el.value);
  cEl.textContent = n + ' / 30 كلمة';
  cEl.style.color = n > 30 ? '#dc2626' : '#6b7280';
}
function suggestAnnouncement(){
  const text = (document.getElementById('sugText')?.value || '').trim();
  if(!text){ alert('اكتب عبارة تحفيزية أولاً'); return; }
  const n = wordCount(text);
  if(n > 30){ alert('العبارة التحفيزية لا تزيد على 30 كلمة — كتبت ' + n + ' كلمة'); return; }
  const user = currentUser();
  const arr = loadSuggestions();
  if(arr.some(s => s.authorId === user.id && s.status === 'PENDING')){ alert('لديك اقتراح قيد المراجعة من المدير — انتظر الرد أولاً'); return; }
  arr.push({ id: uid(), authorId: user.id, authorName: user.name, authorRole: user.role, text, words: n, createdAt: new Date().toISOString(), status:'PENDING' });
  saveSuggestions(arr);
  renderApp();
  alert('تم إرسال اقتراحك إلى المدير للموافقة عليه ✅');
}
function approveSuggestion(id){
  const s = loadSuggestionsAll().find(x => x.id === id);
  if(!s || s.status !== 'PENDING') return;
  if(!confirm('اعتماد هذه العبارة كرسالة اليوم؟')) return;
  const school = s._school || getActiveSchool();
  setAnnouncementFor(school, { id: uid(), text: s.text, senderName: s.authorName + ' (' + roleLabel(s.authorRole) + ')', updatedAt: new Date().toISOString() });
  const arr = loadSuggestions(school);
  const t = arr.find(x => x.id === id);
  if(t){ t.status = 'APPROVED'; t.approvedAt = t.decidedAt = new Date().toISOString(); }
  saveSuggestions(arr, school);
  renderApp();
  alert('تم اعتماد العبارة وستظهر في رسالة اليوم للجميع ✅');
}
function rejectSuggestion(id){
  const s = loadSuggestionsAll().find(x => x.id === id);
  if(!s || s.status !== 'PENDING') return;
  /* الزرّ صار «حفظ» لأنه فعلٌ عادي لا عقاب، فلا يصحّ أن يخرج من النافذة
   * كلام الرفض. ويبقى الرفض قراراً نهائياً كما كان. */
  if(!confirm('حفظ هذا الاقتراح في السجل دون اعتماده كرسالة اليوم؟')) return;
  const school = s._school || getActiveSchool();
  const arr = loadSuggestions(school);
  const t = arr.find(x => x.id === id);
  if(t){ t.status = 'REJECTED'; t.rejectedAt = t.decidedAt = new Date().toISOString(); }
  saveSuggestions(arr, school);
  renderApp();
}
function fmtTime(iso){
  try {
    const d = new Date(iso);
    return d.toLocaleDateString('ar-EG') + ' ' + d.toLocaleTimeString('ar-EG', { hour:'2-digit', minute:'2-digit' });
  } catch(e){ return iso; }
}
function saveAnnouncement(){
  const text = document.getElementById('announceText').value.trim();
  const school = getActiveSchool();
  const user = currentUser();
  if(text){ setAnnouncementFor(school, { id: uid(), text, senderName: user ? (user.name || '') : '', updatedAt: new Date().toISOString() }); }
  else {
    try{ const d = loadSchoolDB(school); d.announcements = []; saveDB(d); }catch(e){}
    localStorage.removeItem(ANNOUNCEMENT_KEY(school));
    localStorage.removeItem(ANNOUNCEMENT_SENDER_KEY(school));
    __syncSchedule(school, 0);
  }
  renderApp();
}
</script>
<script>
/* نبراس البنين: لا Service Worker — يُستخدم فقط إلغاء أي حارس/كاش قديم أعلى الصفحة. */
/* ============ لافتة تثبيت التطبيق على الجوال ============ */
var __deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  __deferredInstallPrompt = e;
  maybeShowInstallHint(true);
});
window.addEventListener('appinstalled', function(){
  __deferredInstallPrompt = null;
  removeInstallHint();
  try{ localStorage.setItem('nibrasBoysInstallHintDismissed', '1'); }catch(err){}
});
function removeInstallHint(){
  var el = document.getElementById('installHintBar');
  if(el && el.parentNode) el.parentNode.removeChild(el);
}
function dismissInstallHint(){
  removeInstallHint();
  try{ localStorage.setItem('nibrasBoysInstallHintDismissed', '1'); }catch(err){}
}
function doInstallApp(){
  if(__deferredInstallPrompt){
    __deferredInstallPrompt.prompt();
    __deferredInstallPrompt.userChoice.then(function(){ __deferredInstallPrompt = null; });
  } else {
    var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    if(isIOS){ openInstallGuide(); }
    else { alert('لا يمكن التثبيت من هذا المتصفح — استخدم Google Chrome أو Edge على الجوال.'); }
  }
}
function openInstallGuide(){
  if(!document.body){ setTimeout(openInstallGuide, 300); return; }
  removeInstallHint();
  var ov = document.querySelector('.modal-overlay');
  if(ov) ov.remove();
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.style.alignItems = 'center';
  var step = function(n, t, d){ return '<div style="display:flex;gap:12px;align-items:flex-start;background:#f9fafb;border:1px solid #e5e7eb;border-radius:12px;padding:12px 14px"><div style="width:30px;height:30px;min-width:30px;border-radius:50%;background:linear-gradient(135deg,#0f4f88,#1d7fd6);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px">'+n+'</div><div><div style="font-weight:700;font-size:13.5px;color:#111827">'+t+'</div><div style="font-size:12.5px;color:#6b7280;margin-top:3px;line-height:1.6">'+d+'</div></div></div>'; };
  var html = '';
  if(isIOS){
    html = '<div class="modal-head"><h3>📲 إضافة نبراس إلى شاشة الآيفون</h3><button class="modal-close" onclick="closeInstallGuide()">✕</button></div>' +
      '<div style="display:flex;flex-direction:column;gap:10px">' +
      step('1', 'اضغط زر «مشاركة» ⬆', 'في المتصفح (سفاري) أسفل الشاشة تجد زر المشاركة على شكل مربع مع سهم لأعلى — اضغط عليه.') +
      step('2', 'اختر «إضافة إلى الشاشة الرئيسية»', 'من القائمة المنبثقة ابحث عن خيار «إضافة إلى الشاشة الرئيسية» (Add to Home Screen) واضغط عليه.') +
      step('3', 'اضغط «إضافة»', 'سيُطلب منك تأكيد الاسم — اضغط «إضافة» أعلى اليمين، وستجد الأيقونة على شاشتك الرئيسية.') +
      '</div>';
  } else {
    html = '<div class="modal-head"><h3>📲 تثبيت نبراس على جهازك</h3><button class="modal-close" onclick="closeInstallGuide()">✕</button></div>' +
      '<div style="display:flex;flex-direction:column;gap:10px">' +
      step('1', 'اضغط زر «تثبيت» أدناه', 'سيعرض المتصفح نافذة تأكيد التثبيت.') +
      step('2', 'اضغط «تثبيت» في النافذة', 'ستضاف أيقونة نبراس إلى الشاشة الرئيسية.') +
      '<button class="btn-primary" style="margin-top:4px" onclick="doInstallApp()">⬇ تثبيت التطبيق الآن</button>' +
      '</div>';
  }
  overlay.innerHTML = '<div class="modal-box" style="max-width:460px">' + html + '</div>';
  overlay.onclick = function(e){ if(e.target === overlay) closeInstallGuide(); };
  document.body.appendChild(overlay);
}
function closeInstallGuide(){
  var ov = document.querySelector('.modal-overlay');
  if(ov) ov.remove();
}
function maybeShowInstallHint(force){
  try{
    if(!force && localStorage.getItem('nibrasBoysInstallHintDismissed')) return;
    var standalone = window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
    if(standalone) return;
    if(!document.body){ setTimeout(function(){ maybeShowInstallHint(force); }, 300); return; }
    var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    var isAndroid = /Android/.test(navigator.userAgent);
    var canInstall = __deferredInstallPrompt || isIOS || isAndroid;
    if(!canInstall) return;
    removeInstallHint();
    var d = document.createElement('div');
    d.id = 'installHintBar';
    d.className = 'install-hint';
    var tip = isIOS
      ? 'اضغط زر «مشاركة» ⬆ في المتصفح ثم «إضافة إلى الشاشة الرئيسية»'
      : 'ثبّت التطبيق على جهازك لفتحه من الشاشة الرئيسية';
    d.innerHTML = '<span style="font-size:20px">📲</span><span>' + tip + '</span><button class="btn-primary" style="padding:6px 14px;font-size:13px;flex-shrink:0" onclick="' + (isIOS ? 'openInstallGuide()' : 'doInstallApp()') + '">' + (isIOS ? 'كيف أثبّت؟' : 'تثبيت') + '</button><button class="close" title="إغلاق" onclick="dismissInstallHint()">✕</button>';
    document.body.appendChild(d);
  }catch(e){}
}
setTimeout(function(){ maybeShowInstallHint(false); }, 1200);
</script>
