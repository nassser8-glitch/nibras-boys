<script>
/* حارس الإقلاع: أول سكربت في الصفحة.
   إن لم يقلع التطبيق (بياض بالكامل) نمسح ذاكرة Service Worker ونعيد التحميل مرة
   واحدة فقط؛ فإن تكرر الإقلاع الفاشل نعرض نص الخطأ على الصفحة نفسها بدل
   الصمت — حتى لا يحتاج المستخدم لفتح أدوات المطوّر لمعرفة السبب.
   ملاحظة: لا نمسح localStorage لأنه يحتوي بيانات المدرسة وكل عمل المستخدم. */
window.__nibrasBooted = false;
window.__nibrasBootErr = '';
(function(){
  var KEY = 'nibrasBootRepair_v1';
  var already = false;
  try { already = sessionStorage.getItem(KEY) === '1'; sessionStorage.setItem(KEY, '1'); } catch(_){}
  window.addEventListener('error', function(e){
    if (window.__nibrasBooted) return;
    window.__nibrasBootErr = String((e && (e.message || e.type)) || e || 'unknown error');
  }, true);
  var esc = function(s){
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  };
  setTimeout(function(){
    if (window.__nibrasBooted) return;
    if (!already) {
      try {
        if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations)
          navigator.serviceWorker.getRegistrations().then(function(rs){
            for (var i = 0; i < rs.length; i++) rs[i].unregister();
          });
        if (window.caches && window.caches.keys)
          window.caches.keys().then(function(ks){
            for (var i = 0; i < ks.length; i++) window.caches.delete(ks[i]);
          });
      } catch(_){}
      location.reload();
      return;
    }
    var box = document.createElement('div');
    box.style.cssText = 'max-width:560px;margin:60px auto;padding:22px;border:2px solid #dc2626;border-radius:14px;background:#fff;color:#111;font-family:inherit';
    box.setAttribute('dir', 'rtl');
    box.innerHTML =
      '<div style="font-size:17px;font-weight:800;color:#b91c1c;margin-bottom:8px">' +
      'تعذّر تشغيل التطبيق — أرسل النص لمدير النظام:</div>' +
      '<pre style="white-space:pre-wrap;direction:ltr;text-align:left;font-size:12px;background:#f8fafc;padding:12px;border-radius:8px;overflow:auto;max-height:240px">' +
      esc(window.__nibrasBootErr || 'لا يوجد نص خطأ — تعطّل قبل تسجيل السكربت') +
      '</pre>' +
      '<button onclick="location.reload()" style="margin-top:12px;padding:8px 16px">إعادة المحاولة</button>';
    (document.body || document.documentElement).appendChild(box);
  }, 7000);
})();
</script>

<body>
<div id="app"></div>
<div class="wm" aria-hidden="true">© 2026 ناصر العتيبي — جميع الحقوق محفوظة</div>

<script>
/* ============ طبقة المصادقة والجلسة (خادم آمن) ============ */
const LOCAL_SESSION_KEY = 'nibras_session_v1';
const SCHOOL_KEY = 'nibras_school_v1';
const ANNOUNCEMENT_KEY = s => 'nibras_announcement_'+s+'_v1';
const ANNOUNCEMENT_SENDER_KEY = s => 'nibras_announcement_sender_'+s+'_v1';
function firstNameOf(name){ return String(name || '').trim().split(/\s+/)[0] || ''; }
const ADMIN_MSGS_KEY = s => 'nibras_adminmsgs_'+s+'_v1';
const SESS_MIRROR_KEY = 'nibras_secure_session_v1';
const AUTH_API = '/api/auth/';
const SYNC_API = '/api/db/';
const SETTINGS_API = '/api/settings/';
const SUPERVISION_API = '/api/supervision/';
const NOTES_CLAIM_API = '/api/notes/claim';
const SYNC_INTERVAL = 300000;
const __origSetItem = localStorage.setItem.bind(localStorage);
let __sessionUser = null; // المستخدم الحالي (من الخادم) — المرجع الوحيد للصلاحيات
let __syncTimers = {};
/* نافذة «الدفعة معلّقة» لكل مدرسة: تكتبها __syncSchedule وتقرأها syncPullAll لتمتنع
   عن السحب ما دامت هناك دفعة لم تُرفع بعد. كائن مستقل عن __syncTimers (مؤقّتات). */
let __pushPendingUntil = {};
/* سقف محاولات إعادة الرفع بعد الفشل. بلا حدٍّ كان كل تبويب يعيد الطلب كل 15 ثانية
   إلى الأبد، فتتراكم الطلبات ويضجيج السجل بلا نهاية. نُبقي النسخة المعلّقة في
   التخزين (لا يفقد المستخدم شيئاً) ونتوقف، ثم نستأنف عند عودة الشبكة أو أي تفاعل. */
const __PUSH_MAX_ATTEMPTS = 6;
let __supervisionToday = null;
let __supervisionTodayLoading = false;
let __supervisionTodayFailed = false;
let __supervisionTodayAttempts = 0;
let __supervisionTodayDenied = false; // الخادم رفض الطلب (401/403) — يُعرض سبب واضح بدل تعليق «جار التحميل» إلى الأبد
let __supervisionSchedule = null;
let __supervisionScheduleLoading = false;
let __supervisionScheduleFailed = false;
let __supervisionScheduleAttempts = 0;
let __supervisionScheduleDenied = false; // الخادم رفض الطلب (401/403) — يُعرض سبب واضح بدل تعليق «جار التحميل» إلى الأبد
let __supervisionHistory = null;
let __supervisionDraftSchedule = null; // مسودة العميل: { [dayOfWeek]: Set<teacherId> } — تُبنى من __supervisionSchedule وتُصفَّر بعد الحفظ الناجح
let __supervisionAddOpenDay = null; // اليوم الذي تُعرض له قائمة "+ إضافة مشرف" حاليًا، أو null
const SUPERVISION_MAX_ATTEMPTS = 3; // حد أقصى لمحاولات إعادة التحميل التلقائية لكل تحميل صفحة — يمنع أي حلقة لا نهائية

async function __loadSupervisionToday(force){
  if(!__serverEnabled() || __supervisionTodayLoading) return __supervisionToday;
  const todayKey = new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Karachi'}).format(new Date());
  if(!force && __supervisionToday && __supervisionToday.date === todayKey) return __supervisionToday;
  if(force){ __supervisionTodayFailed = false; __supervisionTodayAttempts = 0; }
  // بعد الوصول للحد الأقصى من المحاولات الفاشلة، لا تُعد المحاولة تلقائيًا (تمنع حلقة renderApp اللانهائية)
  if(__supervisionTodayFailed && __supervisionTodayAttempts >= SUPERVISION_MAX_ATTEMPTS) return __supervisionToday;
  __supervisionTodayLoading = true;
  __supervisionTodayAttempts++;
  try{
    const r = await fetch(SUPERVISION_API + 'today');
    if(r.ok){ __supervisionToday = await r.json(); __supervisionTodayFailed = false; __supervisionTodayDenied = false; }
    else { __supervisionTodayFailed = true; if(r.status === 401 || r.status === 403) __supervisionTodayDenied = true; }
  }catch(e){ __supervisionTodayFailed = true; } finally { __supervisionTodayLoading = false; }
  return __supervisionToday;
}
async function __loadSupervisionSchedule(force){
  if(!__serverEnabled() || __supervisionScheduleLoading) return __supervisionSchedule;
  if(!force && __supervisionSchedule) return __supervisionSchedule;
  if(force){ __supervisionScheduleFailed = false; __supervisionScheduleAttempts = 0; }
  if(__supervisionScheduleFailed && __supervisionScheduleAttempts >= SUPERVISION_MAX_ATTEMPTS) return __supervisionSchedule;
  __supervisionScheduleLoading = true;
  __supervisionScheduleAttempts++;
  try{
    const r = await fetch(SUPERVISION_API + 'schedule');
    if(r.ok){ __supervisionSchedule = await r.json(); __supervisionScheduleFailed = false; __supervisionScheduleDenied = false; }
    else { __supervisionScheduleFailed = true; if(r.status === 401 || r.status === 403) __supervisionScheduleDenied = true; }
  }catch(e){ __supervisionScheduleFailed = true; } finally { __supervisionScheduleLoading = false; }
  return __supervisionSchedule;
}
async function __saveSupervisionSchedule(){
  const user = currentUser();
  if(!user || user.role !== 'ADMIN') return;
  __ensureSupervisionDraft();
  const schedule = [];
  SUPERVISION_DAYS.forEach(day => {
    (__supervisionDraftSchedule[day.dow] || new Set()).forEach(teacherId => {
      schedule.push({ dayOfWeek: day.dow, teacherId });
    });
  });
  const r = await fetch(SUPERVISION_API + 'schedule', {
    method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ school:getActiveSchool(), schedule }),
  });
  if(!r.ok){ alert('تعذر حفظ جدول الإشراف'); return; }
  __supervisionSchedule = await r.json();
  __supervisionDraftSchedule = null; // إعادة بناء المسودة من نسخة الخادم المحفوظة فعليًا
  __supervisionAddOpenDay = null;
  alert('تم حفظ جدول الإشراف ✅');
  renderApp();
}
// يبني مسودة العمل (يوم -> مجموعة معرفات المعلمين) من آخر جدول محمّل من الخادم؛ لا يعيد البناء إذا كانت المسودة موجودة أصلًا حتى لا تُفقد تعديلات لم تُحفظ بعد
function __ensureSupervisionDraft(){
  if(__supervisionDraftSchedule) return;
  __supervisionDraftSchedule = {};
  SUPERVISION_DAYS.forEach(day => { __supervisionDraftSchedule[day.dow] = new Set(); });
  (__supervisionSchedule && __supervisionSchedule.schedule || []).forEach(x => {
    if(__supervisionDraftSchedule[x.dayOfWeek]) __supervisionDraftSchedule[x.dayOfWeek].add(x.teacherId);
  });
}
function __supervisionToggleAddPicker(dow){
  __supervisionAddOpenDay = (__supervisionAddOpenDay === dow) ? null : dow;
  renderApp();
}
function __supervisionAddSelected(dow){
  __ensureSupervisionDraft();
  const boxes = document.querySelectorAll(`[data-supervision-picker="${dow}"] input:checked`);
  boxes.forEach(input => { __supervisionDraftSchedule[dow].add(input.value); });
  __supervisionAddOpenDay = null;
  renderApp();
}
function __supervisionRemoveTeacher(dow, teacherId){
  __ensureSupervisionDraft();
  __supervisionDraftSchedule[dow].delete(teacherId);
  renderApp();
}
async function __checkInSupervision(){
  const r = await fetch(SUPERVISION_API + 'check-in', { method:'POST' });
  if(!r.ok){ alert('تعذر تسجيل المباشرة'); return; }
  await __loadSupervisionToday(true);
  renderApp();
}
async function __recordSupervision(teacherId, checkIn){
  if(!teacherId) return;
  const r = await fetch(SUPERVISION_API + 'record', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ teacherId, checkIn }) });
  if(!r.ok){ const e = await r.json().catch(()=>({})); alert(e.error === 'not_assigned' ? 'هذه المعلم ليست مكلفة بالإشراف اليوم' : 'تعذر حفظ الحالة'); return; }
  await __loadSupervisionToday(true);
  renderApp();
}
// إعادة تحميل بيانات الإشراف من الصفر: يمسح حالة الرفض/الفشل والبيانات القديمة، ثم يرسم
function __reloadSupervision(){
  __supervisionSchedule = null;
  __supervisionScheduleDenied = false;
  __supervisionScheduleFailed = false;
  __supervisionScheduleAttempts = 0;
  __supervisionScheduleLoading = false;
  __supervisionToday = null;
  __supervisionTodayDenied = false;
  __supervisionTodayFailed = false;
  __supervisionTodayAttempts = 0;
  __supervisionTodayLoading = false;
  renderApp();
}
async function __loadSupervisionHistory(){
  try{
    const r = await fetch(SUPERVISION_API + 'history');
    if(r.ok) __supervisionHistory = await r.json();
  }catch(e){}
  renderApp();
}

// وضع الخادم = الجلسة الحقيقية وبيانات قاعدة البيانات؛ وضع العرض/المحلي = نسخة المتصفح فقط
function __serverEnabled(){ return !DEMO_MODE && location.protocol.indexOf('http') === 0; }
// مرآة غير موثوقة (واجهة فقط) للاحتفاظ بالمستخدم عند إعادة التحميل حتى يرد الخادم
function __mirrorSet(u){ try{ sessionStorage.setItem(SESS_MIRROR_KEY, JSON.stringify(u)); }catch(e){} }
function __mirrorGet(){ try{ const j = JSON.parse(sessionStorage.getItem(SESS_MIRROR_KEY) || 'null'); return j || null; }catch(e){ return null; } }
function __mirrorClear(){ try{ sessionStorage.removeItem(SESS_MIRROR_KEY); }catch(e){} }

async function __api(method, path, body){
  const opt = { method, headers: {} };
  if(body){ opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  const resp = await fetch(AUTH_API + path, opt);
  let j = null;
  try{ j = await resp.json(); }catch(e){}
  return { status: resp.status, ok: resp.ok, j };
}
function __handleAuthError(resp){
  if(resp && resp.status === 401){
    __sessionUser = null; __mirrorClear();
    if(location.hash !== '#/login') location.hash = '#/login';
  }
}
async function __restoreSession(){
  if(!__serverEnabled()) return false;
  try{
    const r = await __api('GET', 'me');
    if(r.status === 200 && r.j && r.j.user){ __sessionUser = r.j.user; __mirrorSet(r.j.user); return true; }
    __handleAuthError(r);
  }catch(e){}
  return false;
}

/* ===== إعدادات مشتركة (بداية العام الدراسي) ===== */
const __schoolSettingsCache = {};
async function __getSchoolSettings(school){
  if(!__serverEnabled()) return {};
  if(__schoolSettingsCache[school]) return __schoolSettingsCache[school];
  try{

    // قسمcameobject غير مصفوفة قد يكون خريطة معرّف=>سجل من نسخة قديمة، فنستخرج
    // سجلاته قبل التحويل إلى مصفوفة وإلا فُقدت بيانات حقيقية بصمت.
    try{
      if(obj && typeof obj === 'object'){
        ['users','grades','classes','students','attendance','notes','transfers','maintenance'].forEach(k => {
          if(Array.isArray(obj[k])) return;
          const was = obj[k];
          let salvaged = [];
          if(was && typeof was === 'object'){
            const vals = Object.keys(was).map(id => {
              const rec = was[id];
              if(rec && typeof rec === 'object' && !Array.isArray(rec) && rec.id == null) rec.id = id;

            if(vals.length) salvaged = vals;
          }
          __syncLogAdd({ ev:'push-repair-section', school, section:k, was:typeof was, salvaged:salvaged.length });
          try{ console.warn('[push-repair-section]', school, k, 'typeof=', typeof was, 'salvaged=', salvaged.length); }catch(e){}
          obj[k] = salvaged;

      }
    }catch(e){}
let attempt = 0;
    let lastErr = '';
    const respOf = await (async () => {
      for(; attempt < 3; attempt++){
        let resp = null;
        try{
          resp = await fetch(SYNC_API + school, {
            method:'PUT',
            headers:{ 'Content-Type':'application/json' },
            body: JSON.stringify({ ts: __syncTS(obj) || Date.now(), baseTs: __pushBaseTs, data: obj })

        }catch(e){ resp = null; lastErr = 'network:' + ((e && e.message) || e); }
        if(!resp){ await new Promise(res => setTimeout(res, 1000 * (attempt + 1))); continue; }
        // سبب الرفض: نقرأ رسالة الخادم فتُعرف في السجل وفي التنبيه سبب رفض الدفعة.
        if(resp.status !== 200 && resp.status !== 401 && resp.status !== 403 && resp.status !== 429){

          catch(e){ lastErr = String(resp.status); }
        }

        if(resp.status === 403){

    })();
    if(respOf && respOf.__authBlocked){ st.lastFail = 0; return; }
    if(respOf){
      try{
        const j = await respOf.json();
        if(j && j.ts && obj && typeof obj === 'object') obj._ts = j.ts;
      }catch(e){}
      try{ __origSetItem(key, JSON.stringify(obj)); }catch(e){}
      st.lastOkAt = Date.now();
      st.lastOkTs = __syncTS(obj);
      try{ localStorage.removeItem(pendKey); }catch(e){}
      try{ __clearUnpushed(school); }catch(e){}
      const recovered = st.attempts > 0;
      st.attempts = 0;
      st.lastFail = 0;
      __syncLogAdd({ ev:'push-ok', school, notes:(obj && Array.isArray(obj.notes))?obj.notes.length:0, att:(obj && Array.isArray(obj.attendance))?obj.attendance.length:0, ts:__syncTS(obj), err:(recovered?'recovered':'') });
      if(recovered) __uiToast('✅ عاد الاتصال — حُفظ ما لم يكن قد رُفع.');
      return;
    }
    // فشل الرفع نهائياً: نحتفظ بالتعديلات في نسخة احتياطية محلية ونعيد المحاولة لاحقاً
    st.attempts++;
    st.lastFail = Date.now();
    try{ localStorage.setItem(pendKey, JSON.stringify(obj)); }catch(e){}
    __syncLogAdd({ ev:'push-fail', school, notes:(obj && Array.isArray(obj.notes))?obj.notes.length:0, ts:__syncTS(obj), attempt, err:lastErr });
    if(st.attempts < __PUSH_MAX_ATTEMPTS){
      __syncTimers[school] = setTimeout(() => __syncPush(school), 15000);
      __uiToast('⚠️ تعذّر رفع حفظك للخادم الآن' + (lastErr ? ' (' + lastErr + ')' : '') + ' — سأعيد المحاولة تلقائياً ولا تختفي بياناتك.', true);
    } else {
      // استُنفد السقف: نتوقف عن الطلبات لكن النسخة المعلّقة باقية في التخزين، وبلَغ
      // المستخدم صراحةً حتى لا يظن أن حفظه ضاع. الاستئناف عند عودة الشبكة أو أي
      // تعديل جديد (يستدعي __syncSchedule فيصفّر العدّ عبر __syncResumeAttempts).
      __syncLogAdd({ ev:'push-gave-up', school, attempts: st.attempts, ts:__syncTS(obj) });
      __uiToast('⚠️ تعذّر رفع حفظك للخادم (' + st.attempts + ' محاولات) — بياناتك محفوظة على هذا الجهاز، وسيُعاد المحاولة عند عودة الاتصال أو أي تعديل جديد.', true);
    }
    try{ __noteSaveBanner(true); }catch(e){}
  }catch(e){} finally {
    st.running = false;
  }
}
/* استئناف الرفع بعد توقّفه بسقف المحاولات: تصفير العدّ ثم جدولة فورية.

function __syncResumeAttempts(){
  for(const s of Object.keys(__syncTimers)){
    const st = __pushState(s);
    if(st && st.attempts >= __PUSH_MAX_ATTEMPTS){
      st.attempts = 0;
      try{ __syncLogAdd({ ev:'push-resume', school: s, trigger: 'resume' }); }catch(e){}
      __syncSchedule(s, 0);
    }
  }
}
try{
  if(!window.__syncResumeHook){
    window.__syncResumeHook = true;

    window.addEventListener('focus', ()=>{ try{ __syncResumeAttempts(); }catch(e){} });
  }
}catch(e){}
function __syncPullPaused(){
  // إيقاف مؤقت: يُضبَط من قبل المدير عبر localStorage لأي مدرسة على حدة (مفتاح
  // nibras_pull_pause_until_<school> يحمل طابع زمني حتى متى يوقف السحب).
  for(let __k of Object.keys(localStorage)){
    if(__k.indexOf('nibras_pull_pause_until_') !== 0) continue;

/* هل نتخلى عن نسخة الدفعة المعلّقة (pendKey)؟ الإسقاط فقط لفقدانٍ محقق (لا تُقرأ)
   أو لقِدَمٍ مثبت مُقارنةً بنسخةٍ محليةٍ موجودةٍ فعلاً. غياب النسخة المحلية (بعد
   خروج/إعادة دخول أو مسح تخزين) ليس سبباً للتخلي أبداً: قد تحمل الدفعة نقاطَ
   معلمٍ لم تُرفع بعد — والدفعة تُرفع أولاً ثم يُستأنف السحب. */
function __pendShouldDiscard(pend, local){
  if(!pend || typeof pend !== 'object') return true;
  return !!local && __syncTS(pend) <= __syncTS(local);
}
/* ===== سجلّ «النقاط التي لم ترفع بعد» للجهاز الحالي =====
   يخزّن معرّفات الملاحظات التي أُنشئت على هذا الجهاز ولم يبلغ رفعُها الناجحُ
   الخادمَ بعد. يُملأ عند كل حفظ ملاحظة، ويُفرَّغ عند كل رفعٍ ناجح — فتعرف
   المعلم كم نقطة ما زالت على جهازها فقط (ولم تصل الخادم/الطالب)، بدل أن
   تكتشف اختفاءها بالصدفة. السجلُ لكل جهازٍ على حدة، وهو عرضٌ لا يمس الخادم. */
function __unpushedKey(school){ return 'nibras_' + school + '_unpushed_v1'; }
function __unpushedIds(school){
  try{
    const a = JSON.parse(localStorage.getItem(__unpushedKey(school)) || 'null');
    return Array.isArray(a) ? a : [];
  }catch(e){ return []; }
}
function __markNotesUnpushed(school, ids){
  try{
    const s = new Set(__unpushedIds(school));
    (Array.isArray(ids) ? ids : []).forEach(id => { if(id != null) s.add(String(id)); });
    localStorage.setItem(__unpushedKey(school), JSON.stringify(Array.from(s)));
  }catch(e){}
}
function __clearUnpushed(school){
  try{ localStorage.removeItem(__unpushedKey(school)); }catch(e){}
}
/* تلويحة أعلى صفحة الملاحظات: كم نقطة لم تصل الخادم بعد + زر الرفع الفوري */
function __refreshUnpushedBar(){
  try{
    const bar = document.getElementById('unpushedBar');
    if(!bar) return;
    const me = currentUser();
    if(!me || me.role === 'STUDENT' || !__serverEnabled() || !__syncEnabled()){
      bar.style.display = 'none';
      return;
    }
    const school = getActiveSchool();
    if(!school){ bar.style.display = 'none'; return; }
    const ids = new Set(__unpushedIds(school));
    if(ids.size === 0){ bar.style.display = 'none'; return; }
    const d = loadDB();
    const notes = (d.notes || []).filter(n => n && !n.deleted && ids.has(String(n.id)));
    if(notes.length === 0){
      // الملاحظات المسجلة لم تعد في المخزن (نُقلت/حُذفت) — سجل نظيف
      __clearUnpushed(school);
      bar.style.display = 'none';
      return;
    }
    const pts = notes.reduce((a, n) => a + (n.points ?? notePoints(n.type, n.category)), 0);
    const studs = new Set(notes.map(n => n.studentId).filter(Boolean)).size;
    const txt = document.getElementById('unpushedText');
    if(!txt) return;
    txt.textContent = '⚠️ لديك ' + notes.length + ' نقطة لم تصل لخادم المدرسة بعد (' + (pts > 0 ? '+' : '') + pts + ' على ' + studs + ' طالب) — هي محفوظة على هذا الجهاز ولن تختفي، وستُرفع تلقائيًا.';
    bar.style.display = 'block';
    const btn = document.getElementById('unpushedRetryBtn');
    if(btn) btn.disabled = __forceSyncBusy;
  }catch(e){}
}
/* زر «أعد الرفع الآن»: يدفع فوراً دون انتظار الجدولة — والمعلم ترى النتيجة الصريحة */
let __forceSyncBusy = false;
let __warnedPendingOnOpen = false;
/* تحذير عند فتح التطبيق: إن وُجدت نقاطٌ لم ترفع بعد (على أي صفحة، لا صفحة
   الملاحظات فقط) تُعلم المعلم فور دخولها — مرة واحدة لكل فتح صفحة، فلا
   تلاحظ غياب النقطة صدفةً. يخفُّ النظام مع طوائف الأجيال الجديدة: السجلُّ
   يُملأ عند الحفظ ويُفرَّغ تلقائياً عند أول رفع ناجح. */
function __warnPendingOnOpen(){
  try{
    if(!__serverEnabled() || !__syncEnabled()) return;
    const me = currentUser();
    if(!me || me.role === 'STUDENT') return;
    if(__warnedPendingOnOpen) return;
    const school = getActiveSchool();
    if(!school) return;
    const ids = new Set(__unpushedIds(school));
    if(ids.size === 0) return;
    const d = loadDB();
    const notes = (d.notes || []).filter(n => n && !n.deleted && ids.has(String(n.id)));
    if(notes.length === 0){ __clearUnpushed(school); return; }
    __warnedPendingOnOpen = true;
    const pts = notes.reduce((a, n) => a + (n.points ?? notePoints(n.type, n.category)), 0);
    __noteSaveBanner('⚠️ لديك ' + notes.length + ' نقطة (' + (pts > 0 ? '+' : '') + pts + ') لم تصل لخادم المدرسة بعد — محفوظة على هذا الجهاز ولن تختفي. افتحي صفحة «الملاحظات» واضغطي «أعد الرفع الآن».', true);
  }catch(e){}
}
async function __forceSyncNow(){
  try{
    if(__forceSyncBusy) return;
    const me = currentUser();
    const school = getActiveSchool();
    if(!me || !school || !__serverEnabled() || !__syncEnabled()) return;
    __forceSyncBusy = true;
    __refreshUnpushedBar();
    // إن كان رفعٌ جارٍ الآن فلننتظر انتهاءه لنعيد التقييم على حاله
    for(let w = 0; w < 20; w++){
      if(!__pushState(school).running) break;
      await new Promise(r => setTimeout(r, 300));
    }
    await __syncPush(school);
    const left = __unpushedIds(school).length;
    if(left === 0){
      __noteSaveBanner('✅ رُفعت كل نقاطك للخادم بنجاح — لن تختفي.', false);
    } else {
      __noteSaveBanner('⚠️ ما زالت ' + left + ' نقطة تنتظر الرفع — تحققي من اتصالك وحسابك، وسأعيد المحاولة تلقائيًا.', true);
    }
  }catch(e){
    __noteSaveBanner('⚠️ تعذّر الرفع الآن — نقاطك محفوظة على الجهاز.', true);
  }finally{
    __forceSyncBusy = false;
    __refreshUnpushedBar();
  }
}
async function __syncPull(school){

  if(hasPending){
    __syncSchedule(school, 0);
    return;
  }
  try{
    const resid = await fetch(SYNC_API + school);
    if(resid.status === 401){ __handleAuthError(resid); return; }
    if(!resid.ok) return;
    const j = await resid.json();
    if(!j || !j.data || !j.ts) return;
    const key = 'nibras_'+school.toLowerCase()+'_db_v1';
    const pendKey = 'nibras_'+school.toLowerCase()+'_pending_v1';
    let local = null;
    try{ local = JSON.parse(localStorage.getItem(key) || 'null'); }catch(e){}

      }

    const serverHasData = (j.data.students && j.data.students.length > 0) || (j.data.classes && j.data.classes.length > 0);

    // تعديلات هذا الجهاز المحلية التي لم تصل بعد للخادم (ملاحظات/غياب جديدة بوقت أحدث) —

    // لا نستبدل نسخة محلية ممتلئة بنسخة خادم فارغة لحظياً (مدرسة جديدة أو شريحة معطوبة) —
    // وإلا محى السحبُ كلَ حفظِ المعلم بعد إعادة فتح التطبيق بمجرد صفر عدد الطلاب/الفصول.
    if(!local || localIsEmptySeed){

      const betterItemP = (a, b) => {

      const mergeByIdBetterP = (sdArr, localArr) => {

        for(const x of (Array.isArray(sdArr) ? sdArr : [])) if(x && x.id != null) m.set(x.id, x);
        for(const x of (Array.isArray(localArr) ? localArr : [])){
          if(!x || x.id == null) continue;

      if(Array.isArray(local.activities)) merged.activities = mergeByIdBetterP(merged.activities, local.activities);
      const unionMsgsP = (srvArr, locArr, merge) => {

        for(const x of (Array.isArray(srvArr) ? srvArr : [])) if(x && x.id != null) m.set(x.id, x);

async function __refreshSchool(school){
  if(!__serverEnabled() || !school) return;
  try{
    const resp = await fetch(SYNC_API + school);
    if(!resp.ok) return;
    const j = await resp.json();
    if(j && j.data){
      const key = 'nibras_'+school.toLowerCase()+'_db_v1';
      let local = null;
      try{ const raw = localStorage.getItem(key); if(raw) local = JSON.parse(raw); }catch(e){ local = null; }
      // دمج واعٍ للشواهد: لو كان التكليف محذوفاً محلياً (قبر) لا نعيده حتى لو وصلت نسخة قديمة
      // غير محذوفة من الخادم (سباق: حذف محلي قبل أن يصله الشاهد) — المحذوف يفوز ثم الأعلى _v.
      if(local && typeof local === 'object'){
        const betterP = (a, b) => {
          if(!a) return b;
          if(!b) return a;
          if(!!a.deleted !== !!b.deleted) return a.deleted ? a : b;
          const va = (typeof a._v === 'number') ? a._v : 0;
          const vb = (typeof b._v === 'number') ? b._v : 0;
          if(va !== vb) return va > vb ? a : b;
          const ta = a.created || a.createdAt || 0, tb = b.created || b.createdAt || 0;
          return ta >= tb ? a : b;
        };
        const mergeArr = (sdArr, loArr) => {
          const m = new Map();
          for(const x of (Array.isArray(sdArr) ? sdArr : [])) if(x && x.id != null) m.set(x.id, x);
          for(const x of (Array.isArray(loArr) ? loArr : [])){
            if(!x || x.id == null) continue;
            const ex = m.get(x.id);
            m.set(x.id, betterP(x, ex));
          }
          return Array.from(m.values());
        };
        const out = JSON.parse(JSON.stringify(j.data));
        if(!Array.isArray(out.assignments) && Array.isArray(local.assignments)) out.assignments = [];
        if(Array.isArray(out.assignments)) out.assignments = mergeArr(out.assignments, local.assignments);
        if(Array.isArray(out.activities)) out.activities = mergeArr(out.activities, local.activities);
        if(Array.isArray(out.notes) || Array.isArray(local.notes)){
          out.notes = NRC_mergeNotes(Array.isArray(out.notes) ? out.notes : [], Array.isArray(local.notes) ? local.notes : []);
        }
        out._ts = Math.max((j.data && j.data._ts) || 0, (local && local._ts) || 0, Date.now());
        __origSetItem(key, JSON.stringify(out));
      } else {
        __origSetItem(key, JSON.stringify(j.data));
      }
    }
  }catch(e){}
}

const DEMO_ANCHOR = null; // تاريخ مرجعي (آخر يوم دراسة عند البناء) لتحديث تواريخ العرض التجريبي تلقائياً
const PERSIST_FIRST_SEED = true; // أول تشغيل فقط: زرع البيانات المتوفرة (DEMO_SEED إن وُجد) في التخزين الحقيقي
function __demoYmd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function __demoIsSchool(d){ const w = d.getDay(); return w>=1 && w<=5; }
function __demoShiftDate(ymd, delta){
  const d = new Date(ymd+'T12:00:00');
  d.setDate(d.getDate()+delta);
  while(!__demoIsSchool(d)) d.setDate(d.getDate()+1);

function __demoShiftIso(isoStr, delta){
  const d = new Date(isoStr);

  d.setDate(d.getDate()+delta);
  return d.toISOString();

function __demoResolve(obj, delta){
  if(Array.isArray(obj)){ obj.forEach(x => __demoResolve(x, delta)); return; }
  if(obj && typeof obj === 'object'){
    Object.keys(obj).forEach(k => {
      const v = obj[k];
      if(typeof v === 'string'){
        if(/^\d{4}-\d{2}-\d{2}$/.test(v)) obj[k] = __demoShiftDate(v, delta);
        else if(/^\d{4}-\d{2}-\d{2}T/.test(v)) obj[k] = __demoShiftIso(v, delta);
      } else if(v && typeof v === 'object'){ __demoResolve(v, delta); }
    });
  }
}
function seedPersistentData(){

      let __now = new Date();
      while(!__demoIsSchool(__now)) __now.setDate(__now.getDate()-1);
      __delta = Math.round((__now - __ref)/86400000);

  Object.keys(DEMO_SEED || {}).forEach(school => {
    const key = 'nibras_'+school.toLowerCase()+'_db_v1';
    if(!localStorage.getItem(key)){
      const d = JSON.parse(JSON.stringify(DEMO_SEED[school]));
      if(__delta !== 0) __demoResolve(d, __delta);
      localStorage.setItem(key, JSON.stringify(d));
    }
  });
}

/* تنظيف تلقائي: إزالة حسابات المعلمين المكررة بالاسم (يبقى الحساب الرسمي @nibras.local أو صاحب الفصول) مع دمج فصوله وجدوله وملاحظاته — يعمل في النسخ المحلية فقط */
function __normName(s){ return String(s||'').replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,' ').trim(); }
function dedupeTeacherAccounts(){
  if(__serverEnabled()) return;
  let changedAny = false;
  ['BOYS'].forEach(school => {
    const key = 'nibras_'+school.toLowerCase()+'_db_v1';
    let d = null;
    try{ d = JSON.parse(localStorage.getItem(key) || 'null'); }catch(e){}
    if(!d || !Array.isArray(d.users)) return;
    const groups = {};
    (d.users||[]).forEach(u => { if(u && u.role === 'TEACHER'){ const n = __normName(u.name); (groups[n] = groups[n] || []).push(u); } });
    const dupNames = Object.keys(groups).filter(n => groups[n].length > 1);
    if(!dupNames.length) return;
    const removed = [];
    dupNames.forEach(n => {
      const list = groups[n];
      const score = u =>
        (u.email && /@nibras\.local$/i.test(u.email) ? 4 : 0) +
        (u.active !== false ? 2 : 0) +
        ((d.classes||[]).some(c => (c.teacherIds||[]).includes(u.id)) ? 3 : 0) +
        ((d.timetable||{})[u.id] ? 2 : 0) +
        ((d.notes||[]).some(x => x.createdBy === u.id) ? 1 : 0);
      list.sort((a,b) => (score(b)-score(a)) || (a.id < b.id ? 1 : -1));
      const keep = list[0];
      list.slice(1).forEach(dup => {
        (d.classes||[]).forEach(c => {
          if(!Array.isArray(c.teacherIds)) return;
          const before = c.teacherIds;
          c.teacherIds = before.map(t => t === dup.id ? keep.id : t);
          if(c.teacherIds.some((t,i) => t === keep.id && before[i] === dup.id)) c.teacherIds = [...new Set(c.teacherIds)];
        });
        if(d.timetable && d.timetable[dup.id]){
          d.timetable[keep.id] = d.timetable[keep.id] || {};
          for(const day of Object.keys(d.timetable[dup.id])) d.timetable[keep.id][day] = Object.assign(d.timetable[keep.id][day] || {}, d.timetable[dup.id][day]);
          delete d.timetable[dup.id];
        }
        (d.notes||[]).forEach(x => { if(x.createdBy === dup.id) x.createdBy = keep.id; });
        removed.push(dup.id);
      });
    });
    if(!removed.length) return;
    d.users = d.users.filter(u => !removed.includes(u.id));
    __origSetItem(key, JSON.stringify(d));
    changedAny = true;
  });
  return changedAny;
}

/* ===== خصوصية ملاحظات الطلاب =====
   المالك هو createdBy (معرّف مستخدم ثابت). لا يُشتق من الاسم ولا من الطالب.
   الطبقتان: الخادم (requireAuth + filterNotesForViewer) يمنع الإرجاع أساساً،
   وهذه الطبقة تمنع إحياء أي نسخة قديمة محفوظة في التخزين المحلي.
   ملاحظة بلا createdBy صالح => «غير مملوكة» تُرى للإدارة فقط — لا تُحذف ولا تُنسب. */
function NRC_isAdminNotesRole(me){ return !!me && (me.role === 'ADMIN' || me.role === 'AGENT'); }
// لا يُعدّ الوكيل مالكاً لمجرد قدرته على القراءة: createdBy هو الفيصل.
function NRC_canSeeNote(n, me){
  const u = me || currentUser();
  if(NRC_isAdminNotesRole(u)) return true;
  // الطالب يرى ملاحظاته هي: نقاطهُ وُضعت باسمه (studentId = حسابه).
  if(u && String(u.role || '') === 'STUDENT'){
    return !!(n && n.studentId != null && String(n.studentId) === String(u.id || ''));
  }
  const owner = n && n.createdBy != null ? String(n.createdBy).trim() : '';
  if(!owner) return false;               // غير مملوكة => الإدارة فقط
  return !!u && owner === String(u.id || '');
}
/* هل الملاحظة مملوكة **لشخص محدَّد** غيري؟ (معيار الإزالة من التخزين المحلي)
   - غير مملوكة (بلا createdBy) => false: لا نعرف صاحبتها فلا نحذف شيئاً.
   - مملوكة لي أو للإدارة => false.
   - الطالب: مملوكةٌ غيرها **عنها** (studentId = حسابها) => false: تبقى لتجد
     سبب نقاطها، وما عن غيرها يبقى مملوكاً لغيرها => true.
   - مملوكة لزميلة أخرى => true: تُسقط من عرض هذا الجهاز. */
/* ===== استرداد ملكية ملاحظة قديمة بلا createdBy =====
  Such الملاحظة تبقى محفوظة على جهازها (لا تُطهَّر)، لكن لا تُنسب لأحد ولا
   تُعرض في شاشة الملاحظات. صاحبتها الشرعية تعرف نصّها، فتسجّل مطالبً من
   جهازها؛ والإدارة هي وحدها من يعتمدها فيصبح createdBy صاحبها.
   المطالب لا تكتب createdBy إطلاقاً — لو كانت تفعل لأمكنت أي معلم سرقة
   ملاحظة زميلة بمجرد معرّفها. */
/* ===== حالة «طلبتُها» محلية فقط =====
   لا نكتب ownershipClaims من العميل إطلاقاً: هي سجلّ ييكتبهه الخادم وحده،
   ولو كتبناه محلياً لصار جهازنا مصدراً يمكن تزويره. فنتابع الطلبات بمعرّفات
   في تخزين مستقلّ لا يمرّ في أي دفعة. */
const NOTE_PENDING_KEY = s => 'nibras_notepending_'+s+'_v1';
function NRC_pendingClaimIds(){
  try{ const a = JSON.parse(localStorage.getItem(NOTE_PENDING_KEY(getActiveSchool())) || '[]');
       return new Set(Array.isArray(a) ? a.map(String) : []); }catch(e){ return new Set(); }
}
function NRC_markPendingClaim(noteId){
  try{
    const k = NOTE_PENDING_KEY(getActiveSchool()), a = Array.from(NRC_pendingClaimIds());
    a.push(String(noteId));
    localStorage.setItem(k, JSON.stringify(Array.from(new Set(a))));
  }catch(e){}
}
function NRC_clearPendingClaim(noteId){
  try{
    const k = NOTE_PENDING_KEY(getActiveSchool());
    localStorage.setItem(k, JSON.stringify(Array.from(NRC_pendingClaimIds()).filter(x => x !== String(noteId))));
  }catch(e){}
}
function NRC_noteHasPendingClaim(n){
  return !!n && (Array.isArray(n.ownershipClaims) && n.ownershipClaims.some(c => c && c.status === 'PENDING')
    || NRC_pendingClaimIds().has(String(n.id)));
}
/** ملاحظات بلا مالك قد تكون لي: لا تُعرض في الجدول، لكن زر المطالب متاح. */
function NRC_claimableLegacyNotes(d){
  const me = currentUser();

  return (d && Array.isArray(d.notes) ? d.notes : [])
    .filter(n => n && !n.deleted && !NRC_canSeeNote(n) && !NRC_noteBelongsToOther(n) && !NRC_noteHasPendingClaim(n));
}
async function NRC_requestClaim(noteId){
  if(!noteId) return { ok:false, error:'missing_note_id' };
  if(!confirm('هل هذه الملاحظة لك؟\n\nسيُسجَّل طلب باسمك، ويحدّده المدير قبل أن تصبح ملكيتك. لن تراها في القائمة قبل الاعتماد.')) return { ok:false, error:'cancelled' };
  try{
    const r = await __api('POST', NOTES_CLAIM_API, { school: getActiveSchool(), noteId: String(noteId) });
    if(r.status === 200 && r.j && r.j.ok){
      NRC_markPendingClaim(noteId); // محلياً فقط: يمنع تكرار الزر قبل وصول الرد التالي
      return { ok:true };
    }
    // طلب موجود أصلاً على الخادم: نعتبره «مرسلاً» بدل إزعاج المستخدم برسالة خطأ.
    if(r.status === 409){ NRC_markPendingClaim(noteId); return { ok:true, alreadyPending:true }; }
    return { ok:false, error: (r.j && r.j.error) || ('http_' + r.status) };
  }catch(e){ return { ok:false, error:'network' }; }
}

function NRC_noteBelongsToOther(n, me){
  const u = me || currentUser();
  if(NRC_isAdminNotesRole(u)) return false;
  // الطالب: بقاء ملاحظاته هي على جهازه، وإسقاط ملاحظات غيره.
  if(u && String(u.role || '') === 'STUDENT'){
    return !n || n.studentId == null || String(n.studentId) !== String(u.id || '');
  }
  const owner = n && n.createdBy != null ? String(n.createdBy).trim() : '';
  if(!owner) return false;               // لا مالك معروف => لا تُحذف أبداً
  return !!u && owner !== String(u.id || '');
}
/* صلاحية حذف نقطة/ملاحظة: المعلم لحقّ نقاطها (createdBy) والمدير لأي نقطة.
   النقاط التلقائية من الغياب (بادئتها طولية بلا _auto) والتحويلات/تكليفات تُدار من شاشاتها
   الخاصة — لا تحذف كملاحظات إلا نقاط الإضافة اليدوية. */
function NRC_deletableNote(n, me){
  if(!me) return false;
  if(me.role === 'ADMIN') return true;
  if(me.role !== 'TEACHER') return false;
  return !!n && n.createdBy === me.id;
}

function attendancePoints(status, lateMins){
  if(status === 'ABSENT') return -2; // الغياب
  if(status === 'LATE'){
    var m = parseInt(lateMins, 10) || 0;
    if(m <= 15) return -1;
    if(m <= 30) return -2;
    if(m <= 60) return -3;
    return -4;
  }
  return 0;
}

function ensureDefaultAccounts(){
  if(__serverEnabled()) return; // في وضع الخادم: الحسابات في قاعدة البيانات، لا زرع محلي
  if(DEMO_MODE){
    // نسخة العرض: دمج حسابات البذرة في التخزين المحلي لضمان ظهور كل المعلمين/المعلمين
    // في الدخول السريع — دون الكتابة فوق كلمات المرور التي غيّرها المستخدم.
    if(DEMO_SEED){
      ['BOYS'].forEach(school => {
        const seed = DEMO_SEED[school];
        if(!seed || !seed.users) return;
        const key = 'nibras_' + school + '_db_v1';
        let d;
        try{ d = JSON.parse(localStorage.getItem(key) || 'null'); }catch(e){ d = null; }
        if(!d) d = seedDBFor(school);
        let changed = false;
        seed.users.forEach(su => {
          const ex = d.users.find(u => u.email === su.email);
          if(ex){
            if(!ex.password && su.password){ ex.password = su.password; if(!ex.firstLogin) ex.firstLogin = false; changed = true; }
            if(ex.active !== true){ ex.active = true; changed = true; }
          } else {
            d.users.push(JSON.parse(JSON.stringify(su)));
            changed = true;
          }
        });
        if(changed) localStorage.setItem(key, JSON.stringify(d));
      });
    }
    return;
  }
  const defs = []; // نبراس البنين: لا حسابات جاهزة بأسماء — تُنشأ حسابات الدخول عند إضافتها من الخادم أو يدوياً
  defs.forEach(def => {
    const key = 'nibras_' + def.school + '_db_v1';
    let d = JSON.parse(localStorage.getItem(key) || 'null');
    if(!d){ d = seedDB(); localStorage.setItem(key, JSON.stringify(d)); }
    const existing = d.users.find(u => u.email === def.email);
    if(existing){
      let changed = false;
      if(existing.password !== def.password){ existing.password = def.password; changed = true; }
      if(existing.role !== def.role){ existing.role = def.role; changed = true; }
      if(existing.active !== true){ existing.active = true; changed = true; }
      if(changed) localStorage.setItem(key, JSON.stringify(d));
    } else {
      d.users.push({ id: uid(), name: def.name, email: def.email, password: def.password, role: def.role, active: true, absences: [], markedLate: [] });
      localStorage.setItem(key, JSON.stringify(d));
    }
  });
}

/* تحميل بيانات القسم — نبراس البنين: قسم واحد */
function loadSchoolDB(school){
  const oldKey = localStorage.getItem(SCHOOL_KEY);
  localStorage.setItem(SCHOOL_KEY, school);
  const d = loadDB();
  if(oldKey) localStorage.setItem(SCHOOL_KEY, oldKey); else localStorage.removeItem(SCHOOL_KEY);
  return d;
}
function loadDB(){
  let raw = localStorage.getItem(dbKey());
  if(!raw){ const d = seedDB(); saveDB(d); return d; }
  const d = JSON.parse(raw);
  // ترقية: تحويل teacherId المفرد إلى teacherIds متعدد (عدة معلمين لكل فصل)
  if(Array.isArray(d.classes)){
    d.classes.forEach(c => {
      if(!Array.isArray(c.teacherIds)){
        c.teacherIds = c.teacherId ? [c.teacherId] : [];
        delete c.teacherId;
      }
    });
  }
  // تنظيف تلقائي: سجل حضور واحد لكل طالب في اليوم (حذف المكرر)
  let cleaned = false;
  if(Array.isArray(d.attendance) && d.attendance.length > 1){
    const seen = new Set();
    const uniq = [];
    d.attendance.forEach(a => {
      const key = a.studentId + '|' + a.date;
      if(seen.has(key)){ cleaned = true; return; }
      seen.add(key); uniq.push(a);
    });
    if(cleaned) d.attendance = uniq;
  }
  // تنظيف تلقائي: حذف كل الإدخالات في أيام العطلة (الأحد والسبت) — الدراسة الاثنين-الجمعة فقط
  if(Array.isArray(d.attendance)) d.attendance = d.attendance.filter(a => isSchoolDay(a.date));
  if(Array.isArray(d.users)){
    d.users.forEach(u => {
      if(Array.isArray(u.absences)) u.absences = u.absences.filter(isSchoolDay);
      if(Array.isArray(u.markedLate)) u.markedLate = u.markedLate.filter(isSchoolDay);
      if(u.lateMinutes && typeof u.lateMinutes === 'object'){
        Object.keys(u.lateMinutes).forEach(k => { if(!isSchoolDay(k)) delete u.lateMinutes[k]; });
      }
      if(u.lateType && typeof u.lateType === 'object'){
        Object.keys(u.lateType).forEach(k => { if(!isSchoolDay(k)) delete u.lateType[k]; });
      }
    });
  }
  if(Array.isArray(d.students)){
    d.students.forEach(s => {
      if(s.lateMinutes && typeof s.lateMinutes === 'object'){
        Object.keys(s.lateMinutes).forEach(k => { if(!isSchoolDay(k)) delete s.lateMinutes[k]; });
      }
      if(s.lateType && typeof s.lateType === 'object'){
        Object.keys(s.lateType).forEach(k => { if(!isSchoolDay(k)) delete s.lateType[k]; });
      }
    });
  }
  // تنظيف تلقائي: ملاحظات متطابقة مكررة خلال دقيقتين (ضغط مزدوج على زر الحفظ)
  if(Array.isArray(d.notes) && d.notes.length > 1){
    const seenNotes = new Map();
    const uniqNotes = [];
    d.notes.forEach(n => {
      // شاهد القبر (المحذوفة) يُحتفظ به دائماً حتى ينتشر الحذف — لا يُدمج ولا يُحذف هنا
      if(n && n.deleted){ uniqNotes.push(n); return; }
      const key = n.studentId + '|' + n.type + '|' + n.category + '|' + (n.description||'') + '|' + n.createdBy + '|' + (n.points ?? '');
      const t = n.createdAt ? new Date(n.createdAt).getTime() : 0;
      const prev = seenNotes.get(key);
      if(prev !== undefined && Math.abs(t - prev) < 120000){ cleaned = true; return; }
      seenNotes.set(key, prev !== undefined ? Math.min(prev, t) : t);
      uniqNotes.push(n);
    });
    if(cleaned) d.notes = uniqNotes;
  }
  // تنظيف تلقائي: بيانات دخول المعلمين — لا رقم سري؛ من لا كلمة مرور له يُجبر على تعيينها عند أول دخول
  if(Array.isArray(d.users)){
    d.users.forEach(u => {
      if(u.role === 'TEACHER'){
        if(u.whatsapp === undefined){ u.whatsapp = ''; cleaned = true; }
        if(u.email === undefined && !u.email){ u.email = ''; cleaned = true; }
        if(u.secret !== undefined || u.initialSecret !== undefined){ delete u.secret; delete u.initialSecret; cleaned = true; }
        if(!u.password){ u.firstLogin = true; cleaned = true; }
      }
    });
  }
  // ترقية: بلاغات الصيانة
  if(!Array.isArray(d.maintenance)){ d.maintenance = []; cleaned = true; }
  // سلامة الأقسام: كل قسم في هذا التطبيق مصفوفة. نسخة قديمة أو نسخة خادم ناقصة
  // قد تخلو من أحدها، فكان قسم الملاحظات يرمي استثناءً عند البناء فيخرج
  // الرسم كله وتظهر صفحة بيضاء بلا أي رسالة. الناقص يُرمَّم هنا لكل قسم.
  ['users','grades','classes','students','attendance','notes','transfers','maintenance','adminMsgs','announcements','suggestions'].forEach(k => {
    if(!Array.isArray(d[k])){ d[k] = []; cleaned = true; }
  });
  // أسافين الحذف للتكليفات: تُبقي في التخزين المحلي (لا تُمسح هنا) حتى يرفعها المتصفح
  // للخادم فتنتشر الحذف فعلياً. مجرد عرضٍ حذف الشوهد من القائمة لا يُفقدها.
  (function(){})(); // (لا تصفية لأشجار الحذف في loadDB — تُصفّى عند العرض فقط)
  if(cleaned) saveDB(d);
  return d;
}
function saveDB(d){
  if(DEMO_MODE && !window.__demoLSOverridden) return; // حماية احتياطية: لا حفظ في نسخة العرض
  // لا نكتب إن لم يتغيّر شيء حقيقي. نقارن مع ما هو في التخزين الآن متجاهلين _ts:
  // الطابع وحده يتحرك مع كل نداء، فيبدو النص مختلفاً دائماً وتُكتب اللوحة بلا فائدة
  // في كل مرة، ما يُشعل حلقة سحب/دفع لا تنتهي. المقارنة تتم على الحالة الحيّة
  // (لا على ذاكرة مؤقتة) حتى لو كتب هنا كاتبٌ آخر، فنُعيد الكتابة بدل إسقاط حفظ.
  const k = dbKey();
  try{
    const cur = JSON.parse(localStorage.getItem(k) || 'null');
    if(cur && __canonNoTs(cur) === __canonNoTs(d)) return;
  }catch(e){}
  // ختم زمني عند كل تغيير حقيقي: به تميّز __syncPush النسخةَ المعدَّلة عن آخر نسخة
  // ختم زمني عند كل تغيير حقيقي: به تميّز __syncPush النسخة المعدّلة عن آخر نسخة رُفعت
  // بنجاح (المقارنة مع st.lastOkTs). كان الحذف لا يغيّر _ts، فيتخطّى __syncPush
  // الدفعةَ كلها بحجة أنها لم تتغيّر: يبقى الشاهد محلياً (فيبدو الحذف ناجحاً،
  // والحديث يحفظه لأن الدمج يحمل القبر) لكن الخادم لم يستقبله قط، فيعود
  // التحويل كاملاً عند الخروج وإعادة الدخول لأن logout يمسح ذاكرة المدرسة فيُنزَّل الخادم.
  d._ts = Date.now();
  localStorage.setItem(k, JSON.stringify(d));
}

function currentUser(){

  }

async function login(login, password){
  if(__serverEnabled()){
    try{
      const r = await __api('POST', 'login', { login, password });
      if(r.status === 200 && r.j && r.j.user){
        __sessionUser = r.j.user;
        __mirrorSet(r.j.user);
        setActiveSchool(r.j.user.school);
        return { ok:true };
      }
      if(r.status === 429) return { ok:false, error:'rate_limited' };
      if(r.status === 403 && r.j && r.j.error === 'not_granted') return { ok:false, error:'not_granted' };
      return { ok:false };
    }catch(e){}
    return { ok:false };
  }
  // النسخة المحلية
  const SCHOOLS = ['BOYS'];
  for(const s of SCHOOLS){
    localStorage.setItem(SCHOOL_KEY, s);
    const d = loadDB();
    const l = login.trim().toLowerCase();
    const u = d.users.find(u => ((u.username && u.username.toLowerCase() === l) || u.email === l) && u.password === password && u.active);
    if(u){
      u.lastLogin = new Date().toISOString();
      u.loginCount = (u.loginCount || 0) + 1;
      u.loginHistory = u.loginHistory || [];
      u.loginHistory.push(new Date().toISOString());
      if(u.loginHistory.length > 300) u.loginHistory = u.loginHistory.slice(-300);
      saveDB(d);
      localStorage.setItem(LOCAL_SESSION_KEY, u.id);
      if(u.role === 'ADMIN'){
        localStorage.removeItem(SCHOOL_KEY);
      } else {
        localStorage.setItem(SCHOOL_KEY, s);
      }
      return { ok:true };
    }
  }
  return { ok:false };
}
function logout(){
  if(__serverEnabled()){

    __sessionUser = null;
    __mirrorClear();
    localStorage.removeItem(SCHOOL_KEY);
    // الخادم هو مصدر البيانات: لا تُترك نسخة من بيانات المدرسة في المتصفح بعد الخروج
    ['BOYS'].forEach(s => { try{ localStorage.removeItem(dbKeyFor(s)); }catch(e){} });

  location.hash = '#/login';
  renderApp();
}

function gradeById(id){ return loadDB().grades.find(g => g.id === id); }
function classById(id){ return loadDB().classes.find(c => c.id === id); }
function studentById(id){ return loadDB().students.find(s => s.id === id); }

function getClassesSorted(){
  const d = loadDB();
  const user = currentUser();
  let classes = d.classes.filter(c => !c.deleted);
  // غير الشموليين (معلم فقط) يرون الفصول المسندة إليهم؛ المدير/الوكيل/المرشدة/الإداري يرون الكل
  if(user && !seesAllClasses(user)){
    classes = classes.filter(c => (c.teacherIds||[]).includes(user.id));
  }
  return classes.slice().sort((a,b) => {
    const ga = gradeById(a.gradeId), gb = gradeById(b.gradeId);
    return ((ga?.order??0) - (gb?.order??0)) || a.name.localeCompare(b.name,'ar');
  });
}
function getVisibleStudents(){
  const d = loadDB();
  const user = currentUser();
  let students = d.students.filter(s => s.active);
  if(user && !seesAllClasses(user)){
    const classIds = getClassesSorted().map(c => c.id);
    students = students.filter(s => s.classId && classIds.includes(s.classId));
  }
  return students.sort((a,b) => a.fullName.localeCompare(b.fullName,'ar'));
}

function __togglePw(btn){
  const wrap = btn.closest('.pw-wrap');
  if(!wrap) return;

  if(!input) return;

function setupPasswordToggles(){
  const scan = (el) => {
    if(!el || !el.querySelectorAll) return;
    el.querySelectorAll('input[type="password"]').forEach((inp) => {
      if(inp.closest('.pw-wrap')) return;
      const wrap = document.createElement('span');
      wrap.className = 'pw-wrap';
      inp.parentNode.insertBefore(wrap, inp);
      wrap.appendChild(inp);
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'pw-toggle';
      btn.textContent = '👁';
      btn.setAttribute('aria-label', 'إظهار/إخفاء كلمة المرور');
      btn.setAttribute('tabindex', '-1');
      btn.onclick = function(e){ e.preventDefault(); e.stopPropagation(); __togglePw(this); };
      wrap.appendChild(btn);
    });
  };
  scan(document.body);
  if(window.__pwObserver) return;
  try{
    window.__pwObserver = new MutationObserver((muts) => {
      for(const m of muts){
        if(m.type === 'childList'){
          for(const n of m.addedNodes){ if(n.nodeType === 1) scan(n); }
        }
      }
    });
    window.__pwObserver.observe(document.body, { childList:true, subtree:true });
  }catch(e){}
}

async function saveFirstLogin(){
  if(__firstLoginBusy) return;
  const s1 = document.getElementById('flSecret').value;
  const s2 = document.getElementById('flConfirm').value;
  const email = document.getElementById('flEmail').value.trim();
  const el = document.getElementById('flError');
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ if(el){ el.style.display='block'; el.textContent='أدخل بريدك الإلكتروني الصحيح مثل teacher@example.com'; } return; }
  if(s1){
    if(s1.length < 8){ if(el){ el.style.display='block'; el.textContent='كلمة المرور يجب أن تكون 8 أحرف على الأقل'; } return; }
    if(s1 !== s2){ if(el){ el.style.display='block'; el.textContent='كلمتا المرور غير متطابقتين'; } return; }
  }
  __firstLoginBusy = true;
  try{
    if(__serverEnabled()){
      const body = { email };
      if(s1) body.newPassword = s1;
      const r = await __api('POST', 'change-password', body);
      if(r.status === 200 && r.j && r.j.user){
        __sessionUser = r.j.user;
        __mirrorSet(r.j.user);
        await __refreshSchool(r.j.user.school);
        location.hash = '#/';
        renderApp();
        return;
      }
      if(r.j && r.j.error === 'weak_password'){ if(el){ el.style.display='block'; el.textContent='كلمة المرور ضعيفة — 8 أحرف على الأقل مع أرقام أو رموز'; } return; }
      if(el){ el.style.display='block'; el.textContent='تعذر الحفظ — أعد المحاولة'; }
      return;
    }
    // النسخة المحلية
    const user = currentUser();
    if(!user) return;
    const school = getUserSchool();
    if(!school) return;
    const key = 'nibras_'+school.toLowerCase()+'_db_v1';
    const d = JSON.parse(localStorage.getItem(key) || 'null');
    if(!d) return;
    const u = d.users.find(x => x.id === user.id);
    if(!u) return;
    if(s1) u.password = s1;
    u.email = email;
    u.firstLogin = false;
    localStorage.setItem(key, JSON.stringify(d));
    location.hash = '#/';
    renderApp();
  }finally{
    __firstLoginBusy = false;
  }
}

  if(oldKey) localStorage.setItem(SCHOOL_KEY, oldKey); else localStorage.removeItem(SCHOOL_KEY);
  const today = todayStr();
  const students = d.students.filter(s => s.active);
  const att = attCountsByDate(d, today, students.map(s => s.id));
  return {
    students: students.length,
    classes: d.classes.filter(c => !c.deleted).length,
    present: att.present,
    absent: att.absent,
    late: att.late,
    pendingTransfers: d.transfers.filter(t => t.status === 'PENDING' && transferForMe(t)).length,
    teachers: d.users.filter(u => u.role === 'TEACHER' && u.active).length,
  };
}
function donutChart(present, absent, late){
  const total = present + absent + late;
  const r = 36, circ = 2 * Math.PI * r, cx = 50, cy = 50;
  if(total === 0){
    return `<svg width="120" height="120" viewBox="0 0 100 100"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#e5e7eb" stroke-width="14"/><text x="50" y="52" text-anchor="middle" fill="#9ca3af" font-size="9">لا توجد بيانات</text></svg>`;
  }
  const segs = [
    { v: present, c: '#16a34a' },
    { v: absent, c: '#dc2626' },
    { v: late, c: '#d97706' },
  ];
  let off = 0, arcs = '';
  segs.forEach(s => {
    if(s.v === 0) return;
    const d = (s.v / total) * circ;
    arcs += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.c}" stroke-width="14" stroke-dasharray="${d} ${circ - d}" stroke-dashoffset="${-off}"/>`;
    off += d;
  });
  return `<svg width="120" height="120" viewBox="0 0 100 100"><g transform="rotate(-90 ${cx} ${cy})"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#f3f4f6" stroke-width="14"/>${arcs}</g><text x="50" y="46" text-anchor="middle" fill="#1f2937" font-size="20" font-weight="800">${present}</text><text x="50" y="58" text-anchor="middle" fill="#6b7280" font-size="9">حضور</text></svg>`;
}
function barMeter(value, max, color){
  const pct = max > 0 ? Math.min(value / max * 100, 100) : 0;
  return `<div style="background:#f3f4f6;border-radius:6px;height:8px;overflow:hidden;margin-top:4px"><div style="width:${pct}%;height:100%;background:${color};border-radius:6px;transition:width .3s"></div></div>`;
}

/* عرض أسماء من دخلوا ومن لم يدخلوا حساباتهم (الطلاب أو المعلمون) لنطاق معيّن */
function showActNames(gkey, grp){
  const isStaffRole = r => r !== 'STUDENT' && r !== 'ADMIN';
  const isAdmin = currentUser()?.role === 'ADMIN';
  if(!isAdmin) return;
  const hasLoggedIn = u => !!(u && (u.lastLogin || (u.loginCount || 0) > 0));
  const sdDate = v => { if(!v) return ''; const d = new Date(v); return (!isNaN(d) ? d.toLocaleDateString('ar') + ' ' + d.toLocaleTimeString('ar',{hour:'2-digit',minute:'2-digit'}) : ''); };
  const schools = ['BOYS'];
  const multi = schools.length > 1;
  const actNames = [], pendNames = [];
  const tag = school => multi ? ' (بنين)' : '';
  for(const school of schools){
    const sd = loadSchoolDB(school);
    const userMap = new Map((sd.users||[]).map(u => [u.id, u]));
    if(grp === 'students'){
      for(const s of (sd.students||[])){
        if(!s.active) continue;
        const u = userMap.get(s.id);
        if(!u || u.role !== 'STUDENT') continue;
        const nm = (s.fullName || s.name) + tag(school);
        if(hasLoggedIn(u)) actNames.push(nm + (u.lastLogin ? ' — دخل: ' + sdDate(u.lastLogin) : '')); else pendNames.push(nm);
      }
    } else {
      for(const u of (sd.users||[])){
        if(u.active === false) continue;
        if(grp === 'teachers'){ if(u.role !== 'TEACHER') continue; }
        else { if(!isStaffRole(u.role) || u.role === 'TEACHER') continue; }
        const nm = (u.name || u.username) + tag(school);
        if(hasLoggedIn(u)) actNames.push(nm + (u.lastLogin ? ' — دخل: ' + sdDate(u.lastLogin) : '')); else pendNames.push(nm);
      }
    }
  }
  const roleLabel = grp === 'students' ? 'الطلاب' : (grp === 'teachers' ? 'المعلمون' : 'الإداريون والوكلاء والموجهون');
  const rangeLabel = 'بنين';
  const li = arr => arr.length ? arr.sort((a,b)=>a.localeCompare(b,'ar')).map(n => `<li>${escapeHtml(n)}</li>`).join('') : '<li class="muted">لا يوجد</li>';
  openDetails('تفعيل الحسابات — ' + roleLabel + ' (' + rangeLabel + ')',
    `<li style="font-weight:800;color:#16a34a">✅ دخلوا حسابهم (${actNames.length})</li>${li(actNames)}<li style="font-weight:800;color:#9ca3af;margin-top:6px">⏳ لم يدخلوا بعد (${pendNames.length})</li>${li(pendNames)}`);
}

/* ============ الإشعارات: وميض + صوت (صيانة / مشاركة أنشطة) ============ */
const NOTIF_SEEN_KEY = 'nibras_notif_seen_';
let __notifLastPoll = 0;      // أعلى طابع زمني لوحظ في هذه الجلسة (يمنع تكرار الصوت)
let __notifSoundLock = true;  // أول جولة بعد الدخول: تحديث صامت
let __audioCtx = null;
function ensureAudio(){
  try{
    if(!__audioCtx) __audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(__audioCtx && __audioCtx.state === 'suspended') __audioCtx.resume();
  }catch(e){}
}
document.addEventListener('pointerdown', ensureAudio, { once:true });
document.addEventListener('keydown', ensureAudio, { once:true });
function playNotifSound(){
  try{
    ensureAudio();
    if(!__audioCtx) return;
    const t = __audioCtx.currentTime;
    [[880,0],[660,0.18]].forEach(([f,d]) => {
      const o = __audioCtx.createOscillator(), g = __audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + d);
      g.gain.exponentialRampToValueAtTime(0.35, t + d + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.25);
      o.connect(g); g.connect(__audioCtx.destination);
      o.start(t + d); o.stop(t + d + 0.3);
    });
  }catch(e){}
}
function notifItemsFor(user){
  if(!user) return [];
  const d = loadDB();
  const items = [];
  // الطلاب: يظهر لهن إشعار بالجرس عن كل تكليف جديد صدر لفصلهن
  if(user.role === 'STUDENT'){
    const myStudent = (d.students||[]).find(s => s.id === user.id);
    if(myStudent && myStudent.classId){
      (d.assignments||[]).forEach(a => {
        if(a && !a.deleted && a.classId === myStudent.classId && (a.created||0) > 0){
          items.push({ kind:'assign', href:'#/assignments', title:'📝 تكليف جديد — ' + (a.title || 'بدون عنوان'), text:(a.subject||'') + (a.type ? ' · ' + a.type : '') + (a.date ? ' · ' + a.date : ''), ts:a.created, key:'assign-' + a.id });
        }
      });
    }
    return items.sort((x,y) => y.ts - x.ts);
  }
  const isMgr = user.role === 'ADMIN' || user.role === 'AGENT';
  const seesMaint = isMgr || user.role === 'ADMINISTRATIVE' || user.role === 'COUNSELOR';
  if(seesMaint){
    (d.maintenance || []).forEach(m => {
      if(m.status === 'جديد'){
        items.push({ kind:'maint', href:'#/maintenance', title:'🛠️ بلاغ صيانة جديد', text:(m.createdByName || '—') + ' · ' + (m.description || 'بدون وصف'), ts: Date.parse(m.createdAt) || 0, key:'maint-' + m.id });
      }
      if(m.status === 'بانتظار اعتماد الوكيل' && user.role === 'AGENT'){
        items.push({ kind:'maint', href:'#/maintenance', title:'🛠️ بلاغ صيانة بانتظار اعتمادك', text:(m.createdByName || '—') + ' · ' + (m.description || ''), ts: Date.parse(m.forwardedAt || m.createdAt) || 0, key:'maintf-' + m.id });
      }
    });
  }
  if(isMgr){
    (d.activities || []).forEach(a => {
      (a.requests || []).forEach(r => {
        if(r.status === 'PENDING'){
          items.push({ kind:'part', href:'#/activities/' + a.id, title:'✋ طلب مشاركة في نشاط', text:(r.teacherName || '—') + ' · ' + (a.name || ''), ts: Date.parse(r.createdAt) || 0, key:'part-' + a.id + '-' + r.id });
        }
      });
    });
  }
  // أي رسالة موجهة للمدير مباشرةً → تنبيه على الجرس (يرى رسائل القسمين معًا)
  if(user.role === 'ADMIN'){
    const adminIds = {};
    ['BOYS'].forEach(s => {
      try{
        const db = JSON.parse(localStorage.getItem('nibras_'+s+'_db_v1') || 'null');
        const adm = db && db.users && db.users.find(u => u.role === 'ADMIN' && u.active);
        adminIds[s] = adm ? adm.id : null;
      }catch(e){ adminIds[s] = null; }
    });
    ['BOYS'].forEach(s => {
      const adminId = adminIds[s];
      if(!adminId) return;
      (loadAdminMsgsFor(s) || []).forEach(m => {
        const viewedBy = m.clearedBy && user && user.id && (user.id in m.clearedBy);
        if(m.teacherId === adminId && !m.deleted && !m.dismissed && !viewedBy){
          items.push({ kind:'adminmsg', href:'#/guide-msgs', title:'📨 رسالة موجهة إليك', text:(m.teacherName || '') + ' · ' + (m.text || ''), ts: Date.parse(m.createdAt) || 0, key:'adminmsg-' + s + '-' + m.id });
        }
      });
    });
  }
  return items.sort((x,y) => y.ts - x.ts);
}
function notifSeenStamp(user){
  try{ return parseInt(localStorage.getItem(NOTIF_SEEN_KEY + (user ? user.id : '')) || '0', 10) || 0; }catch(e){ return 0; }
}
function setNotifSeenStamp(user, ts){
  try{ localStorage.setItem(NOTIF_SEEN_KEY + (user ? user.id : ''), String(ts || Date.now())); }catch(e){}
}
function renderNotifState(user){
  if(!user) return '';
  const items = notifItemsFor(user);
  const seen = notifSeenStamp(user);
  const unread = items.filter(x => x.ts > seen);
  const badge = unread.length ? `<span class="notif-badge">${Math.min(unread.length, 99)}</span>` : '';
  const blink = unread.length ? ' notif-blink' : '';
  return `<span style="position:relative">
    <button class="notif-btn${blink}" id="notifBell" onclick="toggleNotifDrop()" title="${unread.length ? 'لديك إشعارات جديدة' : 'الإشعارات'}">🔔${badge}</button>
    <div class="notif-drop" id="notifDrop" style="display:none"></div>
  </span>`;
}
function renderNotifDropHTML(user){
  const items = notifItemsFor(user);
  const seen = notifSeenStamp(user);
  return (items.length ? items.map(it => {
    const isNew = it.ts > seen;
    return `<a class="notif-item" href="${it.href}" onclick="closeNotifDrop()">${it.title}${isNew ? ' <span style="color:#dc2626;font-size:10px">●</span>' : ''}<div class="small muted" style="font-weight:400">${escapeHtml(it.text)}</div></a>`;
  }).join('') : '<div class="small muted" style="padding:8px 12px">لا توجد إشعارات</div>');
}
function refreshNotifBell(){
  const u = currentUser();
  const bell = document.getElementById('notifBell');
  if(!u || !bell) return;
  const items = notifItemsFor(u);
  const seen = notifSeenStamp(u);
  const unread = items.filter(x => x.ts > seen);
  let badge = bell.querySelector('.notif-badge');
  if(unread.length){
    if(badge) badge.textContent = String(Math.min(unread.length, 99));
    else bell.insertAdjacentHTML('afterbegin', `<span class="notif-badge">${Math.min(unread.length, 99)}</span>`);
    bell.classList.add('notif-blink');
    bell.title = 'لديك إشعارات جديدة';
  } else {
    if(badge) badge.remove();
    bell.classList.remove('notif-blink');
    bell.title = 'الإشعارات';
  }
}
function toggleNotifDrop(){
  const d = document.getElementById('notifDrop');
  if(!d) return;
  if(d.style.display !== 'none'){ closeNotifDrop(); return; }
  const u = currentUser();
  markAllNotifRead();
  d.innerHTML = renderNotifDropHTML(u);
  d.style.display = 'block';
}
function closeNotifDrop(){
  const d = document.getElementById('notifDrop');
  if(d) d.style.display = 'none';
}
function markAllNotifRead(){
  const u = currentUser();
  if(!u) return;
  setNotifSeenStamp(u, Date.now());
  refreshNotifBell();
}
function checkNotifications(){
  const u = currentUser();
  if(!u){ __notifSoundLock = false; return; }
  const items = notifItemsFor(u);
  const fresh = items.filter(x => x.ts > __notifLastPoll);
  if(fresh.length){
    const maxTs = Math.max(...fresh.map(x => x.ts));
    if(__notifLastPoll > 0 && !__notifSoundLock) playNotifSound();
    __notifLastPoll = maxTs;
    refreshNotifBell();
  }
  __notifSoundLock = false;
}

/* إشعارات قسم محدد دون تغيير القسم النشط (للمدير: رؤية القسمين معًا) */
function loadAdminMsgsFor(school){
  try{ const d = loadSchoolDB(school); if(Array.isArray(d.adminMsgs)) return d.adminMsgs; }catch(e){}
  let arr = [];
  try { arr = JSON.parse(localStorage.getItem(ADMIN_MSGS_KEY(school)) || '[]'); } catch(e){ arr = []; }
  return Array.isArray(arr) ? arr : [];

function saveAdminMsgs(arr){ saveAdminMsgsFor(getActiveSchool(), arr); }
function saveAdminMsgsFor(school, arr){ __persistMsgs(school, arr); }
/* حفظ الرسائل في مرآة قاعدة البيانات (تتزامن مع كل الأجهزة عبر الخادم) مع نسخة محلية احتياطية */
function __persistMsgs(school, arr){

  try{ localStorage.setItem(ADMIN_MSGS_KEY(school), JSON.stringify(arr)); }catch(e){}
  __syncSchedule(school, 0);
}
/* أسافين الحذف (deleted) لاصقة: الرسالة تُحذف بوضع علامة لا بمحوها، فتبقى شاهدًا
   في القسم حتى يجمعها الخادم ولا تُعدَّ إحياؤها من جهاز قديم. والفلترة عند
   القراءة لا عند التحميل، لأن كل مسار كتابة (إرسال/تعديل/حذف) يعيد كتابة القسم
   من المصفوفة نفسها — ولو قُطعت الأسافين منها هناك لأعادها الخادم بعدها. */
function aliveMsgs(arr){ return (Array.isArray(arr) ? arr : []).filter(m => m && !m.deleted); }
/* البحث عن رسالة في كلا القسمين (للمدير) أو القسم النشط فقط */
function findAdminMsgAcross(id){
  const user = currentUser();
  const schools = user?.role === 'ADMIN' ? ['BOYS'] : [getActiveSchool()];
  for(const s of schools){
    const arr = loadAdminMsgsFor(s);
    const m = arr.find(x => x.id === id);
    if(m) return { school: s, arr, m };
  }
  return null;
}
/* عدّاد الرسائل غير المقروءة لكل مرسل (الموجه/الوكيل/الوكيل) — يظهر حسب الدور */
function unreadForSchool(school, email){
  try{
    const d = JSON.parse(localStorage.getItem('nibras_' + school + '_db_v1') || 'null');
    const u = d && d.users.find(x => x.email === email);
    if(!u) return 0;
    const arr = (d && Array.isArray(d.adminMsgs)) ? d.adminMsgs : [];
    return arr.filter(m => m && !m.deleted && m.senderId === u.id && !m.read && !m.dismissed).length;
  }catch(e){ return 0; }
}

function dismissAdminMsg(id){
  const found = findAdminMsgAcross(id);
  if(!found) return;

  const u = currentUser();
  // لا تُحتسب بعضوٍ من النظام/المدير سوى على مجموعة الرسائل نفسها: إخفاء كل النسخ
  // المكررة التي تخص نفس المصدر (transferId/partReqId/النص) حتى لا تبقى نسخة
  // "تعاود الظهور" بعد اطلاع النسخة الأولى (كان التحويل يُنشئ نسختين متطابقتين).
  let target = found.m;
  // مفتاح المصدر: للتحويل/النشاط بالمعرّف الخاص، وللمراسلة العادية بصمة المحتوى
  // (المرسل + الهدف + النص المُطبّع) لا بالمعرّف — فالشقيقتان المتطابقتان اللتان
  // أُنشئتا بمعرّفين مختلفين تُعامَلان كمصدرٍ واحد ويُسقط ضغطُ «تم الاطلاع» كلتيهما
  // معًا، فلا تعود شقيقةٌ بعد إسقاط أختها وضغط إعادة الدخول.
  const normTxt = (t) => String(t || '').replace(/\s+/g, ' ').trim();

    : (m.senderRole === 'ACTIVITY' && m.partReqId ? 'p:' + m.partReqId
    : 'm:' + (m.senderRole || '') + '|' + (m.teacherId || '') + '|' + normTxt(m.text).toLowerCase());
  const k = key(target);
  const stamp = new Date().toISOString();
  arr.forEach(m => {
    if(key(m) !== k) return;
    m.seenBy = m.seenBy || {};
    m.seenBy[u.id] = stamp;
    m.clearedBy = m.clearedBy || {};
    m.clearedBy[u.id] = stamp;
    m.lastViewAt = stamp;
    m.lastViewByName = u.name || '';
    m.lastViewBy = u.id;
    m.read = true;

    // فنضبطه هنا أيضاً: الاكتفاء بـ clearedBy كان سبب بقاء الإشعار على شاشة
    // المدير، وقد يضيع إن سحبت نسخة من الخادم لا تحمله.
    m.dismissed = true;

}
function revealAdminMsg(id){

/* تنبيه صوتي مستمر حتى فتح الرسالة */
function checkMsgBeep(){
  const user = currentUser();
  if(!user || user.role === 'ADMIN') return;
  if(window.__msgBeepUser !== user.id || !window.__msgBeepIds || !window.__msgBeepIds[user.id]){
    window.__msgBeepUser = user.id;
    window.__msgBeepIds = window.__msgBeepIds || {};
    window.__msgBeepIds[user.id] = {};
  }
  const rung = window.__msgBeepIds[user.id];
  const msgs = adminMsgsFor(user.id).filter(m => !m.dismissed && !m.revealed && m.senderRole !== 'TRANSFER' && !(m.clearedBy && user.id && (user.id in m.clearedBy)));
  const fresh = msgs.filter(m => !rung['m:' + m.id]);
  if(fresh.length){
    fresh.forEach(m => rung['m:' + m.id] = 1);
    try { playMsgAlert(); }catch(e){}
  }
  // تنبيه هروب من الحصة (من قاعدة البيانات المتزامنة) — يقرع الجرس مرة واحدة لكل تنبيه جديد للوكيل
  if(user.role === 'AGENT'){
    try{
      const d = loadDB();
      const alerts = (d.escapeAlerts||[]).filter(a => a.date === todayStr() && a.type === 'ESCAPE' && !a.dismissed);
      const freshE = alerts.filter(a => !rung['e:' + a.id]);
      if(freshE.length){
        freshE.forEach(a => rung['e:' + a.id] = 1);
        try { playMsgAlert(); }catch(e){}
      }
    }catch(e){}
  }
}
function startMsgBeepLoop(){
  if(window.__msgBeepTimer) return;
  checkMsgBeep();
  window.__msgBeepTimer = setInterval(checkMsgBeep, 3000);
}
function unlockMsgAudio(){
  try {
    if(window.__audioCtx && window.__audioCtx.state === 'suspended') window.__audioCtx.resume();
    if(window.__pendingMsgBeep){ window.__pendingMsgBeep = false; playMsgAlert(); }
  }catch(e){}
}
function playMsgAlert(){
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    if(!window.__audioCtx) window.__audioCtx = new AC();
    const ctx = window.__audioCtx;
    if(ctx.state === 'suspended'){ ctx.resume(); window.__pendingMsgBeep = true; }
    const t0 = ctx.currentTime;
    [0, 0.3, 0.6].forEach((off, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = i % 2 ? 'triangle' : 'square';
      osc.frequency.setValueAtTime(i % 2 ? 990 : 880, t0 + off);
      gain.gain.setValueAtTime(0.0001, t0 + off);
      gain.gain.exponentialRampToValueAtTime(0.2, t0 + off + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + off + 0.16);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t0 + off);
      osc.stop(t0 + off + 0.2);
    });
  }catch(e){}
}
window.addEventListener('pointerdown', unlockMsgAudio);
window.addEventListener('keydown', unlockMsgAudio);
/* تنبيهات حمراء من المدير تظهر للمعلم أعلى لوحة التحكم مباشرة */
function renderAdminMsgAlerts(){

    const dedup = (list) => {
      // إزالة التكرار الناتج عن إنشاء التحويل/النشاط نسختين متطابقتين لنفس المصدر:
      // نُبقي النسخة الأخيرة فقط لكل (transferId / partReqId / نص+مرسل+تاريخ) — فحتى لو
      // بقي تكرار في القاعدة يُعرض إشعار واحد، واختفاء نسخة يختفي بحق مع كل أخواتها.
      const seen = new Map();
      list.forEach(m => {
        const k = (m.senderRole === 'TRANSFER' && m.transferId) ? 't:' + m.transferId
          : (m.senderRole === 'ACTIVITY' && m.partReqId) ? 'p:' + m.partReqId
          : 'm:' + String(m.id) + '|' + String(m.createdAt || '') + '|' + String(m.teacherId || '') + '|' + String(m.text || '');
        seen.set(k, m);
      });

      // المدير: «تم الاطلاع» يُخفي الإشعار عنه أيضاً — كان هذا الفرع يكتفي بـ
      // !m.dismissed فلا يحترم clearedBy، فيبقى الإشعار على الشاشة إلى الأبد.
      return dedup(aliveMsgs(['BOYS'].map(s => loadAdminMsgsFor(s).map(m => ({ ...m, _school: s })))

    if(user.role !== 'TEACHER') arr = arr.filter(m => m.teacherId !== 'ALL');
    if(user.role === 'TEACHER' || user.role === 'AGENT' || user.role === 'COUNSELOR') arr = arr.filter(m => !(m.clearedBy && user.id && (user.id in m.clearedBy)));
    return arr;
  };
  let msgs = combinedMsgs();
  if(msgs.length === 0) return '';
  // إثبات الاطلاع: يُحتسب لكل معلم مرة واحدة فقط (بمعرّفه)، فلا تتضخم الأرقام
  // بمرّات فتح الصفحة المتكررة. كل معلم = اطلاع واحد مهما فتح رسالته عدة مرات.
  const now = Date.now();

    msgs.forEach(m => {
      const key = m._school || school;
      touched[key] = touched[key] || loadAdminMsgsFor(key);

      if(rec){
        rec.seenBy = rec.seenBy || {};
        if(uid && !(uid in rec.seenBy)){
          rec.seenBy[uid] = new Date().toISOString();
          if(!rec.firstViewAt || rec.firstViewBy !== uid){ rec.firstViewAt = new Date().toISOString(); rec.firstViewByName = userName; rec.firstViewBy = uid; }
        }
        if(uid) rec.lastViewAt = new Date().toISOString();
        if(uid) rec.lastViewByName = userName;
        rec.read = true;
        rec.updatedAt = new Date().toISOString();
      }
    });
    Object.keys(touched).forEach(k => saveAdminMsgsFor(k, touched[k]));
    msgs = combinedMsgs();
  }
  startMsgBeepLoop();
  const flexW = (m) => m.senderRole === 'ADMIN' ? 2.2 : (m.senderRole === 'AGENT' ? 1.5 : (m.senderRole === 'COUNSELOR' ? 1.1 : 1));
  return `

      const senderLabel = fromEscape ? '🔔 تنبيه هروب من الحصة' : (fromTransfer ? '📨 إشعار تحويل' : (fromActivity ? '🎨 طلب مشاركة في نشاط' : (fromCounselor ? ('💬 رسالة من ' + tl(targetLabels.COUNSELOR)) : (fromAgent ? ('🚨 رسالة من ' + tl(targetLabels.AGENT)) : '🚨 رسالة مهمة من المدير'))));
      // الشارة تذكر نوع الإشعار فقط. كان نص «إشعار تحويل» متبوعاً بشارة
      // «تحويل بنين» فيظهر مكرّراً، والبادئة الآن تشير إلى أن الإشعار محفوظ
      // على الخادم فيصل لكل الأجهزة.
      const badgeLabel = fromEscape ? 'عاجل' : (fromTransfer ? (m._school ? 'مشترك' : 'تحويل') : (fromActivity ? 'نشاط' : (fromCounselor ? tl(targetLabels.COUNSELOR) : (fromAgent ? tl(targetLabels.AGENT) : 'مهمة'))));
      if(!m.revealed && m.senderRole !== 'ACTIVITY' && !(user.role === 'ADMIN' && m.senderRole === 'TRANSFER')){
        return `
        <div style="flex:${flexW(m)} 1 0;min-width:200px;background:${bg};border:2px solid ${col};border-radius:12px;padding:10px 12px;box-shadow:0 2px 10px rgba(220,38,38,.2);animation:msgPulse 1.5s infinite;display:flex;flex-direction:column">
          <div style="font-size:12px;font-weight:900;color:${col}">${senderLabel} <span style="background:${col};color:#fff;font-size:10px;padding:1px 7px;border-radius:999px">${badgeLabel}</span></div>
          <div style="font-size:11px;color:${colDark};margin-top:4px">🕐 ${fmtTime(m.createdAt)}</div>
          <div style="font-size:13px;font-weight:700;color:${colDark};margin-top:8px;letter-spacing:2px;background:#fff;border:1px dashed ${col};border-radius:8px;padding:6px 8px;text-align:center">🔒 محتوى مخفي (${Object.keys(m.seenBy||{}).length||0} معلم اطّلع)</div>
          <button class="btn-primary" style="margin-top:auto;background:${col};border-color:${col};width:100%;padding:6px 8px;font-size:12px" onclick="revealAdminMsg('${m.id}')">🔓 الاطلاع على المحتوى</button>
        </div>`;

      return `
      <div style="flex:${flexW(m)} 1 0;min-width:200px;background:${bg};border:2px solid ${col};border-radius:12px;padding:10px 12px;box-shadow:0 2px 10px rgba(220,38,38,.2);display:flex;flex-direction:column">
        <div style="font-size:12px;font-weight:900;color:${col}">${senderLabel} <span style="background:${col};color:#fff;font-size:10px;padding:1px 7px;border-radius:999px">${badgeLabel}</span></div>
        <div style="font-size:11px;color:${colDark};margin-top:4px">🕐 ${fmtTime(m.createdAt)}</div>
        <div style="font-size:14px;line-height:1.7;font-weight:700;color:${colText};margin-top:8px;white-space:pre-wrap">${escapeHtml(m.text)}</div>
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:8px">
          <span style="font-size:11px;font-weight:800;color:${colDark}">${(m.seenBy && user.id && (user.id in m.seenBy)) ? '✓ تم اطلاعك' : ('👁 ' + (Object.keys(m.seenBy||{}).length||0) + ' معلم اطّلع')}</span>
          <button class="btn-primary" style="background:${col};border-color:${col};padding:5px 10px;font-size:12px" onclick="dismissAdminMsg('${m.id}')">✓ تم الاطلاع</button>
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

/* ============ لوحة التحكم ============ */
function fmtRate(r){ return r === null ? '—' : (Math.round(r*10)/10) + '%'; }
/* تنبيه هروب من الحصة: بطاقة حمراء نابضة تظهر للوكيل/المدير فور حدوثها (من قاعدة البيانات المتزامنة) */
function renderEscapeAlerts(){
  const user = currentUser();
  if(!user || (user.role !== 'AGENT' && user.role !== 'ADMIN')) return '';
  const d = loadDB();
  const today = todayStr();
  const alerts = (d.escapeAlerts||[]).filter(a => a.date === today && a.type === 'ESCAPE' && !a.dismissed).sort((a,b) => String(b.createdAt).localeCompare(String(a.createdAt)));
  if(alerts.length === 0) return '';
  return `
  <div style="margin-bottom:14px">
    ${alerts.map(a => {
      const s = studentById(a.studentId);
      const sName = escapeHtml(a.studentName || s?.fullName || s?.name || 'طالب');
      const clsTxt = escapeHtml(a.className || (s?.classId ? classLabel(classById(s.classId)) : ''));
      return `
      <div style="display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#fef2f2,#fecaca);border:2px solid #dc2626;border-radius:12px;padding:10px 14px;box-shadow:0 2px 10px rgba(220,38,38,.25);animation:msgPulse 1.5s infinite;margin-bottom:8px">
        <div style="font-size:22px">🚨🔔</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:900;color:#b91c1c">هروب من الحصة: ${sName} ${clsTxt ? '— ' + clsTxt : ''}</div>
          <div style="font-size:11px;color:#7f1d1d;margin-top:2px">سجّله ${escapeHtml(a.teacherName || '—')} · 🕐 ${fmtTime(a.createdAt)}</div>
        </div>
        <button class="btn-primary" style="background:#dc2626;border-color:#dc2626;padding:6px 12px;font-size:12px;flex-shrink:0" onclick="dismissEscapeAlert('${a.id}')">✓ تابعته</button>
      </div>`;
    }).join('')}
  </div>`;
}
function dismissEscapeAlert(id){
  const d = loadDB();
  const a = (d.escapeAlerts||[]).find(x => x.id === id);
  if(a) a.dismissed = true;
  saveDB(d);
  renderApp();
}
function toggleAssignmentDone(aid){
  const d = loadDB();
  const user = currentUser();
  if(!user) return;
  const a = (d.assignments||[]).find(x => x.id === aid);
  if(!a) return;
  if(!a.completedBy) a.completedBy = [];
  const idx = a.completedBy.indexOf(user.id);
  if(idx >= 0) a.completedBy.splice(idx, 1); else a.completedBy.push(user.id);
  a._v = (typeof a._v === 'number' ? a._v : 0) + 1;
  saveDB(d);
  renderApp();
}
function renderStudentDashboard(){

  const classLabel = grade ? grade.name + ' — الفصل ' + cls.name : '—';
  const assignments = (d.assignments||[]).filter(a => myStudent && a.classId === myStudent.classId && !(a && a.deleted));
  const recentAssignments = assignments.slice(-8).reverse();
  const assignmentTypes = ['واجب','مشروع','حفظ','أخرى'];
  const typeColors = { 'واجب':'#1d7fd6', 'مشروع':'#e67e22', 'حفظ':'#16a34a', 'أخرى':'#8e44ad' };
  const typeIcons = { 'واجب':'📋', 'مشروع':'🎨', 'حفظ':'📖', 'أخرى':'📌' };

    const all = assignments.filter(a => (a.type||'واجب') === t);

    return { type: t, total: all.length, done: done.length, todo: all.length - done.length, color: typeColors[t], icon: typeIcons[t] };
  }).filter(s => s.total > 0);
  const maxAss = Math.max(...typeStats.map(s => s.total), 1);
  const myNotes = (d.notes||[]).slice().filter(n => n.studentId === user.id && !n.deleted).slice(-6).reverse();
