<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>النظام في صيانة | نبراس</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
        }
        body {
            background: #f3f6fb;
            color: #22304a;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .box {
            max-width: 460px;
            width: 100%;
            background: #fff;
            border-radius: 16px;
            padding: 44px 40px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(31, 45, 90, .12);
        }
        .dot {
            width: 58px;
            height: 58px;
            margin: 0 auto 22px;
            border-radius: 50%;
            background: #eef2fb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: #3451b2;
        }
        h1 {
            font-size: 22px;
            margin: 0 0 10px;
        }
        p {
            font-size: 15px;
            line-height: 1.8;
            color: #5a6a8a;
            margin: 0;
        }
        .pill {
            margin-top: 20px;
            font-size: 12px;
            color: #8794b0;
            background: #f4f7fd;
            border-radius: 999px;
            padding: 6px 14px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="dot">&#9881;</div>
        <h1>النظام في صيانة</h1>
        <p>نعمل حالياً على إجراء تحسينات على النظام، وسيعود للعمل قريباً بإذن الله.<br>شكراً لصبركم.</p>
        <div class="pill">نبراس — منصة إدارة المدارس</div>
    </div>
</body>
</html>
