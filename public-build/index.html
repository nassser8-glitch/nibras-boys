<script>
/* حارس الإقلاع: أول سكربت في الصفحة.
   إن لم يقلع التطبيق (بياض بالكامل) نمسح ذاكرة Service Worker ونعيد التحميل مرة
   واحدة فقط؛ فإن تكرر الإقلاع الفاشل نعرض نص الخطأ على الصفحة نفسها بدل
   الصمت — حتى لا يحتاج المستخدم لفتح أدوات المطوّر لمعرفة السبب.
   ملاحظة: لا نمسح localStorage لأنه يحتوي بيانات المدرسة وكل عمل المستخدم. */
window.__nibrasBooted = false;
window.__nibrasBootErr = '';
(function(){
  var KEY = 'nibrasBootRepair_v1';
  var already = false;
  try { already = sessionStorage.getItem(KEY) === '1'; sessionStorage.setItem(KEY, '1'); } catch(_){}
  window.addEventListener('error', function(e){
    if (window.__nibrasBooted) return;
    window.__nibrasBootErr = String((e && (e.message || e.type)) || e || 'unknown error');
  }, true);
  var esc = function(s){
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  };
  setTimeout(function(){
    if (window.__nibrasBooted) return;
    if (!already) {
      try {
        if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations)
          navigator.serviceWorker.getRegistrations().then(function(rs){
            for (var i = 0; i < rs.length; i++) rs[i].unregister();
          });
        if (window.caches && window.caches.keys)
          window.caches.keys().then(function(ks){
            for (var i = 0; i < ks.length; i++) window.caches.delete(ks[i]);
          });
      } catch(_){}
      location.reload();
      return;
    }
    var box = document.createElement('div');
    box.style.cssText = 'max-width:560px;margin:60px auto;padding:22px;border:2px solid #dc2626;border-radius:14px;background:#fff;color:#111;font-family:inherit';
    box.setAttribute('dir', 'rtl');
    box.innerHTML =
      '<div style="font-size:17px;font-weight:800;color:#b91c1c;margin-bottom:8px">' +
      'تعذّر تشغيل التطبيق — أرسل النص لمدير النظام:</div>' +
      '<pre style="white-space:pre-wrap;direction:ltr;text-align:left;font-size:12px;background:#f8fafc;padding:12px;border-radius:8px;overflow:auto;max-height:240px">' +
      esc(window.__nibrasBootErr || 'لا يوجد نص خطأ — تعطّل قبل تسجيل السكربت') +
      '</pre>' +
      '<button onclick="location.reload()" style="margin-top:12px;padding:8px 16px">إعادة المحاولة</button>';
    (document.body || document.documentElement).appendChild(box);
  }, 7000);
})();
</script>

  .dash-stat-lbl { font-size:11.5px; color:var(--muted); font-weight:700; margin:2px 0 0; }
  .dash-stat-sub { font-size:10px; color:var(--muted); margin-top:2px; }
  .dash-grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px; }
  .dash-panel { background:#fff; border:1px solid var(--line); border-radius:16px; padding:14px 16px; }
  .dash-panel-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; gap:8px; }
  .dash-panel-title { font-size:14px; font-weight:800; color:var(--text); margin:0; display:flex; align-items:center; gap:7px; }
  .dash-panel-more { font-size:11.5px; color:var(--blue); font-weight:700; white-space:nowrap; }
  .dash-needs-item { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:10px; cursor:pointer; transition:background .1s; }
  .dash-needs-item:hover { background:var(--light); }
  .dash-needs-ico { width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
  .dash-needs-txt { flex:1; min-width:0; }
  .dash-needs-name { font-size:12.5px; font-weight:700; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dash-needs-meta { font-size:10.5px; color:var(--muted); margin-top:1px; }
  .dash-needs-num { font-size:15px; font-weight:800; flex-shrink:0; }

  /* ===== «نبراس يرى» — لوحة المؤشرات الذكية =====
     لا لون خاص بها إطلاقًا: تأخذ من ثيم المدرسة (--primary/--accent/--primary-light
     من .theme-school) ومن أسطح .card الموجودة، فتبقى جزءًا من الواجهة لا رقعةً
     ملونة فوقها. الألوان الداكنة (أحمر/برتقالي/بنفسجي) للرقم فقط، لأنها تحكي
     درجة الاستحقاق؛ والبقية أبيض كما في كل لوحات اللوحة. */
  .nbr-wrap { margin-bottom:14px; }
  .nbr-panel { background:#fff; border:1px solid var(--border-color,#fce7f3);
    border-radius:16px; padding:14px 16px; }
  .nbr-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px; }
  .nbr-head-l { display:flex; align-items:center; gap:11px; min-width:0; }
  .nbr-logo { width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center;
    font-size:20px; flex-shrink:0; color:#fff;
    background:linear-gradient(135deg,var(--primary,#be185d),var(--accent,#db2777));
    box-shadow:0 4px 10px -4px rgba(190,24,93,.5); }
  .nbr-title { margin:0; font-size:14px; font-weight:800; color:var(--primary,#be185d);
    display:flex; align-items:center; gap:7px; }
  .nbr-sub { margin:1px 0 0; font-size:11.5px; color:var(--muted); }
  .nbr-link { font-size:11.5px; font-weight:700; color:var(--accent,#db2777); white-space:nowrap; }
  .nbr-link:hover { text-decoration:underline; }
  .nbr-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  .nbr-card { display:flex; align-items:center; gap:11px; min-width:0; cursor:pointer; text-align:right;
    padding:11px 12px; border-radius:12px; background:var(--light,#f4f8fc);
    border:1px solid var(--line,#e4edf5); transition:background .12s, border-color .12s; }
  .nbr-card:hover { background:var(--primary-light,#fdf2f8); border-color:var(--border-color,#fce7f3); }
  .nbr-ico { width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    font-size:17px; flex-shrink:0; }
  .nbr-body { flex:1; min-width:0; }
  .nbr-name { font-size:12.5px; font-weight:700; color:var(--text); }
  .nbr-meta { font-size:10.5px; color:var(--muted); margin-top:2px; line-height:1.5;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .nbr-num { font-size:19px; font-weight:800; line-height:1; flex-shrink:0; }
  .nbr-bar { margin-top:11px; height:4px; border-radius:999px; background:var(--light,#f4f8fc); overflow:hidden; }
  .nbr-bar span { display:block; height:100%; border-radius:999px;
    background:linear-gradient(90deg,var(--primary,#be185d),var(--accent,#db2777)); }
  .nbr-foot { margin-top:9px; font-size:10.5px; color:var(--muted); }
  @media (max-width:820px){ .nbr-grid { grid-template-columns:1fr; } }
  @media (max-width:700px){ .nbr-head { flex-wrap:wrap; } }

  .dash-activity-item { display:flex; align-items:center; gap:10px; padding:7px 6px; border-radius:10px; cursor:pointer; }
  .dash-activity-item:hover { background:var(--light); }
  .dash-activity-ico { width:38px; height:38px; border-radius:12px; background:var(--light); display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
  .dash-activity-name { font-size:13px; font-weight:700; color:var(--text); }
  .dash-activity-meta { font-size:11px; color:var(--muted); margin-top:1px; }
  .dash-bottom { display:grid; grid-template-columns:1fr 1.6fr; gap:12px; margin-bottom:14px; }
  .dash-mid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .dash-donut-wrap { display:flex; align-items:center; gap:16px; }
  .dash-donut { width:128px; height:128px; border-radius:50%; position:relative; flex-shrink:0; }
  .dash-donut::after { content:''; position:absolute; inset:22px; background:#fff; border-radius:50%; box-shadow:0 0 0 1px var(--line); }
  .dash-donut-center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:1; }
  .dash-donut-center b { font-size:20px; color:var(--text); }
  .dash-donut-center span { font-size:10px; color:var(--muted); }
  .act-flex { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .act-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; }
  .act-block { border:1px solid var(--line); border-radius:14px; padding:12px; min-width:0; }
  .dash-legend { display:flex; flex-direction:column; gap:7px; font-size:12px; color:var(--text); min-width:0; }
  .dash-legend .row { display:flex; align-items:center; gap:7px; white-space:nowrap; }
  .dash-legend .swatch { width:11px; height:11px; border-radius:3px; flex-shrink:0; }
  .dash-legend b { margin-inline-start:auto; font-weight:800; }
  .att-card { padding:0; display:grid; grid-template-columns:1fr 1fr; }
  .att-group { padding:14px 16px 16px; min-width:0; }
  .att-group + .att-group { border-inline-start:1px solid var(--line); }
  .att-group-title { font-weight:800; font-size:13px; color:var(--text); margin:0 0 10px; display:flex; align-items:center; gap:6px; }
  .att-flex { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .att-pct { display:flex; flex-direction:column; align-items:center; min-width:66px; cursor:pointer; }
  .att-pct b { font-size:26px; font-weight:800; color:#059669; line-height:1; }
  .att-pct span { font-size:10px; color:var(--muted); margin-top:3px; }
  .att-legend { display:flex; flex-direction:column; gap:6px; font-size:12px; color:var(--text); min-width:0; }
  .att-legend .row { display:flex; align-items:center; gap:7px; white-space:nowrap; }
  .att-legend .swatch { width:11px; height:11px; border-radius:3px; flex-shrink:0; }
  .att-legend b { margin-inline-start:auto; font-weight:800; }
  .att-report-btn { display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%; border:none; background:transparent; color:#2563eb; font-size:12px; font-weight:700; cursor:pointer; padding:10px 16px; border-top:1px solid var(--line); font-family:inherit; }
  .att-report-btn.colA { grid-column:1 / 2; }
  .att-report-btn.colB { grid-column:2 / 3; }
  .att-report-btn:hover { color:#1d4ed8; background:var(--light); }
  .dash-tabs { display:flex; gap:6px; background:var(--light); border-radius:10px; padding:4px; }
  .dash-tab { flex:1; border:none; background:transparent; border-radius:8px; padding:7px 10px; font-size:12.5px; font-weight:800; color:var(--muted); cursor:pointer; font-family:inherit; }
  .dash-tab.active { background:#fff; color:var(--navy); box-shadow:0 2px 6px rgba(15,70,120,.12); }
  .dash-leader-row { display:flex; align-items:center; gap:8px; padding:7px 4px; border-bottom:1px dashed var(--line); }
  .dash-leader-row:last-child { border-bottom:none; }
  .dash-leader-medal { font-size:15px; width:22px; text-align:center; flex-shrink:0; }
  .dash-leader-name { font-weight:700; font-size:13px; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dash-leader-meta { font-size:10.5px; color:var(--muted); margin-top:1px; }
  .dash-leader-pts { margin-inline-start:auto; font-weight:800; font-size:13px; flex-shrink:0; }
  .nibras-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:8px; }
  @media (max-width:560px){ .nibras-grid { grid-template-columns:repeat(2,1fr); } }
  .app-footer { background:#fff; border-top:1px solid var(--line); padding:10px 16px; text-align:center; font-size:11px; color:var(--muted); }
  @media (max-width:1180px){ .dash-stats { grid-template-columns:repeat(3,1fr); } .dash-bottom { grid-template-columns:1fr; } }
  @media (max-width:900px){ .topbar-search { display:none; } }
  @media (max-width:820px){ .dash-hero { grid-template-columns:1fr; } .dash-grid2 { grid-template-columns:1fr; } .dash-bottom { grid-template-columns:1fr; } .dash-mid { grid-template-columns:1fr; } }
  @media (max-width:700px){ .layout .main { padding:12px; } .dash-greet { flex-wrap:wrap; } .dash-status { flex-wrap:wrap; } .topbar-actions { gap:8px; } .topbar-brand p { display:none; } }
  @media (max-width:560px){ .dash-stats { grid-template-columns:repeat(2,1fr); } .att-card { grid-template-columns:1fr; } .att-group + .att-group { border-inline-start:none; border-top:1px solid var(--line); } .att-report-btn.colA, .att-report-btn.colB { grid-column:auto; } .topbar-brand h1 { font-size:13px; } .topbar-logo { width:36px; height:36px; } .topbar-actions .btn-secondary { padding:6px 9px; font-size:12px; } .topbar-user-name { font-size:12px; } .topbar-user-role { font-size:10.5px; } .act-grid { grid-template-columns:repeat(3,minmax(0,1fr)); } }
  @media (max-width:380px){ .topbar-brand h1 { font-size:12px; } .topbar-actions .topbar-user-block { display:none; } }
  .pw-wrap { position:relative; display:block; }
  .pw-wrap .pw-toggle { position:absolute; top:50%; inset-inline-end:8px; transform:translateY(-50%); border:none; background:transparent; cursor:pointer; font-size:16px; line-height:1; color:var(--muted); padding:4px; z-index:2; }
  .pw-wrap .pw-toggle:hover { color:var(--text); }
  .pw-wrap input.input { padding-inline-end:38px !important; }

  if(isIOS){
    html = '<div class="modal-head"><h3>📲 إضافة نبراس إلى شاشة الآيفون</h3><button class="modal-close" onclick="closeInstallGuide()">✕</button></div>' +
      '<div style="display:flex;flex-direction:column;gap:10px">' +
      step('1', 'اضغط زر «مشاركة» ⬆', 'في المتصفح (سفاري) أسفل الشاشة تجد زر المشاركة على شكل مربع مع سهم لأعلى — اضغط عليه.') +
      step('2', 'اختر «إضافة إلى الشاشة الرئيسية»', 'من القائمة المنبثقة ابحث عن خيار «إضافة إلى الشاشة الرئيسية» (Add to Home Screen) واضغط عليه.') +
      step('3', 'اضغط «إضافة»', 'سيُطلب منك تأكيد الاسم — اضغط «إضافة» أعلى اليمين، وستجد الأيقونة على شاشتك الرئيسية.') +
      '</div>';
  } else {
    html = '<div class="modal-head"><h3>📲 تثبيت نبراس على جهازك</h3><button class="modal-close" onclick="closeInstallGuide()">✕</button></div>' +
      '<div style="display:flex;flex-direction:column;gap:10px">' +
      step('1', 'اضغط زر «تثبيت» أدناه', 'سيعرض المتصفح نافذة تأكيد التثبيت.') +
      step('2', 'اضغط «تثبيت» في النافذة', 'ستضاف أيقونة نبراس إلى الشاشة الرئيسية.') +
      '<button class="btn-primary" style="margin-top:4px" onclick="doInstallApp()">⬇ تثبيت التطبيق الآن</button>' +
      '</div>';
  }
  overlay.innerHTML = '<div class="modal-box" style="max-width:460px">' + html + '</div>';
  overlay.onclick = function(e){ if(e.target === overlay) closeInstallGuide(); };
  document.body.appendChild(overlay);
}
function closeInstallGuide(){
  var ov = document.querySelector('.modal-overlay');
  if(ov) ov.remove();
}
function maybeShowInstallHint(force){
  try{
    if(!force && localStorage.getItem('nibrasBoysInstallHintDismissed')) return;
    var standalone = window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
    if(standalone) return;
    if(!document.body){ setTimeout(function(){ maybeShowInstallHint(force); }, 300); return; }
    var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    var isAndroid = /Android/.test(navigator.userAgent);
    var canInstall = __deferredInstallPrompt || isIOS || isAndroid;
    if(!canInstall) return;
    removeInstallHint();
    var d = document.createElement('div');
    d.id = 'installHintBar';
    d.className = 'install-hint';
    var tip = isIOS
      ? 'اضغط زر «مشاركة» ⬆ في المتصفح ثم «إضافة إلى الشاشة الرئيسية»'
      : 'ثبّت التطبيق على جهازك لفتحه من الشاشة الرئيسية';
    d.innerHTML = '<span style="font-size:20px">📲</span><span>' + tip + '</span><button class="btn-primary" style="padding:6px 14px;font-size:13px;flex-shrink:0" onclick="' + (isIOS ? 'openInstallGuide()' : 'doInstallApp()') + '">' + (isIOS ? 'كيف أثبّت؟' : 'تثبيت') + '</button><button class="close" title="إغلاق" onclick="dismissInstallHint()">✕</button>';
    document.body.appendChild(d);
  }catch(e){}
}
setTimeout(function(){ maybeShowInstallHint(false); }, 1200);
</script>
